<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة مدير النظام</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body {
            background: radial-gradient(circle at 50% 0%, #1f2937 0%, #0f1a2e 60%);
            font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;
        }
        .login-card {
            background: var(--navy-800); padding: 2.75rem 2.25rem; border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg); width: 100%; max-width: 400px; text-align: center; color: white;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .login-badge {
            width: 65px; height: 65px; border-radius: 16px; margin: 0 auto 1rem;
            background: #fff; padding: 5px; object-fit: contain; box-shadow: var(--shadow-sm);
        }
        .login-card h3 { color: #fff; }
        .login-card .form-label { color: rgba(255,255,255,0.75); }
        .login-card .form-control { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); color: #fff; }
        .login-card .form-control:focus { background: rgba(255,255,255,0.09); color: #fff; }
        .btn-login {
            background-color: var(--gold-500); color: var(--navy-900); font-weight: 800; width: 100%;
            margin-top: 1.25rem; border: none; padding: 0.65rem; border-radius: var(--radius-sm);
            transition: var(--transition);
        }
        .btn-login:hover { background-color: var(--gold-400); color: var(--navy-900); }
        .error-msg { color: #ff8a80; font-size: 0.9rem; font-weight: 700; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="/static/img/logo.png" alt="المعماريون السعوديون" class="login-badge">
        <h3 class="mb-4">لوحة تحكم الإدارة</h3>
        <form action="/admin" method="post">
            <div class="mb-3 text-start">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" class="form-control" name="username" required autocomplete="off">
            </div>
            <div class="mb-3 text-start">
                <label class="form-label">كلمة المرور</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            <button type="submit" class="btn-login">دخول آمن</button>
        </form>
    </div>
</body>
</html>
