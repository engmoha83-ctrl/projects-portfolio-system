<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة مدير النظام</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body { background-color: #212529; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: #343a40; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; color: white; border: 1px solid #495057; }
        .btn-login { background-color: #d4a373; color: #1a2b4c; font-weight: bold; width: 100%; margin-top: 20px; }
        .btn-login:hover { background-color: #faedcd; color: #1a2b4c; }
        .error-msg { color: #ff6b6b; font-size: 0.9rem; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="mb-4">🔐 لوحة تحكم الإدارة</h3>
        <form action="/admin" method="post">
            <div class="mb-3 text-start">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" class="form-control" name="username" required autocomplete="off">
            </div>
            <div class="mb-3 text-start">
                <label class="form-label">كلمة المرور</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            <button type="submit" class="btn btn-login">دخول آمن</button>
        </form>
    </div>
</body>
</html>
