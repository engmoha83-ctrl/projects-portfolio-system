}
function nudgeSelected(dx, dy){
  const ws = selWidgets(); if(!ws.length) return;
  ws.forEach(w => {
    w.x = Math.max(0, Math.min(S.page.w - w.w, w.x + dx));
    w.y = Math.max(0, Math.min(S.page.h - w.h, w.y + dy));
    drawWidget(w);
  });
  buildPropsTab();
}
function removeWidget(id){
  snapshot();
  if(S.charts[id]){ try{ S.charts[id].destroy(); }catch(e){} delete S.charts[id]; }
  if(S.partsSeen) delete S.partsSeen[id];
  S.widgets = S.widgets.filter(w => w.id !== id);
  const el = document.getElementById(id); if(el) el.remove();
  S.multi = S.multi.filter(x => x !== id);
  if(S.selected === id) S.selected = S.multi[S.multi.length - 1] || null;
  buildPropsTab(); buildLayersList();
}
function duplicateWidget(id){
  const src = S.widgets.find(w => w.id === id); if(!src) return;
  snapshot();
  const w = clone(src); w.id = uid(); w.x = snap(src.x + 20); w.y = snap(src.y + 20);
  S.widgets.push(w); drawWidget(w); select(w.id);
}
function getW(id){ return S.widgets.find(w => w.id === id); }

function snap(v){ return S.page.snap ? Math.round(v / S.page.grid) * S.page.grid : Math.round(v); }

/* هل وقع الضغط على شريط تمرير داخلي؟ (الشريط خارج clientWidth/clientHeight،
   وفي RTL يكون الشريط الرأسي على اليسار فتصبح offsetX سالبة) */
function onScrollbar(ev){
  const n = ev.target;
  if(!n || n.nodeType !== 1) return false;
  const vs = n.scrollHeight > n.clientHeight, hs = n.scrollWidth > n.clientWidth;
  return (vs && (ev.offsetX > n.clientWidth  || ev.offsetX < 0)) ||
         (hs && (ev.offsetY > n.clientHeight || ev.offsetY < 0));
}
/* إعادة الرسم تمسح محتوى العنصر، فنحفظ مواضع التمرير الداخلية ونعيدها بعدها */
const SCROLL_SEL = '.dt-wrap,.rk-wrap,.obs-scroll,.obs-cards,.txt-visual';
function grabScroll(box){
  return box ? Array.from(box.querySelectorAll(SCROLL_SEL)).map(n => [n.scrollTop, n.scrollLeft]) : null;
}
function putScroll(box, saved){
  if(!box || !saved || !saved.length) return;
  Array.from(box.querySelectorAll(SCROLL_SEL)).forEach((n, i) => {
    if(saved[i]){ n.scrollTop = saved[i][0]; n.scrollLeft = saved[i][1]; }
  });
}

function drawWidget(w){
  let el = document.getElementById(w.id);
  if(!el){
    el = document.createElement('div');
    el.className = 'bw'; el.id = w.id;
    el.innerHTML = `<div class="bw-title"></div><div class="bw-body"></div>
      <div class="bw-tools">
        <button data-a="dup" title="تكرار">⧉</button>
        <div class="dpad" title="تبديل المكان مع القالب المجاور">
          <button data-swap="up"    style="grid-area:u" title="تبديل المكان مع الذي بالأعلى">▲</button>
          <button data-swap="left"  style="grid-area:l" title="تبديل المكان مع الذي على اليسار">◀</button>
          <button data-swap="right" style="grid-area:r" title="تبديل المكان مع الذي على اليمين">▶</button>
          <button data-swap="down"  style="grid-area:d" title="تبديل المكان مع الذي بالأسفل">▼</button>
        </div>
        <button data-a="del" class="del" title="حذف">🗑</button>
      </div>` +
      ['nw','n','ne','e','se','s','sw','w'].map(d => `<div class="hnd" data-d="${d}"></div>`).join('');
    page.appendChild(el);
    el.querySelectorAll('.hnd').forEach(h =>
      h.addEventListener('mousedown', e => startResize(e, w.id, h.dataset.d)));
    el.querySelectorAll('.bw-tools button').forEach(b => b.addEventListener('mousedown', e => {
      e.stopPropagation(); e.preventDefault();
      const a = b.dataset.a;
      if(b.dataset.swap) swapNeighbour(w.id, b.dataset.swap);
      else if(a === 'del') removeWidget(w.id);
      else if(a === 'dup') duplicateWidget(w.id);
    }));
    el.addEventListener('mousedown', ev => {
      if(ev.target.closest('.hnd, .bw-tools')) return;             // تُعالَج في مكانها
      if(document.body.classList.contains('presenting')) return;   // وضع العرض: لا سحب
      if(el.classList.contains('editing')){ smartSelect(w.id, ev); return; }  // كتابة داخل العنصر
      if(onScrollbar(ev)){ smartSelect(w.id, ev); return; }        // سحب شريط التمرير لا يحرّك القالب
      startDrag(ev, w.id);                                          // يستدعي التحديد بنفسه
    });
    el.addEventListener('dblclick', function(ev){
      if(el.classList.contains('editing')) return;
      var titleEl = el.querySelector('.bw-title');
      if(w.title.show && titleEl){
        var tr = titleEl.getBoundingClientRect();
        if(ev.clientY <= tr.bottom){ startInlineEdit(w, titleEl, 'title'); return; }
      }
      if(w.type === 'text'){
        var v = el.querySelector('.txt-visual');
        if(v) startInlineEdit(w, v, 'content');
      }
    });
  }
  el.style.left = w.x + 'px'; el.style.top = w.y + 'px';
  el.style.width = w.w + 'px'; el.style.height = w.h + 'px';
  el.style.background = w.style.bg;
  el.style.color = w.style.color || theme().text;
  el.style.fontFamily = w.style.font || FONTS[0].v;
  el.style.fontSize = (w.style.fontSize || 13) + 'px';
  el.style.opacity = w.style.opacity;
  el.style.borderRadius = w.style.radius + 'px';
  el.style.boxShadow = w.style.shadow ? '0 4px 14px rgba(15,26,46,.10)' : 'none';
  el.style.border = w.style.border.show ? `${w.style.border.width}px solid ${w.style.border.color}` : 'none';

  const tEl = el.querySelector('.bw-title');
  if(w.title.show){
    tEl.style.display = 'block'; tEl.textContent = bi(w.title, 'text');
    tEl.style.font = `${w.title.weight} ${w.title.size}px ${w.title.font}`;
    tEl.style.color = w.title.color; tEl.style.background = w.title.bg;
    tEl.style.textAlign = w.title.align;
    tEl.style.borderRadius = `${w.style.radius}px ${w.style.radius}px 0 0`;
  } else tEl.style.display = 'none';

  const body = el.querySelector('.bw-body');
  const keepScroll = grabScroll(body);
  try{ VISUALS[w.type].render(body, w); }
  catch(err){ body.innerHTML = `<div class="empty-note">${tr('renderError')}: ${err.message}</div>`; }
  putScroll(body, keepScroll);                // لا يقفز الجدول لأوله مع كل تحديث
  setTimeout(() => refreshParts(w), 0);       // أجزاء HTML جاهزة فوراً
}
/* الكتابة مباشرة داخل العنصر على الصفحة (ضغطتين على النص أو على شريط العنوان) */
function startInlineEdit(w, node, field){
  const el = document.getElementById(w.id);
  if(!el || !node) return;
  select(w.id);
  el.classList.add('editing');

  const key = biKey(field === 'title' ? 'text' : 'content');
  if(field === 'content' && !String(w.opts[key] || '').trim()){
    node.textContent = '';                      // امسح النص التلميحي
    node.classList.remove('txt-placeholder');
  }
  node.setAttribute('contenteditable', 'true');

  const tip = document.createElement('div');
  tip.className = 'bw-edit-tip';
  tip.textContent = field === 'title' ? tr('editTitleTip') : tr('editTextTip');
  el.appendChild(tip);

  node.focus();
  const rng = document.createRange(); rng.selectNodeContents(node);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rng);

  let cancelled = false, done = false;
  function finish(){
    if(done) return; done = true;
    node.removeEventListener('blur', onBlur);
    node.removeEventListener('keydown', onKey);
    node.removeAttribute('contenteditable');
    el.classList.remove('editing');
    if(tip.parentNode) tip.remove();
    if(!cancelled){
      const val = (node.innerText || '').replace(/\u00a0/g, ' ').replace(/\n$/, '');
      const cur = (field === 'title') ? w.title[key] : w.opts[key];
      if(val !== (cur || '')){
        snapshot();
        if(field === 'title') w.title[key] = val; else w.opts[key] = val;
      }
    }
    drawWidget(w); buildPropsTab(); buildLayersList();
  }
  function onBlur(){ finish(); }
  function onKey(e){
    e.stopPropagation();                        // لا تصل لاختصارات الصفحة (Delete وغيرها)
    if(e.key === 'Escape'){ cancelled = true; node.blur(); }
    else if(e.key === 'Enter' && (field === 'title' || e.ctrlKey)){ e.preventDefault(); node.blur(); }
  }
  node.addEventListener('blur', onBlur);
  node.addEventListener('keydown', onKey);
}

/* تبديل الخانة مع القالب المجاور في اتجاه السهم.
   يُبدَّل الموضع **والمقاس** معاً: كل قالب يأخذ خانة الآخر بالضبط. تبديل الموضع
   وحده كان يسبب تراكباً وفراغات حين يختلف مقاس القالبين — وهو ما حدث فعلاً.
   واختيار الجار يتم على مرحلتين: من يتقاطع معك على المحور العمودي على الاتجاه
   أولاً (وهو الجار الحقيقي في الشبكة)، وإلا الأقرب داخل مخروط ٤٥°. */
function pickNeighbour(a, dir){
  const ac = {x:a.x + a.w / 2, y:a.y + a.h / 2};
  const rows = [], cone = [];
  S.widgets.forEach(b => {
    if(b.id === a.id) return;
    const bc = {x:b.x + b.w / 2, y:b.y + b.h / 2};
    const dx = bc.x - ac.x, dy = bc.y - ac.y;
    const vert = (dir === 'up' || dir === 'down');
    const along  = (dir === 'up') ? -dy : (dir === 'down') ? dy : (dir === 'left') ? -dx : dx;
    const across = vert ? Math.abs(dx) : Math.abs(dy);
    const overlap = vert ? Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)
                         : Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if(along <= 4) return;
    if(overlap > Math.min(vert ? a.w : a.h, vert ? b.w : b.h) * 0.25) rows.push({b, along, across});
    else if(across <= along) cone.push({b, along, across});
  });
  const pool = rows.length ? rows : cone;
  if(!pool.length) return null;
  pool.sort((p, q) => (p.along - q.along) || (p.across - q.across));
  return pool[0].b;
}
function swapNeighbour(id, dir){
  const a = getW(id); if(!a) return;
  const best = pickNeighbour(a, dir);
  if(!best){ toast('لا يوجد قالب في هذا الاتجاه', true); return; }
  snapshot();
  const box = {x:a.x, y:a.y, w:a.w, h:a.h};
  a.x = best.x; a.y = best.y; a.w = best.w; a.h = best.h;
  best.x = box.x; best.y = box.y; best.w = box.w; best.h = box.h;
  [a, best].forEach(o => {
    o.w = Math.max(90, Math.min(S.page.w, o.w));
    o.h = Math.max(60, Math.min(S.page.h, o.h));
    o.x = Math.max(0, Math.min(S.page.w - o.w, o.x));
    o.y = Math.max(0, Math.min(S.page.h - o.h, o.y));
    drawWidget(o);
  });
  paintSelection(); buildPropsTab();
}
/* خطوة واحدة في ترتيب التراكب — لا قفز للمقدمة أو للخلف تماماً */
function moveLayer(id, dir){
  const i = S.widgets.findIndex(w => w.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= S.widgets.length) return false;
  snapshot();
  const t = S.widgets[i]; S.widgets[i] = S.widgets[j]; S.widgets[j] = t;
  S.widgets.forEach(w => { const el = document.getElementById(w.id); if(el) page.appendChild(el); });
  return true;
}
function reorderModel(id, dir){
  const i = S.widgets.findIndex(w => w.id === id); if(i < 0) return;
  const [w] = S.widgets.splice(i, 1);
  if(dir > 0) S.widgets.push(w); else S.widgets.unshift(w);
}
/* يملأ أي خصائص/خيارات ناقصة في العناصر القادمة من قوالب محفوظة بنسخة أقدم.
   بدون هذا تظهر القوالب القديمة بخيارات مفقودة (مثل قائمة الحقول أو إعدادات الأرقام). */
function normalizeWidget(w){
  const t = VISUALS[w.type];
  if(!t) return w;
  w.opts  = Object.assign(clone(t.opts || {}), w.opts || {});
  w.parts = w.parts || {};                       // تنسيق الأجزاء — فارغ = يرث من القالب
  if(DL_TYPES.indexOf(w.type) >= 0){
    w.opts.dl = Object.assign({}, DL_DEFAULT, w.opts.dl || {});
    /* قوالب محفوظة بنسخة أقدم كانت تحفظ تنسيق الأرقام داخل opts.dl —
       ننقله مرة واحدة إلى parts.dataLabels ليصبح المصدر واحداً. */
    const d = w.opts.dl;
    if(!w.parts.dataLabels){
      const mig = {};
      if(d.size   && d.size   !== DL_DEFAULT.size)   mig.size   = +d.size;
      if(d.weight && d.weight !== DL_DEFAULT.weight) mig.weight = +d.weight;
      if(d.color)                                    mig.color  = d.color;
      if(d.bg && d.bgColor)                          mig.bg     = d.bgColor;
      if(Object.keys(mig).length) w.parts.dataLabels = mig;
    }
    w.opts.dl = {show: d.show !== false};
  }
  w.opts.itemColors = w.opts.itemColors || {};   // ألوان مستقلة لكل عمود/شريحة
  w.style = Object.assign({bg:theme().widgetBg, color:theme().text, font:FONTS[0].v, fontSize:13,
                           opacity:1, radius:10, shadow:true}, w.style || {});
  w.style.border = Object.assign({show:true, color:theme().border, width:1}, w.style.border || {});
  w.title = Object.assign({show:t.titleShow !== false, text:t.title || t.name,
                           text_en:t.title_en || t.title || t.name, font:FONTS[0].v, size:14,
                           weight:700, color:theme().titleColor, bg:theme().titleBg, align:'start'},
                          w.title || {});
  if(w.title.text_en === undefined) w.title.text_en = t.title_en || w.title.text;
  return w;
}

function renderAll(){
  Object.values(S.charts).forEach(c => { try{ c.destroy(); }catch(e){} });
  S.charts = {}; S.partsSeen = {}; page.innerHTML = '';
  applyPageStyle();
  S.widgets.forEach(normalizeWidget);
  S.widgets.forEach(drawWidget);
  S.multi = S.multi.filter(id => S.widgets.some(w => w.id === id));
  if(S.selected && S.multi.indexOf(S.selected) < 0) S.selected = S.multi[S.multi.length - 1] || null;
  paintSelection();
  buildLayersList();
}
/* «منذ كذا» يتقادم مع الوقت — نُحدِّث بطاقات التاريخ وحدها كل دقيقة بلا إعادة رسم كاملة */
setInterval(() => {
  if(document.hidden) return;
  const live = S.widgets.filter(w => w.type === 'kpi' && w.opts && w.opts.field === UPD_FIELD
                                && ['rel','both','datetime'].includes(w.opts.updFormat || 'datetime'));
  live.forEach(w => {
    const el = document.getElementById(w.id);
    const body = el && el.querySelector('.bw-body');
    if(body) try{ VISUALS.kpi.render(body, w); }catch(e){}
  });
}, 60000);

function paintSelection(){
  document.querySelectorAll('.bw').forEach(e => {
    e.classList.toggle('selected', S.multi.indexOf(e.id) >= 0);
    e.classList.toggle('primary', e.id === S.selected);
  });
}
function selWidgets(){ return S.widgets.filter(w => S.multi.indexOf(w.id) >= 0); }
function selBounds(){
  const ws = selWidgets();
  if(!ws.length) return null;
  return {
    x1:Math.min(...ws.map(w => w.x)), y1:Math.min(...ws.map(w => w.y)),
    x2:Math.max(...ws.map(w => w.x + w.w)), y2:Math.max(...ws.map(w => w.y + w.h))
  };
}
function select(id, additive){
  if(id !== S.selected) S.itemIdx = 0;          // اختيار عنصر آخر يبدأ من أول لون
  if(!id){ S.multi = []; S.selected = null; }
  else if(additive){
    const i = S.multi.indexOf(id);
    if(i >= 0){
      if(S.multi.length > 1){ S.multi.splice(i, 1); S.selected = S.multi[S.multi.length - 1] || null; }
      else S.selected = id;
    }else{ S.multi.push(id); S.selected = id; }
  }else{ S.multi = [id]; S.selected = id; }
  paintSelection(); buildPropsTab(); buildLayersList();
}
/* اختيار ذكي عند الضغط: لا يكسر التحديد الجماعي عند بدء سحب المجموعة */
function smartSelect(id, e){
  const add = e && (e.ctrlKey || e.metaKey || e.shiftKey);
  if(add){ select(id, true); return; }
  if(S.multi.indexOf(id) >= 0 && S.multi.length > 1){
    S.selected = id; paintSelection(); buildPropsTab(); buildLayersList(); return;
  }
  select(id);
}

/* =====================================================================
   السحب والتحجيم + خطوط المحاذاة
   ===================================================================== */
let guides = [];
function clearGuides(){ guides.forEach(g => g.remove()); guides = []; }
function addGuide(dir, pos){
  const g = document.createElement('div'); g.className = 'guide ' + dir;
  if(dir === 'v') g.style.left = pos + 'px'; else g.style.top = pos + 'px';
  page.appendChild(g); guides.push(g);
}
function alignTargets(exceptId){
  const vs = [0, S.page.w/2, S.page.w], hs = [0, S.page.h/2, S.page.h];
  S.widgets.forEach(o => {
    if(o.id === exceptId) return;
    vs.push(o.x, o.x + o.w/2, o.x + o.w);
    hs.push(o.y, o.y + o.h/2, o.y + o.h);
  });
  return {vs, hs};
}
function magnet(val, targets, tol){
  let best = null, bd = tol;
  targets.forEach(t => { const d = Math.abs(val - t); if(d < bd){ bd = d; best = t; } });
  return best;
}

function startDrag(e, id){
  if(e.button !== 0) return;
  e.preventDefault(); smartSelect(id, e);
  const w = getW(id), el = document.getElementById(id);
  const sx = e.clientX, sy = e.clientY, ox = w.x, oy = w.y;
  const {vs, hs} = alignTargets(id);
  const group = selWidgets().filter(o => o.id !== id).map(o => ({w:o, ox:o.x, oy:o.y}));
  // حدود الحركة حتى لا يخرج أي عنصر من الصفحة
  const all = [{w, ox, oy}].concat(group);
  const dxMin = Math.max(...all.map(o => -o.ox)), dxMax = Math.min(...all.map(o => S.page.w - o.w.w - o.ox));
  const dyMin = Math.max(...all.map(o => -o.oy)), dyMax = Math.min(...all.map(o => S.page.h - o.w.h - o.oy));
  let moved = false;
  function mv(ev){
    if(!moved){ snapshot(); moved = true; }
    let nx = ox + (ev.clientX - sx) / S.zoom * (document.dir === 'rtl' ? 1 : 1);
    let ny = oy + (ev.clientY - sy) / S.zoom;
    clearGuides();
    if(!ev.altKey){
      if(S.page.snap && (S.page.snapMode || 'grid') === 'grid'){
        // الشبكة أولاً: الحركة دائماً بمضاعفات مقاس الخلية
        nx = snap(nx); ny = snap(ny);
        // خطوط إرشادية فقط عند التطابق الفعلي مع حواف العناصر الأخرى
        [nx, nx + w.w/2, nx + w.w].forEach(v => { if(vs.some(t => Math.abs(t - v) < 0.5)) addGuide('v', v); });
        [ny, ny + w.h/2, ny + w.h].forEach(v => { if(hs.some(t => Math.abs(t - v) < 0.5)) addGuide('h', v); });
      }else{
        const tol = 7;
        const mL = magnet(nx, vs, tol), mC = magnet(nx + w.w/2, vs, tol), mR = magnet(nx + w.w, vs, tol);
        if(mL !== null){ nx = mL; addGuide('v', mL); }
        else if(mC !== null){ nx = mC - w.w/2; addGuide('v', mC); }
        else if(mR !== null){ nx = mR - w.w; addGuide('v', mR); }
        else nx = snap(nx);
        const mT = magnet(ny, hs, tol), mM = magnet(ny + w.h/2, hs, tol), mB = magnet(ny + w.h, hs, tol);
        if(mT !== null){ ny = mT; addGuide('h', mT); }
        else if(mM !== null){ ny = mM - w.h/2; addGuide('h', mM); }
        else if(mB !== null){ ny = mB - w.h; addGuide('h', mB); }
        else ny = snap(ny);
      }
    }
    let dx = Math.round(nx) - ox, dy = Math.round(ny) - oy;
    dx = Math.max(dxMin, Math.min(dxMax, dx));
    dy = Math.max(dyMin, Math.min(dyMax, dy));
    if(!ev.altKey && S.page.snap && (S.page.snapMode || 'grid') === 'grid' && group.length){
      // مع التحديد المتعدد: اجعل الإزاحة نفسها من مضاعفات الخلية حتى تبقى العناصر على الشبكة
      const g = S.page.grid || 1;
      dx = Math.round(dx / g) * g; dy = Math.round(dy / g) * g;
      dx = Math.max(dxMin, Math.min(dxMax, dx)); dy = Math.max(dyMin, Math.min(dyMax, dy));
    }
    w.x = ox + dx; w.y = oy + dy;
    el.style.left = w.x + 'px'; el.style.top = w.y + 'px';
    group.forEach(o => {                       // نفس الإزاحة لباقي العناصر المحددة
      o.w.x = o.ox + dx; o.w.y = o.oy + dy;
      const e2 = document.getElementById(o.w.id);
      if(e2){ e2.style.left = o.w.x + 'px'; e2.style.top = o.w.y + 'px'; }
    });
  }
  function up(){
    document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
    clearGuides();
    if(!moved) return;                      // ضغطة بلا حركة: لا تُعِد الرسم إطلاقاً
    if(S.page.noOverlap && !group.length) resolveOverlap(w);
    drawWidget(w); group.forEach(o => drawWidget(o.w)); buildPropsTab();
  }
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
}

function startResize(e, id, dir){
  e.preventDefault(); e.stopPropagation();
  if(S.multi.indexOf(id) < 0 || S.multi.length === 1) select(id); else { S.selected = id; paintSelection(); }
  const w = getW(id), el = document.getElementById(id);
  const sx = e.clientX, sy = e.clientY;
  const o = {x:w.x, y:w.y, w:w.w, h:w.h};
  let moved = false;
  function mv(ev){
    if(!moved){ snapshot(); moved = true; }
    const dx = (ev.clientX - sx) / S.zoom, dy = (ev.clientY - sy) / S.zoom;
    let nx = o.x, ny = o.y, nw = o.w, nh = o.h;
    // الإحداثيات فيزيائية: w = الحافة اليسرى، e = الحافة اليمنى
    if(dir.includes('e'))  nw = o.w + dx;
    if(dir.includes('w')){ nw = o.w - dx; nx = o.x + dx; }
    if(dir.includes('n')){ nh = o.h - dy; ny = o.y + dy; }
    if(dir.includes('s')) nh = o.h + dy;
    nw = Math.max(90, nw); nh = Math.max(60, nh);
    if(!ev.altKey){
      if(S.page.snap && (S.page.snapMode || 'grid') === 'grid'){
        // الحواف المتحركة تقع على الشبكة، والحافة المقابلة تبقى ثابتة
        if(dir.includes('e')) nw = snap(o.x + nw) - o.x;
        if(dir.includes('s')) nh = snap(o.y + nh) - o.y;
        if(dir.includes('w')){ const left = snap(o.x + o.w - nw); nw = o.x + o.w - left; }
        if(dir.includes('n')){ const top  = snap(o.y + o.h - nh); nh = o.y + o.h - top; }
        nw = Math.max(90, nw); nh = Math.max(60, nh);
      }else{ nw = snap(nw); nh = snap(nh); }
    }
    // تثبيت الحافة المقابلة عند بلوغ الحد الأدنى أو بعد الالتصاق
    if(dir.includes('w')) nx = o.x + o.w - nw;
    if(dir.includes('n')) ny = o.y + o.h - nh;
    nx = Math.max(0, Math.min(nx, S.page.w - 90));
    ny = Math.max(0, Math.min(ny, S.page.h - 60));
    nw = Math.min(nw, S.page.w - nx); nh = Math.min(nh, S.page.h - ny);
    w.x = Math.round(nx); w.y = Math.round(ny);
    w.w = Math.round(nw); w.h = Math.round(nh);
    el.style.left = w.x + 'px'; el.style.top = w.y + 'px';
    el.style.width = w.w + 'px'; el.style.height = w.h + 'px';
  }
  function up(){
    document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
    drawWidget(w); buildPropsTab();
  }
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
}

function hit(a, b){ return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y); }
function resolveOverlap(w){
  let guard = 0;
  while(guard++ < 200){
    const c = S.widgets.find(o => o.id !== w.id && hit(w, o));
    if(!c) break;
    w.y = snap(c.y + c.h + 8);
    if(w.y + w.h > S.page.h){ w.y = snap(8); break; }
  }
}
function alignSelected(mode){
  const ws = selWidgets(); if(!ws.length) return;
  snapshot();
  // عنصر واحد => المحاذاة بالنسبة للصفحة، أكثر من عنصر => بالنسبة لحدود المجموعة
  const b = (ws.length > 1) ? selBounds() : {x1:0, y1:0, x2:S.page.w, y2:S.page.h};
  ws.forEach(w => {
    if(mode === 'start')   w.x = b.x1;
    if(mode === 'hcenter') w.x = Math.round((b.x1 + b.x2 - w.w) / 2);
    if(mode === 'end')     w.x = b.x2 - w.w;
    if(mode === 'top')     w.y = b.y1;
    if(mode === 'vcenter') w.y = Math.round((b.y1 + b.y2 - w.h) / 2);
    if(mode === 'bottom')  w.y = b.y2 - w.h;
    w.x = Math.max(0, Math.min(S.page.w - w.w, w.x));
    w.y = Math.max(0, Math.min(S.page.h - w.h, w.y));
    drawWidget(w);
  });
  buildPropsTab();
}
function distributeSelected(axis){
  const ws = selWidgets(); if(ws.length < 3) { toast('التوزيع يحتاج ٣ عناصر على الأقل', true); return; }
  snapshot();
  const key = axis === 'h' ? 'x' : 'y', size = axis === 'h' ? 'w' : 'h';
  const sorted = ws.slice().sort((a, b) => a[key] - b[key]);
  const first = sorted[0], last = sorted[sorted.length - 1];
  const span = (last[key] + last[size]) - first[key];
  const totalSize = sorted.reduce((t, w) => t + w[size], 0);
  const gap = (span - totalSize) / (sorted.length - 1);
  let pos = first[key];
  sorted.forEach(w => { w[key] = Math.round(pos); pos += w[size] + gap; drawWidget(w); });
  buildPropsTab();
}
function sameSizeSelected(what){
  const ws = selWidgets(); const p = getW(S.selected);
  if(ws.length < 2 || !p) return;
  snapshot();
  ws.forEach(w => {
    if(what !== 'h') w.w = p.w;
    if(what !== 'w') w.h = p.h;
    w.x = Math.min(w.x, S.page.w - w.w); w.y = Math.min(w.y, S.page.h - w.h);
    drawWidget(w);
  });
  buildPropsTab();
}
/* تطبيق تعديل تنسيق على كل العناصر المحددة بلقطة تراجع واحدة */
function applyToSel(fn, snap){
  const ws = selWidgets(); if(!ws.length) return;
  if(snap !== false) snapshot();
  ws.forEach(w => { fn(w); drawWidget(w); });
  buildLayersList();
}
function snapAllToGrid(){
  if(!S.widgets.length) return;
  snapshot();
  const g = S.page.grid || 1;
  S.widgets.forEach(w => {
    w.x = Math.max(0, Math.min(S.page.w - w.w, Math.round(w.x / g) * g));
    w.y = Math.max(0, Math.min(S.page.h - w.h, Math.round(w.y / g) * g));
    w.w = Math.max(90, Math.round(w.w / g) * g);
    w.h = Math.max(60, Math.round(w.h / g) * g);
    if(w.x + w.w > S.page.w) w.w = Math.max(90, S.page.w - w.x);
    if(w.y + w.h > S.page.h) w.h = Math.max(60, S.page.h - w.y);
  });
  renderAll();
  toast(`تمت محاذاة ${S.widgets.length} عنصر على شبكة ${g} بكسل`);
}
function autoArrange(){
  if(!S.widgets.length) return;
  snapshot();
  const pad = 12; let x = pad, y = pad, rowH = 0;
  S.widgets.forEach(w => {
    if(x + w.w + pad > S.page.w){ x = pad; y += rowH + pad; rowH = 0; }
    w.x = snap(x); w.y = snap(y); x += w.w + pad; rowH = Math.max(rowH, w.h);
  });
  renderAll(); toast('تم الترتيب التلقائي');
}

/* =====================================================================
   الصفحة والثيم
   ===================================================================== */
function applyLang(){
  const en = isEN();
  page.setAttribute('dir', en ? 'ltr' : 'rtl');
  page.setAttribute('lang', en ? 'en' : 'ar');
  const lab = $('#langLabel'); if(lab) lab.textContent = en ? 'English' : 'عربي';
}
function setLang(l){
  S.page.lang = (l === 'en') ? 'en' : 'ar';
  applyLang(); renderAll(); buildPropsTab(); buildPageTab();
  S.dirty = true;
  toast(isEN() ? 'Dashboard language: English' : 'لغة الداشبورد: العربية');
}
function applyPageStyle(){
  applyLang();
  page.style.width = S.page.w + 'px'; page.style.height = S.page.h + 'px';
  page.style.background = S.page.gradient && S.page.bg2
      ? `linear-gradient(${S.page.gradDir}deg, ${S.page.bg}, ${S.page.bg2})` : S.page.bg;
  page.style.setProperty('--gs', S.page.grid + 'px');
  page.classList.toggle('show-grid', S.page.showGrid);
  applyZoom();
}
function applyZoom(){
  const shell = $('#pageShell');
  shell.style.transform = 'none';                 // الحاوية لا تُكبَّر (كان يتضاعف التكبير)
  shell.style.width  = Math.round(S.page.w * S.zoom) + 'px';
  shell.style.height = Math.round(S.page.h * S.zoom) + 'px';
  page.style.transformOrigin = 'top left';
  page.style.transform = `scale(${S.zoom})`;      // الصفحة تُكبَّر من الركن فتملأ الحاوية بالضبط
  const pct = Math.round(S.zoom * 100);
  const sl = $('#zoomSlider'), inp = $('#zoomInput');
  if(sl) sl.value = Math.min(ZMAX * 100, Math.max(ZMIN * 100, pct));
  // نُحدِّث الخانة دائماً إلا أثناء الكتابة فيها نفسها (وإلا أُعيد تنسيق ما يكتبه المستخدم)
  if(inp && !ZTYPING) inp.value = pct;
}

const ZMIN = .15, ZMAX = 3;
let ZTYPING = false;          // يُرفع أثناء الكتابة في خانة النسبة فقط
const clampZoom = z => Math.max(ZMIN, Math.min(ZMAX, z));
/** يضبط التكبير مع إبقاء نقطة محدّدة من اللوحة ثابتة تحت المؤشر (للتكبير بالعجلة) */
function setZoom(z, anchor){
  const a = $('#canvasArea');
  const prev = S.zoom;
  S.zoom = clampZoom(z);
  if(S.zoom === prev) { applyZoom(); return; }
  let keep = null;
  if(anchor && a){
    const r = a.getBoundingClientRect();
    keep = {ox: anchor.x - r.left + a.scrollLeft, oy: anchor.y - r.top + a.scrollTop,
            vx: anchor.x - r.left, vy: anchor.y - r.top};
  }
  applyZoom();
  if(keep && a){
    const k = S.zoom / prev;
    a.scrollLeft = keep.ox * k - keep.vx;
    a.scrollTop  = keep.oy * k - keep.vy;
  }
}
function zoomFit(){
  const a = $('#canvasArea');
  const pad = document.body.classList.contains('presenting') ? 24 : 60;
  const zx = (a.clientWidth  - pad) / S.page.w;
  const zy = (a.clientHeight - pad) / S.page.h;
  S.zoom = Math.max(.15, Math.min(3, Math.min(zx, zy)));   // تملأ الشاشة بالعرض والارتفاع معاً
  applyZoom();
}
function applyThemeToAll(){
  const t = theme();
  snapshot();
  S.page.bg = t.pageBg;
  S.widgets.forEach(w => {
    w.style.bg = t.widgetBg; w.style.color = t.text; w.style.border.color = t.border;
    w.title.bg = t.titleBg; w.title.color = t.titleColor;
    if(w.type === 'kpi') w.opts.valueColor = '';
    if(w.type === 'text') w.opts.color = '';
  });
  renderAll(); buildPageTab();
}

          lists: Array.from(el.querySelectorAll(PANEL_SCROLL_SEL)).map(n => n.scrollTop)};

function partsHtml(w){
  const keys = partsOfWidget(w);
  if(!keys.length) return '';

  const tabs = keys.map(k => `<button class="part-tab ${k === open ? 'on' : ''}" data-part-tab="${k}">${
                 partName(k, w)}</button>`).join('');
  const p = partOf(w, open), caps = partCapsOf(w, open), pre = 'parts.' + open + '.';
  const has = c => caps.includes(c);
  const inherited = !(w.parts && w.parts[open] && w.parts[open].size);
  let body = `<div class="row2">
      <div class="mini"><span>حجم الخط${inherited ? ' <b class="inh">(موروث)</b>' : ''}</span>
        <input type="number" min="7" max="60" data-p="${pre}size" value="${p.size}"></div>

        <option value="400" ${p.weight == 400 ? 'selected' : ''}>عادي</option>
        <option value="600" ${p.weight == 600 ? 'selected' : ''}>متوسط</option>
        <option value="700" ${p.weight == 700 ? 'selected' : ''}>عريض</option>
        <option value="900" ${p.weight == 900 ? 'selected' : ''}>عريض جداً</option>
      </select></div>
    </div>
    ${ctlColor('لون النص', p.color || theme().text, null, pre + 'color')}`;

  if(has('align'))
    body += `<div class="row"><label>المحاذاة</label><div class="ctl"><select data-p="${pre}align">
      ${(open === 'yaxis' ? AX_ALIGNS : ALIGNS).map(([v, n]) =>
        `<option value="${v}" ${p.align === v ? 'selected' : ''}>${n}</option>`).join('')}
    </select></div></div>`;
  if(has('legendPos'))
    body += `<div class="row"><label>الموضع</label><div class="ctl"><select data-p="${pre}legendPos">
      ${LEG_POS.map(([v, n]) => `<option value="${v}" ${p.legendPos === v ? 'selected' : ''}>${n}</option>`).join('')}
    </select></div></div>`;
  if(has('pos'))
    body += `<div class="row"><label>موضع الرقم</label><div class="ctl"><select data-p="${pre}pos">
      ${DL_POS.map(([v, n]) => `<option value="${v}" ${p.pos === v ? 'selected' : ''}>${n}</option>`).join('')}
    </select></div></div>`;
  if(has('rotate'))
    body += `<div class="row"><label>ميل النص</label><div class="ctl">
      <input type="range" min="-90" max="90" step="5" data-p="${pre}rotate" value="${p.rotate === null ? 0 : p.rotate}">

  if(has('offset'))
    body += `<div class="row2">
      <div class="mini"><span>إزاحة أفقية</span><input type="number" min="-60" max="60" data-p="${pre}offsetX" value="${p.offsetX}"></div>

    </div>`;
  if(has('bg'))
    body += ctlColor('خلفية النص', p.bg || '#1a2b4c', null, pre + 'bg') +
      `<div class="btn-row"><button class="sbtn" data-part-clearbg="${open}">بدون خلفية</button></div>`;

  return `<div class="grp">
      <div class="grp-h">🎨 تنسيق أجزاء القالب <span class="hint-inline">اختر الجزء ثم عدّله</span></div>

      <div class="btn-row"><button class="sbtn" data-part-reset="${open}">إرجاع هذا الجزء للافتراضي</button></div>
    </div>`;

      <div class="grp-h" style="margin-top:10px;">توحيد المقاس (حسب العنصر الأخير المحدد)</div>
      <div class="btn-row">
        <button class="sbtn" data-size="w">نفس العرض</button>
        <button class="sbtn" data-size="h">نفس الارتفاع</button>
        <button class="sbtn" data-size="wh">الاثنين</button>
      </div>
    </div>

    <div class="grp">
      <div class="grp-h">تنسيق مشترك (يُطبَّق على الكل)</div>
      ${ctlColor('لون الخلفية', p.style.bg, null, 'style.bg')}
      ${ctlColor('لون النص', p.style.color || theme().text, null, 'style.color')}
      <div class="row"><label>خط القالب</label><div class="ctl"><select data-m="style.font">
        ${FONTS.map(f => `<option value="${f.v}" ${(p.style.font || FONTS[0].v) === f.v ? 'selected' : ''}>${f.n}</option>`).join('')}
      </select></div></div>
      <div class="row2">
        <div class="mini"><span>حجم النص</span><input type="number" min="8" max="30" data-m="style.fontSize" value="${p.style.fontSize || 13}"></div>
        <div class="mini"><span>الاستدارة</span><input type="number" min="0" max="30" data-m="style.radius" value="${p.style.radius}"></div>
      </div>
      <label class="chk"><input type="checkbox" data-m="style.shadow" ${p.style.shadow ? 'checked' : ''}> ظل خفيف</label>
      <label class="chk"><input type="checkbox" data-m="style.border.show" ${p.style.border.show ? 'checked' : ''}> إطار</label>
      <div class="row"><label>سماكة الإطار</label><div class="ctl">
        <input type="range" min="0" max="8" step="1" data-m="style.border.width" value="${p.style.border.width}"></div></div>
      ${ctlColor('لون الإطار', p.style.border.color, null, 'style.border.color')}
    </div>

    <div class="grp">
      <div class="grp-h">شريط العنوان (للكل)</div>
      <label class="chk"><input type="checkbox" data-m="title.show" ${p.title.show ? 'checked' : ''}> إظهار شريط العنوان</label>
      <div class="row"><label>الخط</label><div class="ctl"><select data-m="title.font">
        ${FONTS.map(f => `<option value="${f.v}" ${p.title.font === f.v ? 'selected' : ''}>${f.n}</option>`).join('')}
      </select></div></div>
      <div class="row"><label>الحجم</label><div class="ctl">
        <input type="number" min="8" max="40" data-m="title.size" value="${p.title.size}"></div></div>
      ${ctlColor('لون الخط', p.title.color, null, 'title.color')}
      ${ctlColor('خلفية العنوان', p.title.bg, null, 'title.bg')}
    </div>`;

  el.querySelectorAll('[data-mact]').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.mact === 'del') removeSelected(); else duplicateSelected();
  }));
  el.querySelectorAll('[data-al]').forEach(b => b.addEventListener('click', () => alignSelected(b.dataset.al)));
  el.querySelectorAll('[data-dist]').forEach(b => b.addEventListener('click', () => distributeSelected(b.dataset.dist)));
  el.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => sameSizeSelected(b.dataset.size)));

  el.querySelectorAll('[data-m]').forEach(inp => {
    const live = (inp.type === 'range');
    let pending = true;
    function apply(){
      let v = inp.type === 'checkbox' ? inp.checked : inp.value;
      if(inp.type === 'number' || inp.type === 'range') v = parseFloat(v) || 0;
      applyToSel(w => setPath(w, inp.dataset.m, v), pending);
      pending = false;
    }
    inp.addEventListener('focus', () => { pending = true; });
    if(live) inp.addEventListener('input', apply);
    inp.addEventListener('change', () => { apply(); pending = true; });
  });
  // منتقيات الألوان تُطبَّق على الكل أيضاً
  el.querySelectorAll('[data-cb]').forEach(inp => {
    inp.addEventListener('input', () => applyToSel(w => setPath(w, inp.dataset.cb, inp.value), false));
    inp.addEventListener('change', () => { snapshot(); });
  });
  el.querySelectorAll('[data-sw]').forEach(sw => sw.addEventListener('click', () => {
    applyToSel(w => setPath(w, sw.dataset.sw, sw.dataset.c));
    buildPropsTab();
  }));
}

      حدّثت في ذلك اليوم فقط)، والإنجاز متوسط مرجّح بقيمة العقد والصرف مجموع.</div>`;
  }
  if(w.type === 'topn'){
    const nums = FIELD_META.filter(f => ['number','percent','currency','days'].includes(f.type));
    const sel = o.fields || [];
    const fieldSel = `
      <div class="row"><label>المقياس</label><div class="ctl"><select data-p="opts.field">

        </optgroup>

function setPath(obj, path, val){
  const parts = path.split('.'); let o = obj;
  for(let i = 0; i < parts.length - 1; i++){
    if(o[parts[i]] === undefined || o[parts[i]] === null) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = val;
}
/* يحدّث حجم الجزء الموروث وعلامته فور تغيير الحجم الأساسي — بلا إعادة بناء
   اللوحة حتى لا يضيع تركيز الكتابة. */
function syncInherited(el, w){
  const box = el.querySelector('[data-p^="parts."][data-p$=".size"]');
  if(!box) return;
  const key = box.dataset.p.split('.')[1];
  const explicit = !!(w.parts && w.parts[key] && w.parts[key].size);
  if(!explicit) box.value = partOf(w, key).size;
  const cap = box.parentElement && box.parentElement.querySelector('span');
  if(!cap) return;
  const mark = cap.querySelector('.inh');
  if(explicit && mark) mark.remove();
  if(!explicit && !mark) cap.insertAdjacentHTML('beforeend', ' <b class="inh">(موروث)</b>');
}
function bindProps(el, w){
  el.querySelectorAll('[data-p]').forEach(inp => {
    const tag  = inp.tagName.toLowerCase();
    const live = (inp.type === 'range') || tag === 'textarea' || inp.type === 'text';
    let pending = true;                       // لقطة تراجع واحدة لكل جلسة كتابة

    function apply(){
      if(pending){ snapshot(); pending = false; }
      let v = inp.type === 'checkbox' ? inp.checked : inp.value;
      if(inp.type === 'number' || inp.type === 'range') v = parseFloat(v) || 0;
      if(['title.weight','opts.weight'].includes(inp.dataset.p)) v = parseInt(v);
      setPath(w, inp.dataset.p, v);
      // عنوان بطاقة المؤشر يتبع الحقل ما دام المستخدم لم يكتب عنواناً خاصاً به
      if(inp.dataset.p === 'opts.field' && w.type === 'kpi') kpiAutoTitle(w, v);
      if(['x','y','w','h'].includes(inp.dataset.p)){
        w[inp.dataset.p] = S.page.snap ? snap(v) : Math.round(v);   // القيم المكتوبة تلتصق بالشبكة أيضاً
        if(inp.dataset.p === 'w') w.w = Math.max(90, w.w);
        if(inp.dataset.p === 'h') w.h = Math.max(60, w.h);
        inp.value = w[inp.dataset.p];
      }
      drawWidget(w); buildLayersList();
      // أي حقل آخر مربوط بنفس المسار (الشريط وخانته) يتبع فوراً
      el.querySelectorAll(`[data-p="${inp.dataset.p}"]`).forEach(o => {
        if(o !== inp && o.value !== String(inp.value)) o.value = inp.value;
      });
      const lab = inp.parentElement && inp.parentElement.querySelector('.mini-val');
      if(lab) lab.textContent = inp.value + (/\.rotate$/.test(inp.dataset.p) ? '°' : '');
      if(inp.dataset.p === 'style.fontSize' || /^parts\..+\.size$/.test(inp.dataset.p))
        syncInherited(el, w);
      if(['opts.pair','opts.src','opts.mode','opts.group','opts.numMode','opts.scaleMode','opts.source','opts.display','opts.field','opts.pointsAs'].includes(inp.dataset.p)) buildPropsTab();
    }

    inp.addEventListener('focus', () => { pending = true; });
    if(live) inp.addEventListener('input', apply);     // معاينة فورية أثناء الكتابة
    inp.addEventListener('change', apply);
  });
  el.querySelectorAll('[data-cb]').forEach(inp => {
    inp.addEventListener('input', () => { setPath(w, inp.dataset.cb, inp.value); drawWidget(w); });
    inp.addEventListener('change', () => { snapshot(); });
  });
  el.querySelectorAll('[data-sw]').forEach(s => s.addEventListener('click', () => {
    snapshot(); setPath(w, s.dataset.sw, s.dataset.c); drawWidget(w); buildPropsTab();
  }));
  el.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => {
    snapshot(); setPath(w, b.dataset.set, b.dataset.v); drawWidget(w); buildPropsTab();
  }));
  el.querySelectorAll('[data-al]').forEach(b => b.addEventListener('click', () => alignSelected(b.dataset.al)));
  // ── تبويبات أجزاء القالب ──
  el.querySelectorAll('[data-part-tab]').forEach(b => b.addEventListener('click', () => {
    S.activePart = b.dataset.partTab; buildPropsTab();
  }));
  el.querySelectorAll('[data-part-reset]').forEach(b => b.addEventListener('click', () => {
    snapshot();
    if(w.parts) delete w.parts[b.dataset.partReset];
    drawWidget(w); buildPropsTab();
  }));
  el.querySelectorAll('[data-part-clearbg]').forEach(b => b.addEventListener('click', () => {
    snapshot(); setPath(w, 'parts.' + b.dataset.partClearbg + '.bg', ''); drawWidget(w); buildPropsTab();
  }));
  // ── ألوان العناصر المستقلة ──
  const isel = el.querySelector('[data-item-sel]');
  if(isel) isel.addEventListener('change', () => { S.itemIdx = +isel.value || 0; buildPropsTab(); });
  el.querySelectorAll('[data-item-clear]').forEach(b => b.addEventListener('click', () => {
    snapshot();
    if(w.opts.itemColors) delete w.opts.itemColors[b.dataset.itemClear];
    drawWidget(w); buildPropsTab();
  }));
  el.querySelectorAll('[data-imgreset]').forEach(b => b.addEventListener('click', () => {
    snapshot();
    Object.assign(w.opts, {bright:100, contrast:100, saturate:100, grayscale:false, imgOpacity:1});
    drawWidget(w); buildPropsTab();
  }));
  el.querySelectorAll('[data-items-reset]').forEach(b => b.addEventListener('click', () => {
    snapshot(); w.opts.itemColors = {}; drawWidget(w); buildPropsTab();
  }));
  el.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.act === 'del') removeWidget(w.id); else duplicateWidget(w.id);
  }));
  const up = el.querySelector('#logoUpload');
  if(up) up.addEventListener('change', async () => {
    const f = up.files && up.files[0];
    if(!f) return;
    if(f.size > 8 * 1024 * 1024){ toast('حجم الصورة أكبر من 8 ميجابايت', true); return; }
    toast('جاري رفع الصورة…');
    try{
      const fd = new FormData(); fd.append('file', f);
      const j = await (await fetch('/api/builder/upload', {method:'POST', body:fd})).json();
      if(!j.success){ toast(j.error || 'فشل رفع الصورة', true); return; }
      snapshot();
      w.opts.src = 'url'; w.opts.url = j.url;
      drawWidget(w); buildPropsTab();
      toast('تم رفع اللوجو ✓');
    }catch(e){ toast('خطأ في الرفع: ' + e.message, true); }
  });
  el.querySelectorAll('[data-cfld]').forEach(c => c.addEventListener('change', () => {
    snapshot();
    const set = new Set((w.type === 'topn' ? w.opts.fields : w.opts.customFields) || []);
    c.checked ? set.add(c.dataset.cfld) : set.delete(c.dataset.cfld);
    const target = (w.type === 'topn') ? 'fields' : 'customFields';
    w.opts[target] = FIELD_META.map(f => f.key).filter(k => set.has(k));
    drawWidget(w);
    const counter = el.querySelector('.hint b');
    if(counter && w.type === 'topn') counter.textContent = w.opts[target].length;
  }));
  el.querySelectorAll('[data-cfld2]').forEach(c => c.addEventListener('change', () => {
    snapshot();
    const set = new Set(w.opts.fields || []);
    c.checked ? set.add(c.dataset.cfld2) : set.delete(c.dataset.cfld2);
    const order = Object.keys(METRICS).concat(FIELD_META.map(f => f.key));
    let next = order.filter(k => set.has(k));
    if(w.type === 'radar_eval' && next.length > 10){     // حد الرادار عشرة عناصر
      toast('الحد الأقصى ١٠ عناصر للمقارنة', true);
      c.checked = false; return;
    }
    w.opts.fields = next;
    w.opts.itemColors = {};                     // ترتيب الشرائح تغيّر فتُلغى الألوان المثبّتة
    drawWidget(w); buildPropsTab();
  }));
  el.querySelectorAll('[data-fld]').forEach(c => c.addEventListener('change', () => {
    snapshot();
    const set = new Set(w.opts.fields || []);
    c.checked ? set.add(c.dataset.fld) : set.delete(c.dataset.fld);
    w.opts.fields = FIELD_META.map(f => f.key).filter(k => set.has(k));
    drawWidget(w);
  }));
}

/* =====================================================================
   البيانات
   ===================================================================== */
async function loadProject(name, opts){
  opts = opts || {};
  S.project = name;
  if(!name){ S.records = []; S.latest = null; S.pm = null; S.mode = 'single';
             S.projLatest = []; S.projNames = []; renderAll(); updateScopeUI(); return; }
  try{
    const r = await fetch('/api/builder/data?project=' + encodeURIComponent(name));
    const j = await r.json();
    if(!j.success){ toast(j.error || 'تعذر تحميل البيانات', true); return; }
    S.mode = j.mode || 'single';
    if(S.mode === 'all'){
      const raw = j.records || [];
      S.projNames  = j.projects || [];
      S.projLatest = latestPerProject(raw);
      S.records    = aggregateTimeline(raw);
      S.latest     = aggregate(S.projLatest);
      S.pm = null;
    }else{
      S.records = j.records || [];
      S.latest = S.records.length ? S.records[S.records.length - 1] : null;
      S.projLatest = []; S.projNames = [];
      S.pm = j.pm || null;
    }
    if(opts.resolve !== false) await resolveLayout(name);
    // وقت الجلب يُسجَّل قبل الرسم حتى تعرضه بطاقة «تاريخ ووقت آخر تحديث» محدَّثاً لا متأخراً بدورة
    S.lastFetch = new Date();
    renderAll(); updateScopeUI();
    updateFetchLabel(); saveSession();
    if(!opts.silent) toast(S.mode === 'all'
      ? `تم تجميع ${S.projLatest.length} مشروع عبر ${S.records.length} تاريخ تحديث`
      : `تم تحميل ${S.records.length} تحديث للمشروع`);
  }catch(e){ toast('خطأ في الاتصال: ' + e.message, true); }
}

function updateFetchLabel(){
  const el = $('#fetchTime'); if(!el) return;
  if(!S.lastFetch){ el.textContent = ''; return; }
  const d = S.lastFetch;
  const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
  el.textContent = (isEN() ? 'updated ' : 'آخر تحديث ') + hh + ':' + mm;
}

/* تحديث البيانات فقط — التصميم والمشروع والتحديد كما هي */
async function refreshData(silent){
  if(!S.project){ if(!silent) toast('اختر مشروعاً أولاً', true); return; }
  const btn = $('#btnRefresh');
  if(btn) btn.classList.add('busy');
  try{
    await loadProject(S.project, {resolve:false, silent:true});
    S.lastFetch = new Date(); updateFetchLabel();
    if(!silent) toast(isEN() ? 'Data refreshed ✓' : 'تم تحديث البيانات من قاعدة البيانات ✓');
  }finally{
    if(btn) btn.classList.remove('busy');
  }
}

function setAutoRefresh(min){
  S.page.autoRefresh = min = parseInt(min) || 0;
  if(S.autoTimer){ clearInterval(S.autoTimer); S.autoTimer = null; }
  if(min > 0) S.autoTimer = setInterval(() => refreshData(true), min * 60000);
}

/* حفظ آخر مشروع وقالب مفتوح حتى لا يضيع العمل عند تحديث المتصفح */
const SESSION_KEY = 'pmis_builder_last';
function saveSession(){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      project:S.project || '', layoutId:S.layoutId || null, lang:S.page.lang || 'ar'
    }));
  }catch(e){}
}
function loadSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){ return null; }
}

/* يجيب القالب المطبَّق على المشروع: المخصص له إن وُجد، وإلا القالب العام */
async function resolveLayout(name){
  try{
    const j = await (await fetch('/api/builder/resolve?project=' + encodeURIComponent(name || ''))).json();
    if(!j.success) return;
    S.source = j.source;
    if(j.source === 'none'){
      S.layoutId = null; S.scope = 'default';
      return;
    }
    const L = j.layout, d = L.data || {};
    S.layoutId = L.id; S.layoutName = L.name;
    S.scope = (j.source === 'project') ? 'project' : 'default';
    $('#layoutName').value = L.name;
    S.page = Object.assign(S.page, d.page || {});
    S.widgets = d.widgets || [];
    S.seq = d.seq || (S.widgets.length + 1);
    S.selected = null; S.multi = []; S.undo.length = 0; S.redo.length = 0; S.dirty = false;
    buildPageTab(); buildPropsTab();
  }catch(e){ /* تجاهل: الصفحة تفضل بالتصميم الحالي */ }
}

function updateScopeUI(){
  const sel = $('#scopeSel'), chip = $('#scopeChip'), unlink = $('#btnUnlink');
  sel.value = S.scope;
  const custom = (S.scope === 'project');
  chip.classList.toggle('custom', custom);
  if(S.project === ALL_PROJECTS && !custom) chip.textContent = 'يظهر لكل المشاريع';
  else if(!S.project && custom) chip.textContent = 'اختر مشروعاً أولاً';
  else if(custom)          chip.textContent = 'مخصص لهذا المشروع';
  else                     chip.textContent = 'يظهر لكل المشاريع';
  unlink.hidden = !(S.source === 'project' && S.layoutId);
  $('#btnSave').textContent = custom ? '💾 حفظ للمشروع' : '💾 حفظ القالب العام';
}

/* =====================================================================
   الحفظ والتحميل
   ===================================================================== */
async function saveLayout(){
  if(S.scope === 'project' && !S.project){
    toast('اختر مشروعاً أولاً لحفظ قالب مخصص له', true); return;
  }
  const body = {
    id:S.layoutId, name:$('#layoutName').value.trim() || 'قالب بدون اسم',
    scope:S.scope, project_name:S.project || null,
    data:{version:1, page:S.page, widgets:S.widgets, seq:S.seq}
  };
  try{
    const r = await fetch('/api/builder/layouts', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    const j = await r.json();
    if(!j.success){ toast(j.error || 'فشل الحفظ', true); return; }
    S.layoutId = j.id; S.dirty = false;
    S.source = (j.scope === 'default') ? 'default' : 'project';
    saveSession();
    updateScopeUI();
    toast(S.scope === 'default'
      ? 'تم حفظ القالب العام — سينطبق على كل المشاريع التي ليس لها قالب مخصص ✓'
      : 'تم حفظ القالب المخصص لمشروع ' + S.project + ' ✓');
  }catch(e){ toast('خطأ في الحفظ: ' + e.message, true); }
}
async function openLayouts(){
  $('#modalBack').classList.add('open');
  const box = $('#modalBody'); box.innerHTML = 'جاري التحميل...';
  try{
    const j = await (await fetch('/api/builder/layouts')).json();
    if(!j.success || !j.layouts.length){ box.innerHTML = '<div class="hint">لا توجد قوالب محفوظة بعد.</div>'; return; }
    box.innerHTML = j.layouts.map(l => `
      <div class="lay-item">
        <div class="li-main">
          <div class="li-name">${l.name}${l.is_default ? '<span class="lay-badge">🌍 عام</span>' : ''}</div>
          <div class="li-sub">${l.is_default ? 'ينطبق على كل المشاريع' : ('مخصص لمشروع: ' + (l.project_name || '—'))} · آخر تعديل ${(l.updated_at||'').slice(0,16)}</div>
        </div>
        <button class="sbtn" style="flex:0 0 70px" data-load="${l.id}">فتح</button>
        <button class="sbtn danger" style="flex:0 0 60px" data-del="${l.id}">حذف</button>
      </div>`).join('');
    box.querySelectorAll('[data-load]').forEach(b => b.addEventListener('click', () => loadLayout(b.dataset.load)));
    box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      if(!confirm('حذف هذا القالب نهائياً؟')) return;
      await fetch('/api/builder/layouts/' + b.dataset.del, {method:'DELETE'});
      openLayouts();
    }));
  }catch(e){ box.innerHTML = '<div class="hint">خطأ: ' + e.message + '</div>'; }
}
async function loadLayout(id){
  try{
    const j = await (await fetch('/api/builder/layouts/' + id)).json();
    if(!j.success){ toast(j.error || 'تعذر فتح القالب', true); return; }
    const L = j.layout, d = L.data || {};
    S.layoutId = L.id; S.layoutName = L.name;
    S.scope = L.is_default ? 'default' : 'project';
    S.source = S.scope;
    $('#layoutName').value = L.name;
    S.page = Object.assign(S.page, d.page || {});
    S.widgets = d.widgets || [];
    S.seq = d.seq || (S.widgets.length + 1);
    S.selected = null; S.multi = []; S.undo.length = 0; S.redo.length = 0;
    $('#modalBack').classList.remove('open');
    if(L.project_name){
      $('#projectSel').value = L.project_name;
      await loadProject(L.project_name, {resolve:false});
    } else renderAll();
    buildPageTab(); buildPropsTab(); updateScopeUI(); zoomFit(); saveSession();
    setAutoRefresh(S.page.autoRefresh || 0);
    toast('تم فتح القالب: ' + L.name);
  }catch(e){ toast('خطأ: ' + e.message, true); }
}
function newLayout(){
  if(S.widgets.length && !confirm('سيتم بدء قالب جديد فارغ. هل تريد المتابعة؟')) return;
  S.layoutId = null; S.source = 'none'; S.widgets = []; S.selected = null; S.multi = [];
  S.undo.length = 0; S.redo.length = 0; S.dirty = false;
  $('#layoutName').value = 'قالب جديد';
  renderAll(); buildPropsTab(); updateScopeUI(); toast('قالب جديد');
}

/* =====================================================================
   التبويبات والاختصارات والتشغيل
   ===================================================================== */
function switchTab(name){
  document.querySelectorAll('.side-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  ['templates','props','page'].forEach(n => $('#tab-' + n).style.display = (n === name ? 'block' : 'none'));
}
document.querySelectorAll('.side-tab').forEach(t =>
  t.addEventListener('click', () => switchTab(t.dataset.tab)));

$('#projectSel').addEventListener('change', async e => {
  if(S.dirty && !confirm('لديك تعديلات غير محفوظة، سيتم استبدالها بقالب المشروع الجديد. المتابعة؟')){
    e.target.value = S.project || ''; return;
  }
  await loadProject(e.target.value);
});
$('#scopeSel').addEventListener('change', e => {
  const v = e.target.value;
  if(v === 'project' && !S.project){
    toast('اختر مشروعاً أولاً', true); e.target.value = S.scope; return;
  }
  if(v === 'project' && S.scope === 'default'){
    if(!confirm('سيتم حفظ نسخة مستقلة خاصة بمشروع "' + S.project +
                '" عند الضغط على حفظ.\nبعدها لن تتأثر بأي تعديل تعمله على القالب العام. المتابعة؟')){
      e.target.value = 'default'; return;
    }
    S.layoutId = null;                 // نسخة جديدة مستقلة
  }
  if(v === 'default' && S.scope === 'project'){
    if(!confirm('سيتم حفظ هذا التصميم كقالب عام لكل المشاريع عند الضغط على حفظ. المتابعة؟')){
      e.target.value = 'project'; return;
    }
    S.layoutId = null;
  }
  S.scope = v; S.dirty = true; updateScopeUI();
});
$('#btnUnlink').addEventListener('click', async () => {
  if(!S.layoutId || S.source !== 'project') return;
  if(!confirm('سيتم حذف القالب المخصص لمشروع "' + S.project +
              '" وسيعود المشروع لاستخدام القالب العام. المتابعة؟')) return;
  await fetch('/api/builder/layouts/' + S.layoutId, {method:'DELETE'});
  S.layoutId = null; S.source = 'none'; S.scope = 'default'; S.dirty = false;
  await loadProject(S.project);
  toast('تم إلغاء التخصيص — المشروع يستخدم القالب العام الآن');
});
$('#btnSave').addEventListener('click', saveLayout);
$('#btnOpen').addEventListener('click', openLayouts);
$('#btnNew').addEventListener('click', newLayout);
$('#btnCloseModal').addEventListener('click', () => $('#modalBack').classList.remove('open'));
$('#modalBack').addEventListener('click', e => { if(e.target.id === 'modalBack') e.currentTarget.classList.remove('open'); });
async function setPresent(on){
  document.body.classList.toggle('presenting', on);
  $('#btnExitPresent').hidden = !on;
  if(on){
    select(null);
    try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); }catch(e){}
  }else{
    try{ if(document.fullscreenElement) await document.exitFullscreen(); }catch(e){}
  }
  setTimeout(() => { zoomFit(); renderAll(); }, 150);   // إعادة رسم نظيفة بدل تكرار الرسم
}
function togglePresent(){ setPresent(!document.body.classList.contains('presenting')); }

$('#btnPresent').addEventListener('click', togglePresent);
$('#btnExitPresent').addEventListener('click', () => setPresent(false));
document.addEventListener('fullscreenchange', () => {          // مزامنة عند الخروج بـ Esc
  if(!document.fullscreenElement && document.body.classList.contains('presenting')) setPresent(false);
});
window.addEventListener('resize', () => {
  if(document.body.classList.contains('presenting')) zoomFit();
});
$('#btnRefresh').addEventListener('click', () => refreshData(false));
$('#btnLang').addEventListener('click', () => { setLang(isEN() ? 'ar' : 'en'); saveSession(); });
$('#btnUndo').addEventListener('click', doUndo);
$('#btnRedo').addEventListener('click', doRedo);
$('#btnZoomIn').addEventListener('click', () => setZoom(S.zoom + .05));
$('#btnZoomOut').addEventListener('click', () => setZoom(S.zoom - .05));
$('#btnZoomFit').addEventListener('click', zoomFit);

/* شريط التكبير + الإدخال اليدوي */
$('#zoomSlider').addEventListener('input', e => setZoom(+e.target.value / 100));
$('#zoomInput').addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  if(isNaN(v) || v < ZMIN * 100 || v > ZMAX * 100) return;   // قيمة ناقصة أثناء الكتابة — ننتظر
  ZTYPING = true; setZoom(v / 100); ZTYPING = false;
});
$('#zoomInput').addEventListener('change', e => {         // عند الخروج: صحّح أي قيمة خارج المدى
  const v = parseFloat(e.target.value);
  setZoom(isNaN(v) ? S.zoom : v / 100);
  e.target.value = Math.round(S.zoom * 100);
});
$('#zoomInput').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
  if(e.key === 'Escape'){ e.target.value = Math.round(S.zoom * 100); e.target.blur(); }
  if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    e.preventDefault();
    setZoom(S.zoom + (e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? .1 : .01));
    e.target.value = Math.round(S.zoom * 100);
  }
});
$('#zoomInput').addEventListener('focus', e => e.target.select());
// Ctrl + عجلة الفأرة فوق اللوحة — التكبير حول موضع المؤشر
$('#canvasArea').addEventListener('wheel', e => {
  if(!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  setZoom(S.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1), {x: e.clientX, y: e.clientY});
}, {passive:false});
$('#layoutName').addEventListener('change', e => S.layoutName = e.target.value);

$('#canvasArea').addEventListener('mousedown', e => {
  if(!(e.target.id === 'canvasArea' || e.target.id === 'page' || e.target.id === 'pageShell')) return;
  if(e.button !== 0) return;
  const additive = e.ctrlKey || e.metaKey || e.shiftKey;
  if(!additive) select(null);

  const rect = page.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / S.zoom, sy = (e.clientY - rect.top) / S.zoom;
  const box = document.createElement('div'); box.className = 'marquee';
  page.appendChild(box);
  let dragged = false;

  function mv(ev){
    const cx = (ev.clientX - rect.left) / S.zoom, cy = (ev.clientY - rect.top) / S.zoom;
    const x1 = Math.min(sx, cx), y1 = Math.min(sy, cy);
    const x2 = Math.max(sx, cx), y2 = Math.max(sy, cy);
    if(x2 - x1 > 4 || y2 - y1 > 4) dragged = true;
    box.style.left = x1 + 'px'; box.style.top = y1 + 'px';
    box.style.width = (x2 - x1) + 'px'; box.style.height = (y2 - y1) + 'px';
  }
  function up(ev){
    document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
    const cx = (ev.clientX - rect.left) / S.zoom, cy = (ev.clientY - rect.top) / S.zoom;
    const x1 = Math.min(sx, cx), y1 = Math.min(sy, cy);
    const x2 = Math.max(sx, cx), y2 = Math.max(sy, cy);
    box.remove();
    if(!dragged){ if(!additive) select(null); return; }
    const hits = S.widgets.filter(w =>
      !(w.x + w.w < x1 || w.x > x2 || w.y + w.h < y1 || w.y > y2)).map(w => w.id);
    if(!hits.length){ if(!additive) select(null); return; }
    S.multi = additive ? Array.from(new Set(S.multi.concat(hits))) : hits;
    S.selected = S.multi[S.multi.length - 1];
    paintSelection(); buildPropsTab(); buildLayersList();
  }
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
});

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if(e.target.isContentEditable) return;        // أثناء الكتابة المباشرة داخل عنصر
  if(e.ctrlKey && e.key.toLowerCase() === 'z'){ e.preventDefault(); doUndo(); return; }
  if(e.ctrlKey && e.key.toLowerCase() === 'y'){ e.preventDefault(); doRedo(); return; }
  if(e.ctrlKey && e.key.toLowerCase() === 's'){ e.preventDefault(); saveLayout(); return; }
  if(e.ctrlKey && e.key.toLowerCase() === 'd'){ e.preventDefault(); duplicateSelected(); return; }
  if(e.ctrlKey && e.key.toLowerCase() === 'a'){      // تحديد الكل
    e.preventDefault();
    if(!S.widgets.length) return;
    S.multi = S.widgets.map(w => w.id); S.selected = S.multi[S.multi.length - 1];
    paintSelection(); buildPropsTab(); buildLayersList(); return;
  }
  if(e.key === 'Escape'){
    if(document.body.classList.contains('presenting')){ setPresent(false); return; }
    select(null); return;
  }
  if(e.key === 'F11' || (e.key.toLowerCase() === 'p' && (e.ctrlKey || e.metaKey))){
    e.preventDefault(); togglePresent(); return;
  }
  if(!S.multi.length) return;
  if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); removeSelected(); return; }
  // الأسهم تتحرك بمقدار مقاس الخلية عند تفعيل الالتصاق، و Shift للتحريك الدقيق بكسل واحد
  const step = e.shiftKey ? 1 : (S.page.snap ? (S.page.grid || 1) : 1);
  let dx = 0, dy = 0;
  if(e.key === 'ArrowLeft')      dx = -step;
  else if(e.key === 'ArrowRight')dx =  step;
  else if(e.key === 'ArrowUp')   dy = -step;
  else if(e.key === 'ArrowDown') dy =  step;
  if(dx || dy){ e.preventDefault(); snapshot(); nudgeSelected(dx, dy); }
});
window.addEventListener('beforeunload', e => {
  if(S.dirty){ e.preventDefault(); e.returnValue = ''; }
});

/* التشغيل */
buildTemplatesTab(); buildPageTab(); buildPropsTab(); applyPageStyle(); updateScopeUI(); zoomFit();

(async function boot(){
  const sess = loadSession();
  const sel = $('#projectSel');
  const known = Array.from(sel.options).some(o => o.value === (sess && sess.project));
  if(sess && sess.project && known){
    sel.value = sess.project;
    await loadProject(sess.project, {silent:true});          // يستعيد المشروع وقالبه المطبَّق
    if(sess.layoutId && sess.layoutId !== S.layoutId){
      try{ await loadLayout(sess.layoutId); }catch(e){}      // القالب الذي كان مفتوحاً تحديداً
    }
    toast(isEN() ? 'Restored your last session' : 'تم استرجاع آخر مشروع وقالب كنت تعمل عليهما');
  }else{
    await resolveLayout('');                                  // القالب العام
    renderAll();
  }
  setAutoRefresh(S.page.autoRefresh || 0);
  updateScopeUI(); updateFetchLabel(); zoomFit();
})();
</script>
