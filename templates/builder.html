<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard builder | Saudi Architects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;900&family=Cairo:wght@400;600;700;900&family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --ui-bg:#E9EBEF; --ui-panel:#ffffff; --ui-bar:#1F3A5F; --ui-bar-2:#274A78; --ui-tint:#F1F3F7; --ui-tint-2:#E6EAF0;
  --ui-line:#E3E6EC; --ui-text:#172033; --ui-muted:#5B6577; --ui-gold:#C8A165; --ui-navy:#1F3A5F;
  --ui-accent:#2685c9; --ui-danger:#C8543E; --ui-ok:#1C6A43; --ui-card:#ffffff;
  --sh-card:0 1px 2px rgba(23,32,51,.05), 0 8px 20px rgba(23,32,51,.06);
  --sh-menu:0 4px 8px rgba(23,32,51,.04), 0 18px 40px rgba(23,32,51,.14);
  --ease:cubic-bezier(.2,.8,.2,1);
  --sidebar-w:320px; --topbar-h:58px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:'IBM Plex Sans','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif; background:var(--ui-bg); color:var(--ui-text);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
html[lang="ar"] body{font-family:'IBM Plex Sans Arabic','IBM Plex Sans','Segoe UI',Tahoma,sans-serif;}
button{font-family:inherit;}
/* أركان حادة في كل واجهة التحرير (الداشبورد نفسه له إعداداته الخاصة) */
.topbar, .topbar *, .sidebar, .sidebar *, .modal, .modal *, .toast, .present-exit, .bw-tools button, .hnd{border-radius:0 !important;}

/* ============ الهيدر ============ */
.topbar{
  height:var(--topbar-h); background:#fff; color:var(--ui-text); display:flex; align-items:center;
  gap:4px; padding:0 16px; position:relative; z-index:50; box-shadow:0 1px 3px rgba(23,32,51,.07);
}
.hdr-back{
  flex:0 0 auto; width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  background:var(--ui-tint); color:var(--ui-text); text-decoration:none; transition:background-color .15s ease;
}
.hdr-back:hover{background:var(--ui-tint-2);}
[dir="rtl"] .hdr-back svg{transform:scaleX(-1);}
.hdr-title{display:flex; flex-direction:column; justify-content:center; line-height:1.2; padding:0 10px; min-width:0; flex:0 1 auto;}
.hdr-title small{font-size:11px; color:var(--ui-muted); font-weight:500; white-space:nowrap; display:flex; align-items:center; gap:6px;}
#layoutName{
  border:none; background:transparent; color:var(--ui-text); font-family:inherit; font-size:14px; font-weight:600;
  width:200px; padding:2px 4px; margin-inline-start:-4px; transition:background-color .15s ease;
}
#layoutName:hover{background:var(--ui-tint);}
#layoutName:focus{background:#EAF0F8; outline:none;}
.scope-chip{font-size:10.5px; font-weight:600; padding:1px 7px; white-space:nowrap; background:#F6EEDF; color:#7A5A22;}
.scope-chip.custom{background:#EAF0F8; color:var(--ui-navy);}
.hdr-menus{display:flex; align-items:center; gap:2px; margin-inline-start:6px;}
.mwrap{position:relative;}
.nv{
  height:36px; border:none; background:transparent; padding:0 12px; display:flex; align-items:center; gap:5px;
  font-size:14px; font-weight:500; color:var(--ui-text); cursor:pointer; transition:background-color .18s ease,color .18s ease;
}
.nv:hover{background:var(--ui-tint);}
.nv.on{background:#EAF0F8; color:var(--ui-navy);}
.nv .chev{transition:transform .25s var(--ease);}
.nv.on .chev{transform:rotate(180deg);}
.menu{
  position:absolute; top:44px; inset-inline-start:0; min-width:270px; background:#fff; box-shadow:var(--sh-menu);
  padding:6px; display:flex; flex-direction:column; gap:1px; z-index:60;
  opacity:0; visibility:hidden; transform:translateY(-6px) scale(.98); transform-origin:top center;
  transition:opacity .2s ease, transform .25s var(--ease), visibility 0s linear .25s;
}
.menu.open{opacity:1; visibility:visible; transform:none; transition:opacity .2s ease, transform .25s var(--ease), visibility 0s;}
.mi{
  width:100%; min-height:36px; border:none; background:transparent; padding:0 12px; display:flex; align-items:center;
  justify-content:space-between; gap:14px; font-size:13.5px; color:var(--ui-text); cursor:pointer; text-align:start;
  text-decoration:none; transition:background-color .15s ease;
}
.mi:hover{background:#F3F5F9;}
.mi[disabled]{opacity:.4; cursor:default; background:transparent;}
.mi[hidden]{display:none;}
.mi .ml{display:flex; align-items:center; gap:10px;}
.mi .ck{width:16px; display:inline-flex; justify-content:center; color:var(--ui-navy); visibility:hidden;}
.mi.checked .ck{visibility:visible;}
.mi .k{font-size:12px; color:var(--ui-muted); white-space:nowrap; direction:ltr;}
.m-head{font-size:11px; font-weight:600; color:var(--ui-muted); padding:9px 12px 4px; text-transform:uppercase; letter-spacing:.4px;}
.m-sep{height:1px; background:#EEF0F4; margin:4px 6px;}
.m-field{padding:4px 12px 8px; display:flex; flex-direction:column; gap:5px;}
.m-field select{height:34px; background:var(--ui-tint); border:none; font-size:13px; padding:0 8px;}
.m-zoom{padding:6px 12px 8px; display:flex; align-items:center; gap:10px;}
.hdr-spacer{flex:1;}
.hdr-field{
  height:36px; min-width:190px; max-width:240px; background:var(--ui-tint); border:none; font-family:inherit;
  font-size:13px; padding:0 10px; color:var(--ui-text); cursor:pointer;
}
.hdr-field:focus{outline:2px solid #C9D6E8; outline-offset:0;}
.hdr-lbl{font-size:12.5px; color:var(--ui-muted); margin-inline-end:6px; white-space:nowrap;}
.hdr-btn{
  height:36px; border:none; background:var(--ui-tint); padding:0 12px; font-size:13px; font-weight:600;
  color:var(--ui-text); cursor:pointer; white-space:nowrap; transition:background-color .15s ease, transform .15s ease;
}
.hdr-btn:hover{background:var(--ui-tint-2);}
.hdr-btn.primary{background:var(--ui-navy); color:#fff; padding:0 18px; font-size:14px;}
.hdr-btn.primary:hover{background:var(--ui-bar-2);}
.hdr-btn:active{transform:scale(.98);}
.hdr-lang{margin:0 6px;}

/* ===== التكبير ===== */
.zoom-box{display:flex; align-items:center; height:36px; background:var(--ui-tint); margin-inline-start:8px;}
.zoom-box button{
  width:30px; height:36px; border:none; background:transparent; font-size:16px; color:var(--ui-text); cursor:pointer;
  transition:background-color .15s ease;
}
.zoom-box button:hover{background:var(--ui-tint-2);}
.zoom-box .zoom-val{display:flex; align-items:center; direction:ltr; font-size:12.5px; font-weight:600;}
.zoom-box .zoom-val b{font-size:12px; color:var(--ui-muted); font-weight:600;}
#zoomInput{
  width:34px; background:transparent; border:none; color:var(--ui-text); font-family:inherit;
  font-size:12.5px; font-weight:600; text-align:center; padding:1px 0; -moz-appearance:textfield;
}
#zoomInput::-webkit-outer-spin-button,#zoomInput::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
#zoomInput:focus{outline:1px solid var(--ui-navy);}
#zoomSlider{
  -webkit-appearance:none; appearance:none; flex:1; height:4px; background:#D5DAE3; cursor:pointer; direction:ltr; margin:0;
}
#zoomSlider:focus{outline:none;}
#zoomSlider::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:12px; height:16px; background:var(--ui-navy); border:none; cursor:grab;
  box-shadow:0 1px 3px rgba(23,32,51,.3);
}
#zoomSlider::-moz-range-thumb{width:12px; height:16px; border-radius:0; background:var(--ui-navy); border:none; cursor:grab;}
#zoomSlider::-moz-range-track{height:4px; background:#D5DAE3;}
.fetch-time{font-size:12px; color:var(--ui-muted); white-space:nowrap;}
#btnRefresh .ck{visibility:visible; color:var(--ui-muted);}
#btnRefresh.busy{opacity:.6; pointer-events:none;}
#btnRefresh.busy #refreshIcon{display:inline-block; animation:spin 0.9s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media (max-width:1250px){ .hdr-lbl{display:none;} #layoutName{width:150px;} .hdr-field{min-width:150px;} }
@media (prefers-reduced-motion: reduce){ .nv,.nv .chev,.menu,.mi,.hdr-btn,.zoom-box button,.tpl-card,.side-tab{transition:none !important;} }
.theme-prev{display:flex; gap:4px; margin:6px 0 9px; align-items:center;}
.theme-prev .tp-page{width:26px; height:22px; box-shadow:0 0 0 1px var(--ui-line);}
.theme-prev .tp-c{width:15px; height:22px;}
.lay-badge{font-size:.68rem; font-weight:700; padding:2px 7px; margin-inline-start:6px; background:#F6EEDF; color:#7A5A22;}

/* ============ التخطيط العام ============ */
.workspace{display:flex; height:calc(100% - var(--topbar-h));}
.sidebar{
  width:var(--sidebar-w); min-width:var(--sidebar-w); background:var(--ui-panel);
  box-shadow:1px 0 3px rgba(23,32,51,.05); display:flex; flex-direction:column; overflow:hidden; position:relative; z-index:2;
}
.side-tabs{display:flex; gap:3px; margin:12px 12px 0; padding:3px; background:var(--ui-tint);}
.side-tab{
  flex:1; padding:7px 4px; text-align:center; font-size:13px; font-weight:500; color:var(--ui-muted);
  cursor:pointer; transition:background-color .15s ease, color .15s ease, box-shadow .15s ease; user-select:none;
}
.side-tab:hover{color:var(--ui-text);}
.side-tab.active{color:var(--ui-text); background:#fff; box-shadow:0 1px 2px rgba(23,32,51,.10); font-weight:600;}
.side-body{flex:1; overflow-y:auto; padding:14px 12px;}
.side-body::-webkit-scrollbar{width:8px;}
.side-body::-webkit-scrollbar-thumb{background:#CDD3DD;}

.canvas-area{
  flex:1; overflow:auto; padding:26px; display:flex; justify-content:flex-start; align-items:flex-start;
  background:
    linear-gradient(90deg,rgba(23,32,51,.035) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(rgba(23,32,51,.035) 1px,transparent 1px) 0 0/24px 24px, var(--ui-bg);
}
.page-shell{margin:auto; flex:0 0 auto; position:relative;}   /* margin:auto يوسّط بأمان حتى عند التمرير */
#page{
  /* موضع صريح من الركن الأيسر: في صفحة RTL كان الصندوق يلتصق باليمين فينزاح بعد التكبير */
  position:absolute; left:0; top:0; background:#fff; box-shadow:0 10px 30px rgba(23,32,51,.12); overflow:hidden;
  font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;
}
#page.show-grid::before{
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background-image:linear-gradient(90deg,rgba(26,43,76,.07) 1px,transparent 1px),
                   linear-gradient(rgba(26,43,76,.07) 1px,transparent 1px);
  background-size:var(--gs) var(--gs);
}

/* ============ الـ Visuals ============ */
.bw{
  position:absolute; z-index:1; display:flex; flex-direction:column; overflow:visible;
  background:#fff; transition:box-shadow .12s; cursor:move;
}
.bw.selected{outline:2px dashed #74b3e0; outline-offset:1px; z-index:5;}
.bw.selected.primary{outline:2px solid var(--ui-accent);}
.bw-title{
  flex:0 0 auto; padding:7px 10px; font-weight:700; line-height:1.35; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;
}
.bw-body{flex:1 1 auto; min-height:0; position:relative; overflow:hidden; padding:6px;}
/* لا غطاء شفاف فوق المحتوى: السحب من جسم العنصر نفسه حتى يعمل شريط
   التمرير وعجلة الفأرة داخل الجداول والقوائم */
.bw.editing{cursor:auto;}
.bw-tools{
  position:absolute; top:-30px; inset-inline-start:0; display:none; gap:4px; z-index:20;
}
.bw.primary .bw-tools{display:flex;}
/* الصفحة تقص ما يخرج عنها: لو العنصر ملاصق لأعلى الصفحة ينزل الشريط تحته،
   ولو مفيش مكان تحته كمان يدخل جوه العنصر نفسه */
.bw.tools-below .bw-tools{top:calc(100% + 16px);}
.bw.tools-inside .bw-tools{top:14px; inset-inline-start:8px;}
.bw-tools button{
  background:var(--ui-bar); color:#fff; border:none; width:26px; height:26px; box-shadow:0 2px 6px rgba(23,32,51,.25);
  font-size:.8rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
/* صليب اتجاهات: كل سهم في موضعه الحقيقي، فلا يلتبس الترتيب ولا ينعكس مع RTL */
.dpad{
  display:grid; direction:ltr;
  grid-template-areas:". u ." "l . r" ". d .";
  grid-template-columns:repeat(3, 17px); grid-template-rows:repeat(3, 15px);
  gap:1px; margin:-8px 3px 0; align-self:flex-start;
}
.bw-tools .dpad button{
  width:17px; height:15px; font-size:.5rem; border-radius:3px; opacity:.9; padding:0;
}
.bw-tools .dpad button:hover{opacity:1; background:var(--ui-gold,#b8860b);}
.bw-tools button:hover{background:var(--ui-accent);}
.bw-tools button.del:hover{background:var(--ui-danger);}
.hnd{position:absolute; width:10px; height:10px; background:#fff; border:2px solid var(--ui-accent);
     border-radius:2px; z-index:10; display:none;}
.bw.primary .hnd{display:block;}
/* مقابض التحجيم بإحداثيات فيزيائية (يسار/يمين) حتى لا تنعكس مع اتجاه الصفحة RTL */
.hnd[data-d="nw"]{top:-5px; left:-5px; cursor:nwse-resize;}
.hnd[data-d="ne"]{top:-5px; right:-5px; cursor:nesw-resize;}
.hnd[data-d="sw"]{bottom:-5px; left:-5px; cursor:nesw-resize;}
.hnd[data-d="se"]{bottom:-5px; right:-5px; cursor:nwse-resize;}
.hnd[data-d="n"]{top:-5px; left:calc(50% - 5px); cursor:ns-resize;}
.hnd[data-d="s"]{bottom:-5px; left:calc(50% - 5px); cursor:ns-resize;}
.hnd[data-d="w"]{left:-5px; top:calc(50% - 5px); cursor:ew-resize;}
.hnd[data-d="e"]{right:-5px; top:calc(50% - 5px); cursor:ew-resize;}

/* وضع الكتابة المباشرة داخل العنصر */
.bw.editing{outline:2px dashed var(--ui-accent); outline-offset:2px; z-index:8;}
.bw.editing .hnd{display:none;}
.bw [contenteditable="true"]{outline:none; cursor:text; white-space:pre-wrap; overflow:auto;}
.bw-edit-tip{
  position:absolute; bottom:-24px; inset-inline-start:0; background:var(--ui-accent); color:#fff;
  font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:6px; white-space:nowrap; z-index:20;
}
.txt-placeholder{opacity:.45;}

.marquee{position:absolute; border:1.5px dashed var(--ui-accent); background:rgba(38,133,201,.10);
         z-index:60; pointer-events:none; border-radius:3px;}
.guide{position:absolute; background:#ff2d78; z-index:50; pointer-events:none;}
.guide.v{width:1px; top:0; bottom:0;}
.guide.h{height:1px; left:0; right:0;}

/* محتوى القوالب */
.kpi-wrap{height:100%; overflow:auto; display:flex; flex-direction:column; justify-content:center;
  align-items:center; text-align:center; gap:2px; padding:2px;}
.kpi-value{max-width:100%;}
.kpi-value{font-weight:900; line-height:1.15; word-break:break-word;}
.kpi-label{font-size:.96em; color:inherit; opacity:.72;}
.kpi-delta{font-size:.92em; font-weight:700;}
.kpi-delta.up{color:var(--ui-ok);} .kpi-delta.down{color:var(--ui-danger);}
.tbl{width:100%; border-collapse:collapse; font-size:.96em;}
.tbl td{padding:5px 7px; border-bottom:1px solid rgba(128,128,128,.22); vertical-align:top;}
.tbl td:first-child{color:inherit; opacity:.72; font-weight:700; white-space:nowrap; width:42%;}
.tbl tr:last-child td{border-bottom:none;}
.txt-visual{height:100%; overflow:auto; white-space:pre-wrap; word-break:break-word;}
/* ترتيب صحيح للنص العربي داخل رسومات ApexCharts (خصوصاً الأعمدة الأفقية بحاوية LTR) */
.bw svg text{ unicode-bidi:plaintext; }
.gauge-wrap{height:100%; display:flex; flex-direction:column; min-height:0;}
.gauge-chart{flex:1 1 auto; min-height:0; overflow:hidden;}
.gauge-vals{
  flex:0 0 auto; overflow-y:auto; display:flex; flex-wrap:wrap; gap:3px 10px;
  justify-content:center; align-content:flex-start;
  padding:4px 2px 5px; line-height:1.35;
}
.gauge-vals span{display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}
.gauge-vals i{width:9px; height:9px; border-radius:3px; display:inline-block;}
.spi-card{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; text-align:center;}
.spi-val{font-weight:900; line-height:1;}
.spi-status{color:#fff; font-weight:700; font-size:.96em; padding:3px 12px; border-radius:20px;}
.spi-base{opacity:.75; text-align:center; padding-top:2px;}
.rk-wrap{height:100%; overflow-y:auto;}
.rk-tbl td{vertical-align:middle;}
.rk-tbl td.rk-num{width:1%; white-space:nowrap; color:inherit; opacity:1;}
.rk-tbl td.rk-num span{
  display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px;
  border-radius:50%; background:rgba(128,128,128,.18); font-weight:800; font-size:.89em;
}
.rk-tbl tr.rk-first td.rk-num span{background:#d4a373; color:#22160a;}
.rk-tbl td.rk-name{width:auto; color:inherit; opacity:1; font-weight:600; white-space:normal;}
.rk-tbl td.rk-val{width:1%; white-space:nowrap; font-weight:800; text-align:end;}
.rk-bar{margin-top:4px; height:5px; border-radius:3px; background:rgba(128,128,128,.18); overflow:hidden;}
.rk-bar i{display:block; height:100%; border-radius:3px;}
.obs-wrap{height:100%; display:flex; flex-direction:column; min-height:0; gap:5px;}
.obs-scroll{flex:1 1 auto; min-height:0; overflow-y:auto;}
.obs-sum{flex:0 0 auto; display:flex; gap:12px; flex-wrap:wrap; padding-bottom:4px;
         border-bottom:1px solid rgba(128,128,128,.22);}
.obs-sum .o-open{color:#d9463f;} .obs-sum .o-closed{color:#1e8e5a;}
.obs-tbl td{vertical-align:middle;}
.obs-tbl td.obs-desc{width:auto; color:inherit; opacity:1; font-weight:500; white-space:normal;}
.obs-tbl td.obs-chips{width:1%; white-space:nowrap; text-align:end;}
.obs-chip{
  display:inline-block; font-size:.84em; font-weight:700; padding:2px 8px; border-radius:20px;
  margin-inline-start:4px; white-space:nowrap; color:#fff;
}
.imp-high{background:#d9463f;} .imp-mid{background:#d99425;}
.imp-low{background:#2685c9;}  .imp-none{background:#8a94a6;}
.st-open{background:#f0e2e1; color:#a3352f;} .st-closed{background:#e2f2ea; color:#186b45;}
.obs-cards{flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
.obs-card{border:1px solid rgba(128,128,128,.25); border-radius:9px; padding:7px 9px;
          display:flex; align-items:center; justify-content:space-between; gap:8px;}
.obs-card .obs-desc{flex:1; font-weight:600; line-height:1.5;}
.img-wrap{height:100%; display:flex; flex-direction:column; min-height:0;}
.img-wrap img{flex:1 1 auto; min-height:0; width:100%; display:block;}
.img-cap{flex:0 0 auto; text-align:center; opacity:.75; padding-top:5px;}
.empty-note{
  height:100%; display:flex; align-items:center; justify-content:center; text-align:center;
  color:var(--ui-muted); font-size:.98em; padding:8px;
}

/* ============ عناصر الشريط الجانبي ============ */
.tpl-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
.tpl-card{
  padding:12px 6px; text-align:center; cursor:pointer; background:#F5F6F9;
  transition:transform .2s ease, box-shadow .2s ease, background-color .2s ease; user-select:none;
}
.tpl-card:hover{background:#fff; transform:translateY(-2px); box-shadow:0 10px 22px rgba(23,32,51,.10);}
.tpl-ico{font-size:1.4rem; display:block; margin-bottom:5px;}
.tpl-name{font-size:12px; font-weight:600; line-height:1.3;}
.grp{margin-bottom:18px;}
.dt-wrap{height:100%; overflow:auto;}
.dt-tbl{width:100%;}
/* رأس الجدول ثابت أثناء التمرير — لا بد من خلفية معتمة صريحة وz-index،
   وإلا مرّت الصفوف من تحته فتداخل النص. اللون يُحقن من خلفية القالب نفسه. */
.dt-tbl th{padding:5px 7px; text-align:start; white-space:nowrap; position:sticky; top:0;
           z-index:2; background:#fff; border-bottom:2px solid rgba(128,128,128,.3);}
.dt-tbl thead{background:var(--ui-card,#fff);}
.dt-tbl tbody td{background-clip:padding-box;}
.dt-tbl td{white-space:nowrap; text-align:center;}
.dt-tbl td.t-key{text-align:start; white-space:normal; width:auto;}
.dt-tbl td.t-idx{width:1%; opacity:.6;}
.dt-tbl tr.zeb td{background:rgba(128,128,128,.055);}
.fld-list{
  max-height:220px; overflow-y:auto; padding:5px; margin-bottom:8px; background:var(--ui-tint);
}
.fld-item{
  display:flex; align-items:center; gap:7px; padding:4px 6px;
  font-size:12px; font-weight:500; cursor:pointer; line-height:1.45;
}
.fld-item:hover{background:rgba(23,32,51,.05);}
.fld-item input{flex:0 0 auto; margin:0;}
.fld-item span{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.fld-count{font-size:11px; font-weight:700; color:var(--ui-muted);}
.part-tabs{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:9px;}
.part-tab{
  border:none; background:var(--ui-tint); padding:5px 9px;
  font-size:11.5px; font-weight:500; cursor:pointer; color:var(--ui-muted); font-family:inherit; transition:background-color .12s, color .12s;
}
.part-tab:hover{background:var(--ui-tint-2); color:var(--ui-text);}
.part-tab.on{background:var(--ui-navy); color:#fff;}
.hint-inline{font-size:10.5px; font-weight:500; color:var(--ui-muted); margin-inline-start:6px;}
.inh{font-weight:600; color:#8A6A2E; font-size:.92em;}
.mini-val{font-size:11px; color:var(--ui-muted); font-weight:600; min-width:44px; text-align:center;}
.ctl.rng{display:flex; align-items:center; gap:8px; flex-wrap:nowrap;}
.ctl.rng input[type=range]{flex:1 1 auto; min-width:0;}
.num-box{flex:0 0 84px; display:inline-flex; align-items:center; justify-content:center; gap:2px;}
.num-box input{width:56px; text-align:center;}
.num-box i{font-style:normal; font-size:11px; color:var(--ui-muted); font-weight:600;}
.grp-h{
  font-size:11px; font-weight:600; color:var(--ui-muted); letter-spacing:.04em; margin-bottom:9px; text-transform:uppercase;
  padding-bottom:6px; border-bottom:1px solid #EEF0F4; display:flex; align-items:center; gap:6px;
}
.row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.row label{flex:0 0 84px; font-size:12px; color:var(--ui-muted); font-weight:500;}
.row .ctl{flex:1; min-width:0;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
.mini{display:flex; flex-direction:column; gap:3px;}
.mini span{font-size:11px; color:var(--ui-muted); font-weight:500;}
.sidebar input[type=text],.sidebar input[type=number],.sidebar input[type=date],.sidebar input[type=month],.sidebar input:not([type]),
.sidebar select,.sidebar textarea,.modal input[type=text],.modal select{
  width:100%; border:none; padding:7px 8px; font-size:12.5px;
  font-family:inherit; background:var(--ui-tint); color:var(--ui-text); transition:background-color .15s ease, box-shadow .15s ease;
}
.sidebar input:focus,.sidebar select:focus,.sidebar textarea:focus{outline:none; background:#fff; box-shadow:0 0 0 2px #C9D6E8;}
input[type=color]{width:100%; height:30px; padding:2px; border:none; background:var(--ui-tint); cursor:pointer;}
input[type=range]{width:100%; accent-color:var(--ui-navy);}
.swatches{display:flex; flex-wrap:wrap; gap:5px; margin-top:5px;}
.sw{width:19px; height:19px; cursor:pointer; box-shadow:0 0 0 1px rgba(23,32,51,.14); transition:transform .12s ease;}
.sw:hover{transform:scale(1.12);}
.chk{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:500; margin-bottom:8px; cursor:pointer;}
.chk input{width:15px; height:15px; accent-color:var(--ui-navy); cursor:pointer;}
.btn-row{display:flex; gap:6px; flex-wrap:wrap;}
.sbtn{
  flex:1; border:none; background:var(--ui-tint); padding:7px 6px;
  font-size:12px; font-weight:600; cursor:pointer; color:var(--ui-text); transition:background-color .12s, color .12s; min-width:0;
}
.sbtn:hover{background:var(--ui-tint-2);}
.sbtn.on{background:var(--ui-navy); color:#fff;}
.sbtn.danger{color:var(--ui-danger); background:#FBEDEA;}
.sbtn.danger:hover{background:var(--ui-danger); color:#fff;}
.hint{font-size:12px; color:var(--ui-muted); line-height:1.65; background:#F7F8FA; padding:10px 11px;}
.layer{
  display:flex; align-items:center; gap:7px; padding:7px 8px; margin-bottom:4px; font-size:12.5px; cursor:pointer;
  background:#F7F8FA; transition:background-color .12s;
}
.layer:hover{background:var(--ui-tint-2);}
.layer.on{background:#EAF0F8; font-weight:600;}
.layer.on.pri{box-shadow:inset 3px 0 0 var(--ui-navy);}
.layer .lyr-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lyr-btn{flex:0 0 auto; width:22px; height:22px; border:none; background:#fff;
  cursor:pointer; font-size:.7rem; line-height:1; color:var(--ui-text); box-shadow:0 1px 2px rgba(23,32,51,.10);}
.lyr-btn:hover{background:var(--ui-navy); color:#fff;}

/* ============ نافذة منبثقة ============ */
.modal-back{
  position:fixed; inset:0; background:rgba(23,32,51,.40); display:flex; align-items:center; justify-content:center; z-index:900;
  opacity:0; visibility:hidden; transition:opacity .2s ease, visibility 0s linear .2s;
}
.modal-back.open{opacity:1; visibility:visible; transition:opacity .2s ease, visibility 0s;}
.modal{
  background:#fff; width:min(580px,92vw); max-height:80vh; display:flex; flex-direction:column;
  box-shadow:0 24px 60px rgba(23,32,51,.28); overflow:hidden; transform:translateY(8px) scale(.98); transition:transform .25s var(--ease);
}
.modal-back.open .modal{transform:none;}
.modal h3{margin:0; padding:16px 20px 8px; background:#fff; color:var(--ui-text); font-size:16px; font-weight:700;}
.modal-body{padding:8px 20px 14px; overflow-y:auto;}
.modal-foot{padding:12px 20px; background:#F7F8FA; display:flex; justify-content:flex-end; gap:8px;}
.lay-item{display:flex; align-items:center; gap:10px; padding:10px 12px; background:#F7F8FA; margin-bottom:6px; transition:background-color .12s;}
.lay-item:hover{background:#EEF1F6;}
.lay-item .li-main{flex:1; min-width:0;}
.lay-item .li-name{font-weight:600; font-size:13.5px;}
.lay-item .li-sub{font-size:12px; color:var(--ui-muted);}

/* ===== وضع العرض / ملء الشاشة ===== */
body.presenting .topbar,
body.presenting .sidebar{display:none !important;}
body.presenting .workspace{height:100vh;}
body.presenting .canvas-area{padding:12px; background:#11151c;}
body.presenting .bw-tools,
body.presenting .hnd{display:none !important;}
body.presenting .bw{cursor:default;}
body.presenting .bw.selected,
body.presenting .bw.primary{outline:none !important;}
body.presenting #page.show-grid::before{display:none;}
body.presenting #page{box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 20px 60px rgba(0,0,0,.55);}
.present-exit{
  position:fixed; top:14px; inset-inline-end:14px; z-index:950; cursor:pointer;
  background:rgba(23,32,51,.85); color:#fff; border:none;
  padding:8px 14px; font-family:inherit; font-size:.8rem; font-weight:700;
  opacity:.25; transition:.2s;
}
.present-exit:hover{opacity:1;}
.present-exit[hidden]{display:none !important;}

.toast{
  position:fixed; bottom:22px; inset-inline-end:22px; background:var(--ui-text); color:#fff; padding:12px 18px;
  font-size:13px; box-shadow:0 18px 40px rgba(23,32,51,.22); z-index:999;
  opacity:0; transform:translateY(12px); transition:opacity .25s ease, transform .3s var(--ease); pointer-events:none;
}
.toast.show{opacity:1; transform:translateY(0);}
.toast.err{background:var(--ui-danger);}
</style>
</head>
<body>

<header class="topbar" id="hdr">
  <a class="hdr-back" href="/admin-hub" data-i18n-title="back" data-i18n-aria="back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
  <div class="hdr-title">
    <small><span data-i18n="title">Dashboard builder</span><span class="scope-chip" id="scopeChip">—</span></small>
    <input id="layoutName" value="New layout" data-i18n-ph="layoutNamePh" data-i18n-title="layoutNameTip" autocomplete="off">
  </div>

  <nav class="hdr-menus" id="hdrMenus">
    <div class="mwrap">
      <button class="nv" aria-haspopup="true" aria-expanded="false"><span data-i18n="mFile">File</span><svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu" role="menu">
        <button class="mi" id="btnNew" role="menuitem"><span class="ml"><span class="ck"></span><span data-i18n="newLayout">New layout</span></span><span class="k"></span></button>
        <button class="mi" id="btnOpen" role="menuitem"><span class="ml"><span class="ck"></span><span data-i18n="savedLayouts">Saved layouts…</span></span><span class="k"></span></button>
        <button class="mi" id="mSave" role="menuitem"><span class="ml"><span class="ck"></span><span id="mSaveLabel">Save</span></span><span class="k">Ctrl S</span></button>
        <div class="m-sep"></div>
        <div class="m-head" data-i18n="scopeHead">Layout applies to</div>
        <div class="m-field" data-keep>
          <select id="scopeSel" aria-label="Layout scope">
            <option value="default" data-i18n="scopeDefault">All projects (global layout)</option>
            <option value="project" data-i18n="scopeProject">This project only (custom)</option>
          </select>
        </div>
        <button class="mi" id="btnUnlink" hidden role="menuitem"><span class="ml"><span class="ck"></span><span data-i18n="unlink">Remove customization</span></span><span class="k"></span></button>
      </div>
    </div>
    <div class="mwrap">
      <button class="nv" aria-haspopup="true" aria-expanded="false"><span data-i18n="mEdit">Edit</span><svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu" role="menu">
        <button class="mi" id="btnUndo" role="menuitem"><span class="ml"><span class="ck"></span><span data-i18n="undo">Undo</span></span><span class="k">Ctrl Z</span></button>
        <button class="mi" id="btnRedo" role="menuitem"><span class="ml"><span class="ck"></span><span data-i18n="redo">Redo</span></span><span class="k">Ctrl Y</span></button>
        <div class="m-sep"></div>
        <button class="mi" id="mDup" role="menuitem"><span class="ml"><span class="ck"></span><span data-i18n="duplicate">Duplicate</span></span><span class="k">Ctrl D</span></button>
        <button class="mi" id="mDel" role="menuitem"><span class="ml"><span class="ck"></span><span data-i18n="delete">Delete</span></span><span class="k">Del</span></button>
        <button class="mi" id="mSelAll" role="menuitem"><span class="ml"><span class="ck"></span><span data-i18n="selectAll">Select all</span></span><span class="k">Ctrl A</span></button>
      </div>
    </div>
    <div class="mwrap">
      <button class="nv" aria-haspopup="true" aria-expanded="false"><span data-i18n="mView">View</span><svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu" role="menu">
        <div class="m-head" data-i18n="zoom">Zoom</div>
        <div class="m-zoom" data-keep><input type="range" id="zoomSlider" min="15" max="300" step="1" value="100" data-i18n-aria="zoom"></div>
        <button class="mi" id="btnZoomFit" role="menuitem"><span class="ml"><span class="ck"></span><span data-i18n="fit">Fit to screen</span></span><span class="k"></span></button>
        <button class="mi" id="btnPresent" role="menuitem"><span class="ml"><span class="ck"></span><span data-i18n="present">Presentation mode</span></span><span class="k">Ctrl P</span></button>
        <div class="m-sep"></div>
        <button class="mi" id="btnLang" role="menuitem" data-i18n-title="dashLangTip"><span class="ml"><span class="ck"></span><span data-i18n="dashLang">Dashboard language</span></span><span class="k" id="langLabel">English</span></button>
      </div>
    </div>
    <div class="mwrap">
      <button class="nv" aria-haspopup="true" aria-expanded="false"><span data-i18n="mData">Data</span><svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu" role="menu">
        <button class="mi" id="btnRefresh" role="menuitem"><span class="ml"><span class="ck"><span id="refreshIcon">⟳</span></span><span data-i18n="refresh">Refresh now</span></span><span class="k fetch-time" id="fetchTime"></span></button>
        <div class="m-sep"></div>
        <div class="m-head" data-i18n="autoHead">Auto refresh</div>
        <button class="mi" data-auto="0"  role="menuitemradio"><span class="ml"><span class="ck">✓</span><span data-i18n="off">Off</span></span></button>
        <button class="mi" data-auto="5"  role="menuitemradio"><span class="ml"><span class="ck">✓</span><span data-i18n="m5">Every 5 minutes</span></span></button>
        <button class="mi" data-auto="15" role="menuitemradio"><span class="ml"><span class="ck">✓</span><span data-i18n="m15">Every 15 minutes</span></span></button>
        <button class="mi" data-auto="30" role="menuitemradio"><span class="ml"><span class="ck">✓</span><span data-i18n="m30">Every 30 minutes</span></span></button>
        <button class="mi" data-auto="60" role="menuitemradio"><span class="ml"><span class="ck">✓</span><span data-i18n="m60">Every hour</span></span></button>
        <div class="m-sep"></div>
        <div class="m-head" data-i18n="srcHead">Progress source</div>
        <button class="mi" data-src="weekly"   role="menuitemradio"><span class="ml"><span class="ck">✓</span><span data-i18n="srcWeekly">Weekly updates</span></span></button>
        <button class="mi" data-src="cashflow" role="menuitemradio"><span class="ml"><span class="ck">✓</span><span data-i18n="srcCf">Cash flow</span></span></button>
      </div>
    </div>
  </nav>

  <div class="hdr-spacer"></div>
  <label class="hdr-lbl" for="projectSel" data-i18n="project">Project</label>
  <select class="hdr-field" id="projectSel" data-i18n-title="project" data-no-tr>
    <option value="" data-i18n="pickProject">— Select a project —</option>
    <option value="__ALL__" data-i18n="allProjects">All projects (combined)</option>
    {% for p in projects %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
  </select>
  <div class="zoom-box" data-i18n-title="zoomTip">
    <button id="btnZoomOut" data-i18n-title="zoomOut">−</button>
    <span class="zoom-val"><input type="number" id="zoomInput" min="15" max="300" step="1" value="100" data-i18n-aria="zoom"><b>%</b></span>
    <button id="btnZoomIn" data-i18n-title="zoomIn">+</button>
  </div>
  <button class="hdr-btn hdr-lang" id="btnUiLang">Arabic</button>
  <button class="hdr-btn primary" id="btnSave">Save</button>
</header>

<div class="workspace">
  <aside class="sidebar">
    <div class="side-tabs">
      <div class="side-tab active" data-tab="templates" data-i18n="tabElements">Elements</div>
      <div class="side-tab" data-tab="props" data-i18n="tabProps">Properties</div>
      <div class="side-tab" data-tab="page" data-i18n="tabPage">Page</div>
    </div>
    <div class="side-body" id="tab-templates"></div>
    <div class="side-body" id="tab-props" style="display:none;"></div>
    <div class="side-body" id="tab-page" style="display:none;"></div>
  </aside>

  <main class="canvas-area" id="canvasArea">
    <div class="page-shell" id="pageShell">
      <div id="page"></div>
    </div>
  </main>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h3 data-i18n="savedLayoutsT">Saved layouts</h3>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot"><button class="sbtn" style="flex:0 0 110px" id="btnCloseModal" data-i18n="close">Close</button></div>
  </div>
</div>

<button class="present-exit" id="btnExitPresent" hidden data-i18n-title="exitTip">✕ <span data-i18n="exit">Exit</span></button>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   مُنشئ الداشبورد — المرحلة الأولى
   محرك canvas بمواضع بالبكسل + التصاق للشبكة + خطوط محاذاة + قوالب حية
   ===================================================================== */

const FIELD_META = {{ field_meta | tojson }};

/* =====================================================================
   لغة واجهة التحرير (مستقلة عن لغة محتوى الداشبورد S.page.lang)
   الإنجليزي هو الافتراضي، والعربي اختيار. النصوص الثابتة في الهيدر لها مفاتيح
   data-i18n، وباقي نصوص الشريط الجانبي والنوافذ والرسائل مكتوبة في الكود بالعربي
   وتُترجم وقت العرض من القاموس UI_EN (المفتاح هو النص العربي نفسه).
   ===================================================================== */
const UI_KEY = 'pmis_ui_lang';
let UIL = (() => { try{ return localStorage.getItem(UI_KEY) === 'ar' ? 'ar' : 'en'; }catch(e){ return 'en'; } })();
const uiEN = () => UIL !== 'ar';
const U = (en, ar) => uiEN() ? en : ar;

const I18N = {
  back:['Back','رجوع'], title:['Dashboard builder','منشئ الداشبورد'],
  layoutNamePh:['Layout name','اسم القالب'], layoutNameTip:['Layout name — click to rename','اسم القالب — اضغط لتغييره'],
  mFile:['File','ملف'], mEdit:['Edit','تحرير'], mView:['View','عرض'], mData:['Data','البيانات'],
  newLayout:['New layout','قالب جديد'], savedLayouts:['Saved layouts…','القوالب المحفوظة…'],
  scopeHead:['Layout applies to','القالب يُطبَّق على'],
  scopeDefault:['All projects (global layout)','كل المشاريع (قالب عام)'],
  scopeProject:['This project only (custom)','هذا المشروع فقط (مخصص)'],
  unlink:['Remove customization','إلغاء التخصيص'],
  undo:['Undo','تراجع'], redo:['Redo','إعادة'], duplicate:['Duplicate','تكرار'], delete:['Delete','حذف'],
  selectAll:['Select all','تحديد الكل'],
  zoom:['Zoom','التكبير'], fit:['Fit to screen','ملاءمة الشاشة'], present:['Presentation mode','وضع العرض'],
  dashLang:['Dashboard language','لغة الداشبورد'],
  dashLangTip:['Language of the dashboard content itself (titles, labels, direction)','لغة محتوى الداشبورد نفسه (العناوين والمسميات والاتجاه)'],
  refresh:['Refresh now','تحديث البيانات الآن'], autoHead:['Auto refresh','التحديث التلقائي'],
  off:['Off','إيقاف'], m5:['Every 5 minutes','كل ٥ دقائق'], m15:['Every 15 minutes','كل ١٥ دقيقة'],
  m30:['Every 30 minutes','كل ٣٠ دقيقة'], m60:['Every hour','كل ساعة'],
  srcHead:['Progress source','مصدر نسب الإنجاز'], srcWeekly:['Weekly updates','التحديثات الأسبوعية'],
  srcCf:['Cash flow','التدفق النقدي'],
  project:['Project','المشروع'], pickProject:['— Select a project —','— اختر المشروع —'],
  allProjects:['All projects (combined)','كل المشاريع (مجمّع)'],
  zoomTip:['Zoom — type a value, or Ctrl + mouse wheel over the canvas','التكبير — اكتب النسبة أو Ctrl + عجلة الفأرة فوق اللوحة'],
  zoomIn:['Zoom in','تكبير'], zoomOut:['Zoom out','تصغير'],
  tabElements:['Elements','العناصر'], tabProps:['Properties','الخصائص'], tabPage:['Page','الصفحة'],
  savedLayoutsT:['Saved layouts','القوالب المحفوظة'], close:['Close','إغلاق'],
  exit:['Exit','خروج'], exitTip:['Exit full screen (Esc)','خروج من ملء الشاشة (Esc)']
};
function applyUiStatic(){
  const en = uiEN(), i = en ? 0 : 1, pick = k => (I18N[k] || [k, k])[i];
  document.documentElement.lang = en ? 'en' : 'ar';
  document.documentElement.dir  = en ? 'ltr' : 'rtl';
  document.title = en ? 'Dashboard builder | Saudi Architects' : 'منشئ الداشبورد | المعماريون السعوديون';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = pick(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = pick(el.dataset.i18nTitle));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = pick(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', pick(el.dataset.i18nAria)));
  const b = document.getElementById('btnUiLang');
  if(b){ b.textContent = en ? 'Arabic' : 'English'; b.title = en ? 'Switch the interface to Arabic' : 'التبديل إلى الإنجليزية'; }
}

/* ---- قاموس العربي → الإنجليزي لنصوص الواجهة المولَّدة بالكود ---- */
const UI_EN = {
"سيتم استبدال ألوان كل العناصر بألوان الثيم (العناوين والخلفيات والنصوص). تقدر ترجع لها بـ Ctrl+Z. المتابعة؟": "This will replace the colors of all elements (titles, backgrounds and text) with the theme colors. You can undo with Ctrl+Z. Continue?",
"· آخر تعديل": "· Last modified",
"عناصر محددة": "elements selected",
"اسحب أي عنصر منها لتحريك المجموعة كلها. Esc لإلغاء التحديد.": "Drag any of them to move the whole group. Esc to clear the selection.",

"SPI = الإنجاز الفعلي ÷ الإنجاز المخطط. أكبر من ١ يعني تقدماً على البرنامج، وأقل من ١ يعني تأخراً. الألوان تتغير تلقائياً حسب الحدّين أعلاه.": "SPI = actual progress ÷ planned progress. Above 1 means ahead of schedule, below 1 means behind. Colors change automatically based on the two thresholds above.",
"«تلقائي» يكبّر الأعمدة القصيرة فتُقرأ بوضوح. «ثابت» يُبقي المقياس ٠–١٠٠٪ دائماً، وهو الأصدق لو بتقارن صورة الأسبوع بصورة أسبوع آخر.": "“Auto” enlarges short bars so they are easy to read. “Fixed” always keeps the scale at 0–100%, which is more honest when comparing one week's snapshot with another.",
"«لكل فترة» يعرض نسبة كل فترة (يوم/أسبوع/شهر) منفردة من غير تراكم: الفعلي = فرق الفعلي التراكمي عن الفترة اللي قبلها، والمخطط = مجموع المخطط اليومي جوه الفترة. مفيد لمقارنة الوتيرة الفعلية بالمخططة فترة بفترة.": "“Per period” shows each period's percentage (day/week/month) on its own, not cumulative: actual = change in cumulative actual from the previous period, planned = sum of the daily plan within the period. Useful to compare actual pace with planned pace period by period.",
"«مع أسماء المحاور» هو الخيار الآمن — الأرقام تظهر بجانب الاسم فلا تغطّيه. «على رؤوس الرسم» يضع الأرقام على الرؤوس، ويُفضَّل معه تفعيل خلفية الأرقام من «تنسيق أجزاء القالب» حتى تُقرأ فوق أسماء المحاور.": "“With axis labels” is the safe choice — numbers appear next to the label without covering it. “On the chart tips” puts numbers on the tips; turn on the number background in “Element parts formatting” so they stay readable over axis labels.",
"«نسبة من الهدف» تجعل امتلاء الحلقة مطابقاً للرقم: SPI ١٫٠٣ = حلقة مكتملة ومكتوب تحتها مقدار التجاوز. «مقياس ممتد» يترك مجالاً فوق الهدف لتظهر درجة التقدم، لكن الامتلاء عندها يكون نسبة إلى أقصى المقياس وليس إلى الرقم.": "“Share of target” makes the ring fill match the number: SPI 1.03 = a full ring with the overshoot written below. “Extended scale” leaves room above the target to show how far ahead you are, but the fill is then relative to the scale maximum, not the number.",

"في وضع «الشبكة» يتحرك العنصر ويتغيّر حجمه بمضاعفات مقاس الخلية بالضبط، والأسهم تحرّكه خطوة خلية كاملة (Shift للتحريك بكسل واحد، و Alt أثناء السحب لتعطيل الالتصاق مؤقتاً). بعد تغيير مقاس الخلية اضغط الزر أعلاه لمحاذاة العناصر الموجودة.": "In “Grid” mode elements move and resize in exact multiples of the cell size, and the arrow keys move one full cell (Shift to move 1 px, Alt while dragging to disable snapping temporarily). After changing the cell size, press the button above to align existing elements.",
"في وضع «كل المشاريع» تُجمع قيم الفترة لكل المشاريع وتُنسب لإجمالي أساس التخطيط.": "In all-projects mode, period values are summed across projects and divided by the total planning base.",
"في وضع «كل المشاريع» يُحتسب لكل تاريخ آخر تحديث معروف لكل مشروع (وليس المشاريع التي حدّثت في ذلك اليوم فقط)، والإنجاز متوسط مرجّح بقيمة العقد والصرف مجموع.": "In all-projects mode, each date uses the latest known update of every project (not only the projects updated that day); progress is weighted by contract value and spend is summed.",
"في وضع «كل المشاريع»: تُجمع القيمة التراكمية (مخططة وفعلية) بالريال لكل المشاريع التي أُعِدّ لها تدفق نقدي، ثم تُنسَب كل نقطة إلى إجمالي أساس التخطيط لكل هذه المشاريع مجتمعة — فتُقارَن الحصيلة الفعلية بالحصيلة المخططة على مستوى المحفظة كلها. مشروع لم يبدأ مداه بعد لا يساهم، وكل مشروع يفضل على آخر رقم حقيقي ليه لحد آخر رقم حقيقي في المحفظة.": "In all-projects mode: cumulative values (planned and actual) in SAR are summed for all projects that have a cash flow, then each point is divided by the combined planning base — comparing actual against planned for the whole portfolio. A project whose range has not started yet does not contribute, and each project holds its last real number up to the portfolio's last real number.",

let UI_RX = null, UI_MAP = null;
const AR_CH = /[؀-ۿ]/;
const normWS = s => s.replace(/\s+/g, ' ').trim();
function uiDictBuild(){
  if(UI_RX) return;
  UI_MAP = new Map();
  const put = (ar, en) => {
    if(typeof ar !== 'string' || typeof en !== 'string' || !AR_CH.test(ar) || AR_CH.test(en)) return;
    const k = normWS(ar); if(k && !UI_MAP.has(k)) UI_MAP.set(k, en);
  };
  Object.keys(UI_EN).forEach(k => put(k, UI_EN[k]));
  // أزواج جاهزة موجودة أصلاً في الكود (ترجمات محتوى الداشبورد)
  try{ Object.keys(T.ar).forEach(k => put(T.ar[k], T.en[k])); }catch(e){}
  try{ Object.keys(T.ar.barGroups || {}).forEach(k => put(T.ar.barGroups[k], (T.en.barGroups || {})[k])); }catch(e){}
  try{ Object.values(FIELD_MAP).forEach(m => put(m.label, m.label_en)); }catch(e){}
  try{ Object.values(GAUGE_PAIRS).forEach(p => put(p.n, p.n_en)); }catch(e){}
  try{ Object.values(PART_DEFS).forEach(p => put(p.ar, p.en)); }catch(e){}
  try{ Object.values(VISUALS).forEach(v => { put(v.title, v.title_en); put(v.oldTitle, v.oldTitle_en); }); }catch(e){}
  const keys = Array.from(UI_MAP.keys()).sort((a, b) => b.length - a.length)
                    .map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  // حدود الكلمة العربية: لا نستبدل جزءاً من كلمة أطول
  UI_RX = new RegExp('(?<![\\u0600-\\u06FF])(?:' + keys.join('|') + ')(?![\\u0600-\\u06FF])', 'g');
}
function uiTr(s){
  if(!uiEN() || typeof s !== 'string' || !AR_CH.test(s)) return s;
  uiDictBuild();
  const lead = /^\s/.test(s) ? ' ' : '', tail = /\s$/.test(s) ? ' ' : '';
  return lead + normWS(s).replace(UI_RX, m => UI_MAP.get(m)) + tail;
}
const TR_ATTRS = ['title', 'placeholder', 'aria-label'];
function trTree(root){
  if(!uiEN() || !root) return;
  const host = root.nodeType === 3 ? root.parentElement : root;
  if(!host || host.nodeType !== 1 || host.closest('#page, [data-no-tr]')) return;
  if(host.tagName === 'TEXTAREA' && root.nodeType === 1)
    TR_ATTRS.forEach(a => { const v0 = host.getAttribute(a); if(v0 && AR_CH.test(v0)) host.setAttribute(a, uiTr(v0)); });
  if(host.closest('textarea')) return;
  if(root.nodeType === 3){ const v = uiTr(root.nodeValue); if(v !== root.nodeValue) root.nodeValue = v; return; }
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {
    acceptNode: n => (n.nodeType === 1 && (n.tagName === 'TEXTAREA' || n.id === 'page' || n.tagName === 'SCRIPT' || n.hasAttribute('data-no-tr')))
                     ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  let n = root;
  do{
    if(n.nodeType === 3){ const v = uiTr(n.nodeValue); if(v !== n.nodeValue) n.nodeValue = v; }
    else TR_ATTRS.forEach(a => { const v0 = n.getAttribute(a); if(v0 && AR_CH.test(v0)){ const v = uiTr(v0); if(v !== v0) n.setAttribute(a, v); } });
  }while((n = tw.nextNode()));
}
const _uiObs = new MutationObserver(muts => {
  if(!uiEN()) return;
  muts.forEach(m => {
    if(m.type === 'characterData') trTree(m.target);
    else if(m.type === 'attributes') trTree(m.target.nodeType === 1 ? m.target : null);
    else m.addedNodes.forEach(trTree);
  });
});
function uiObserve(){

    const el = document.querySelector(sel);
    if(el) _uiObs.observe(el, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:TR_ATTRS});
  });
}

function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }

function autoDecimals(type){ return type === 'percent' ? 1 : 0; }
function compactNum(n){
  const a = Math.abs(n);
  if(a >= 1e9) return (n/1e9).toFixed(2).replace(/\.?0+$/,'') + ' ' + tr('billion');
  if(a >= 1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,'') + ' ' + tr('million');
  if(a >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'') + ' ' + tr('thousand');
  return n.toLocaleString('en-US');
}
function fmtValue(v, type, o){
  o = o || {};
  if(v === null || v === undefined || v === '') return '—';
  const d = (o.decimals === undefined || o.decimals === null) ? autoDecimals(type) : o.decimals;
  if(type === 'percent'){
    let n = num(v); if(Math.abs(n) <= 1.0001) n *= 100;
    return n.toFixed(d) + '%';
  }
  if(type === 'currency'){
    const n = num(v);
    return (o.compact ? compactNum(n)
      : n.toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d})) + ' ' + tr('currency');
  }
  if(type === 'days'){
    return num(v).toLocaleString('en-US') + ' ' + tr('dayUnit');
  }
  if(type === 'points'){
    const n = num(v);
    const unit = (o.pointsAs === 'pct') ? '%' : ' ' + tr('pointUnit');
    return (n > 0 ? '+' : '') + n.toFixed(d === 0 ? 1 : d) + unit;
  }
  if(type === 'ratio'){
    return num(v).toFixed(d || 2);
  }
  if(type === 'number'){
    const n = num(v);
    return o.compact ? compactNum(n) : n.toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
  }
  return String(v);
}
function pct(v){ let n = num(v); if(Math.abs(n) <= 1.0001) n *= 100; return +n.toFixed(2); }

/* حقول التقييم درجات من ١٠٠ — تُجمَّع كمتوسط مرجّح لا كمجموع */
const RATING_FIELDS = ['eval_labor','eval_equip','eval_financial','eval_hse'];

function aggregate(rows){
  if(!rows || !rows.length) return null;
  const out = {};
  // مصدر النسب «التدفق النقدي»: نفس حساب منحنى المحفظة — المخطط موزون بأساس التخطيط، والفعلي
  // (نسبة من القيمة بعد أوامر التغيير) موزون بالقيمة بعد التغيير، والاتنين على إجمالي أساس التخطيط.
  const wts  = rows.map(r => r._cf ? r._cf.pb : (num(r.contractor_val) || 0));
  const actW = rows.map(r => r._cf ? r._cf.rv : (num(r.contractor_val) || 0));
  const wsum = wts.reduce((a, b) => a + b, 0);
  const wavg = key => {
    const vals = rows.map(r => num(r[key]));
    const w = (key === 'act_prog_cur' || key === 'act_prog_prev') ? actW : wts;
    return wsum > 0 ? vals.reduce((a, v, i) => a + v * w[i], 0) / wsum
                    : vals.reduce((a, v) => a + v, 0) / vals.length;
  };

  FIELD_META.forEach(f => {
    const k = f.key, t = f.type;
    if(RATING_FIELDS.indexOf(k) >= 0){
      out[k] = Math.round(wavg(k) * 10) / 10;                      // متوسط التقييم
    }else if(t === 'percent'){
      out[k] = wavg(k);                                            // متوسط مرجّح بقيمة العقد (0–1)
    }else if(t === 'currency' || t === 'number'){
      out[k] = rows.reduce((a, r) => a + num(r[k]), 0);            // مجموع
    }else if(t === 'days'){
      out[k] = Math.round(rows.reduce((a, r) => a + num(r[k]), 0) / rows.length);  // متوسط
    }else if(t === 'date'){
      const ds = rows.map(r => r[k]).filter(Boolean).sort();
      if(ds.length) out[k] = /^(start|current)/.test(k) ? ds[0] : ds[ds.length - 1];
      else out[k] = null;
    }else if(t === 'image'){ out[k] = ''; }
  });

  // المعوقات: تُدمج مع اسم المشروع
  let obs = [];
  rows.forEach(r => {
    let l = r.obstacles_data;
    if(typeof l === 'string'){ try{ l = JSON.parse(l || '[]'); }catch(e){ l = []; } }
    if(Array.isArray(l)) l.forEach(o => {
      if(o && (o.description || o.obstacle))
        obs.push(Object.assign({}, o, {description:`[${r.project_name}] ${o.description || o.obstacle}`}));
    });
  });
  out.obstacles_data = obs;

  const names = Array.from(new Set(rows.map(r => r.project_name).filter(Boolean)));
  out.project_name  = tr('allProjects')(names.length);
  out.project_desc  = tr('allDesc');
  out.project_type  = '—'; out.manager_name = tr('managers')(names.length);
  out.project_owner = '—'; out.project_developer = '—'; out.project_contractor = '—';
  out.works_completed = out.works_ongoing = out.works_planned = '—';
  return out;
}

/* آخر تحديث لكل مشروع */
function latestPerProject(rows){
  const m = {};
  rows.forEach(r => {
    const k = r.project_name; if(!k) return;
    if(!m[k] || String(r.current_data_date || '') >= String(m[k].current_data_date || '')) m[k] = r;
  });
  return Object.keys(m).sort().map(k => m[k]);
}

/* خط زمني مجمّع: تجميع كل المشاريع في كل تاريخ */
/* خط زمني مجمّع صحيح: عند كل تاريخ نأخذ لكل مشروع آخر تحديث له في ذلك التاريخ أو قبله
   (carry-forward). بدون ذلك يشمل كل تاريخ المشاريع التي صادف أن حدّثت فيه فقط،
   فتقفز الأرقام وتهبط بلا معنى. */
function aggregateTimeline(rows){
  const dates = Array.from(new Set(rows.map(r => r.current_data_date).filter(Boolean)))
                     .sort((a, b) => String(a).localeCompare(String(b)));
  const byProject = {};
  rows.forEach(r => {
    const k = r.project_name || '—';
    (byProject[k] = byProject[k] || []).push(r);
  });
  Object.keys(byProject).forEach(k => byProject[k].sort(
    (a, b) => String(a.current_data_date).localeCompare(String(b.current_data_date))));

  return dates.map(d => {
    const snap = [];
    Object.keys(byProject).forEach(k => {
      let last = null;
      const list = byProject[k];
      for(let i = 0; i < list.length; i++){
        if(String(list[i].current_data_date) <= String(d)) last = list[i]; else break;
      }
      if(last) snap.push(last);                 // المشاريع التي لم تبدأ بعد تُستثنى
    });
    if(!snap.length) return null;
    const a = aggregate(snap);
    a.current_data_date = d;
    a._projects = snap.length;                  // عدد المشاريع الداخلة في هذه النقطة
    return a;
  }).filter(Boolean);
}

/* منحنى التدفق النقدي من السيرفر (/api/cashflow/curve): التوزيع اليومي والتجميع يوم/أسبوع/شهر
   ولكل المشاريع كله بيتحسب هناك، والصفحة بتاخد الفترات المطلوبة بس. النتيجة بتتخزن مؤقتاً لكل
   (مشروع، دقة، مدى) لحد الـ Refresh، وأول ما توصل بيتعاد رسم قوالب المنحنى اللي مستنياها. */
function cfRangeFrom(v){ v = String(v || ''); return /^\d{4}-\d{2}$/.test(v) ? v + '-01' : v.slice(0, 10); }
function cfRangeTo(v){
  v = String(v || '');
  if(/^\d{4}-\d{2}$/.test(v)){                          // قوالب قديمة كان مداها بالشهر
    const d = new Date(+v.slice(0, 4), +v.slice(5, 7), 0);
    return v + '-' + String(d.getDate()).padStart(2, '0');
  }
  return v.slice(0, 10);
}
/* تسمية محور النسب: القيم اليومية والأسبوعية أقل من 1% غالباً، فالتقريب لرقم صحيح يخليها كلها «0%» */
function pctTick(v){
  if(v === null || v === undefined || isNaN(v)) return '';
  const a = Math.abs(v);
  return (a === 0 || a >= 10 ? Math.round(v) : a >= 1 ? +(+v).toFixed(1) : +(+v).toFixed(2)) + '%';
}
function cfCurveGet(gran, frm, to){
  if(S.mode !== 'all' && !S.project) return {state:'err'};
  const scope = (S.mode === 'all') ? '' : S.project;
  const key = [scope, gran, frm, to].join('|');
  S.cfCache = S.cfCache || {};
  if(S.cfCache[key]) return S.cfCache[key];
  S.cfCache[key] = {state:'wait'};
  fetch('/api/cashflow/curve?project=' + encodeURIComponent(scope) + '&gran=' + gran +
        '&frm=' + encodeURIComponent(frm || '') + '&to=' + encodeURIComponent(to || ''))
    .then(r => r.json())
    .then(j => { S.cfCache[key] = j.success ? {state:'ok', rows:j.buckets || []} : {state:'err', msg:j.error}; })
    .catch(e => { S.cfCache[key] = {state:'err', msg:e.message}; })
    .then(() => S.widgets.filter(x => x.type === 'scurve' && x.opts && x.opts.dataSource === 'cashflow')
                         .forEach(x => { try{ drawWidget(x); }catch(e){} }));
  return S.cfCache[key];
}

  const srcChanged = (S.page.progressSource || 'weekly') !== (st.page.progressSource || 'weekly');
  S.widgets = st.widgets; S.page = st.page;

  S.multi = (S.multi || []).filter(id => S.widgets.some(w => w.id === id));
  S.selected = S.widgets.some(w => w.id === prev) ? prev : (S.multi[0] || null);   // حافظ على التحديد
  renderAll(); buildPageTab(); buildPropsTab();
}

  if(!S.undo.length) return;
  S.redo.push(JSON.stringify({widgets:S.widgets, page:S.page}));
  applyState(S.undo.pop());
}

  if(!S.redo.length) return;

  applyState(S.redo.pop());
}

function kpiAutoTitle(w, field){

                                    : {ar:(FIELD_MAP[k] || {}).label || k,
                                       en:(FIELD_MAP[k] || {}).label_en || (FIELD_MAP[k] || {}).label || k};

}
const UPD_SOURCES = ['submitted', 'data_date', 'fetched'];
function updSourceName(k){
  return {submitted:tr('updSubmitted'), data_date:tr('updDataDate'), fetched:tr('updFetched')}[k] || k;
}
/** يعيد لحظة آخر تحديث حسب المصدر المختار — Date أو null */
function updMoment(src){
  if(src === 'fetched') return S.lastFetch ? new Date(S.lastFetch) : null;
  const r = S.latest;
  if(!r) return null;
  if(src === 'data_date'){
    const d = r.current_data_date ? new Date(String(r.current_data_date).slice(0,10) + 'T00:00:00') : null;
    return (d && !isNaN(d.getTime())) ? d : null;
  }
  // submitted: تاريخ الإرسال + وقته إن وُجد، وإلا تاريخ البيانات
  const day = r.submission_date || r.current_data_date;
  if(!day) return null;
  const t = String(r.submission_time || '').trim();
  const hm = /^\d{1,2}:\d{2}/.test(t) ? (t.length === 4 ? '0' + t : t.slice(0,5)) : '00:00';
  const d = new Date(String(day).slice(0,10) + 'T' + hm + ':00');
  return isNaN(d.getTime()) ? null : d;
}
function updRelative(d){
  if(!d) return '';
  let diff = (Date.now() - d.getTime()) / 1000;
  if(diff < 0) diff = 0;
  if(diff < 60) return tr('updNow');
  const pick = (n, u) => {
    if(isEN()) return tr('updAgo')(n, n === 1 ? tr('updAgoOne')[u] : tr('updAgoTwo')[u]);
    if(n === 1) return 'منذ ' + tr('updAgoOne')[u];
    if(n === 2) return 'منذ ' + tr('updAgoTwo')[u];
    return tr('updAgo')(n, n <= 10 ? tr('updAgoFew')[u] : tr('updAgoMany')[u]);
  };
  if(diff < 3600)  return pick(Math.floor(diff / 60), 'm');
  if(diff < 86400) return pick(Math.floor(diff / 3600), 'h');
  return pick(Math.floor(diff / 86400), 'd');
}
function updFormat(d, fmt, withTime){
  if(!d) return tr('updNone');
  const loc = isEN() ? 'en-GB' : 'ar-EG';
  const dOpt = {year:'numeric', month:'long', day:'numeric'};
  const tOpt = {hour:'2-digit', minute:'2-digit'};
  let out;
  try{
    out = d.toLocaleDateString(loc, dOpt);
    if(withTime) out += ' — ' + d.toLocaleTimeString(loc, tOpt);
  }catch(e){ out = d.toISOString().slice(0, withTime ? 16 : 10).replace('T', ' '); }
  if(fmt === 'rel')     return updRelative(d);
  if(fmt === 'both')    return out + ' (' + updRelative(d) + ')';
  return out;
}

function metricName(k){ const m = METRICS[k]; return m ? (isEN() ? m.en : m.ar) : k; }
function isMetric(k){ return !!METRICS[k]; }
function fieldOrMetricName(k){ return isMetric(k) ? metricName(k) : lbl(k); }
function fieldOrMetricType(k){ return isMetric(k) ? METRICS[k].type : ((FIELD_MAP[k] || {}).type || 'number'); }
/* مقارنة الفرز حسب نوع العمود: الأرقام والنسب والمبالغ عددياً، التواريخ زمنياً،
   والنصوص أبجدياً بترتيب اللغة (مع معالجة الأرقام داخل النص). القيم الفارغة تُدفع للآخر. */
function sortKeyType(k){
  if(k === '@key') return 'text';
  if(isMetric(k)) return 'number';
  const ty = (FIELD_MAP[k] || {}).type || 'text';
  return (ty === 'percent' || ty === 'currency' || ty === 'number') ? 'number' : ty;
}
function sortCmp(a, b, k){
  const ty = sortKeyType(k);
  if(k === '@key')
    return String(a.k).localeCompare(String(b.k), isEN() ? 'en' : 'ar', {numeric:true, sensitivity:'base'});
  if(ty === 'number'){
    const x = valueOf(a.r, k), y = valueOf(b.r, k);
    const nx = !isFinite(x), ny = !isFinite(y);
    if(nx && ny) return 0;
    if(nx) return 1;                       // الفارغ في الآخر مهما كان الاتجاه
    if(ny) return -1;
    return x - y;
  }
  if(ty === 'date'){
    const x = Date.parse(a.r[k] || ''), y = Date.parse(b.r[k] || '');
    const nx = isNaN(x), ny = isNaN(y);
    if(nx && ny) return 0;
    if(nx) return 1;
    if(ny) return -1;
    return x - y;
  }
  const sx = String(a.r[k] == null ? '' : a.r[k]).trim();
  const sy = String(b.r[k] == null ? '' : b.r[k]).trim();
  if(!sx && !sy) return 0;
  if(!sx) return 1;
  if(!sy) return -1;
  return sx.localeCompare(sy, isEN() ? 'en' : 'ar', {numeric:true, sensitivity:'base'});
}

  if(isMetric(k)) return +METRICS[k].calc(rec).toFixed(3);

}

/* تنسيق موحّد لـ Data Labels (حجم/لون/خلفية) */
const DL_DEFAULT = {show:true, size:11, weight:700, color:'', bg:false, bgColor:'#1a2b4c'};
/* «إظهار الأرقام» وحده يبقى في خيارات القالب؛ كل التنسيق مصدره الوحيد
   هو «تنسيق أجزاء القالب» — لا مصدرَين متعارضين. */
function dlOf(w){
  const raw = Object.assign({}, DL_DEFAULT, w.opts.dl || {});
  const P = partOf(w, 'dataLabels');
  const bgOn = !!(P.bg && P.bg !== 'none');
  return {show: raw.show !== false, size: P.size, weight: P.weight || 700,
          color: P.color || '', bg: bgOn, bgColor: bgOn ? P.bg : '#1a2b4c',
          pos: P.pos || ''};
}
/* الوسم الأبيض داخل عمود ارتفاعه صفر يقع على خلفية الرسم البيضاء فيختفي.
   نحسب لوناً لكل نقطة: الأبيض داخل الأعمدة الكافية، ولون النص للصفرية والقصيرة. */
function nearWhite(c){
  const m = String(c || '').trim().match(/^#?([0-9a-f]{6})$/i);
  if(!m) return false;
  const v = parseInt(m[1], 16);
  const r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 215;     // فاتح جداً
}
/* لون نص العنصر نفسه (من خصائصه) — الرسوم تتبعه بدل ثيم الصفحة، فتغيير الثيم
   أو التراجع عنه لا يترك نصوصاً بلون لا يُقرأ على خلفية العنصر */
function wText(w){ return (w && w.style && w.style.color) || theme().text; }
function dlPointColors(w, data, insideColor){
  const nums = (data || []).map(v => {
    const n = (v && typeof v === 'object') ? v.y : v;
    return Math.abs(+n || 0);
  });
  const mx = Math.max.apply(null, nums.concat([0]));
  /* لون الوسم خارج العمود: لون المستخدم إن كان مقروءاً على الخلفية، وإلا لون
     نص الثيم. اللون الأبيض هو الافتراضي *داخل* العمود، ولا يُقرأ خارجه. */
  const set  = (w.parts && w.parts.dataLabels && w.parts.dataLabels.color) || '';
  const outC = (set && !nearWhite(set)) ? set : wText(w);
  if(!nums.length) return [insideColor || outC];
  return nums.map(v => (!mx || v / mx < 0.12) ? outC : (insideColor || outC));
}
function dlOpts(w, fallbackColor, formatter, pointData){
  const d = dlOf(w);
  const textC = d.color || fallbackColor || wText(w);
  const bgC   = d.bgColor || '#1a2b4c';
  /* ملاحظة ApexCharts: عند تفعيل الخلفية يصبح style.colors هو لون *المستطيل*
     و background.foreColor هو لون *النص* — لذلك نعكسهما هنا عمداً. */
  const o = {
    enabled: d.show !== false,
    style:{fontSize:(d.size || 11) + 'px', fontWeight:d.weight || 700,
           fontFamily:w.style.font || FONTS[0].v,
           colors: d.bg ? [bgC]
                   : (pointData ? dlPointColors(w, pointData, textC) : [textC])},
    background:{enabled: !!d.bg, foreColor: textC, borderColor: bgC, borderWidth: 0,
                borderRadius:4, padding:4, opacity:0.95, dropShadow:{enabled:false}}
  };
  if(formatter) o.formatter = formatter;
  /* الخطوط لا تفهم plotOptions.bar.dataLabels.position، فموضع الرقم عندها إزاحة رأسية */
  if(isLineLike(w)) o.offsetY = dlLineOffsetY(w);
  return o;
}
function fmtByType(type, o){
  o = o || {};
  if(type === 'percent')  return v => v + '%';
  if(type === 'days')     return v => num(v).toLocaleString('en-US') + ' ' + tr('dayUnit');
  if(type === 'points')   return v => (num(v) > 0 ? '+' : '') + num(v).toFixed(1) +
                                     ((o.pointsAs === 'pct') ? '%' : ' ' + tr('pointUnit'));
  if(type === 'ratio')    return v => num(v).toFixed(2);
  if(type === 'currency') return v => compactNum(num(v));
  return v => num(v).toLocaleString('en-US');
}
function wFont(w){ return (w.style && w.style.font) || FONTS[0].v; }
function wSize(w){ return (w.style && w.style.fontSize) || 13; }

const APEX_PART_PROBE = [

function scanParts(w){

  const dec = PARTS_OF[w.type] || [];
  const seen = S.partsSeen && S.partsSeen[w.id];
  if(!seen) return dec.slice();
  return PART_ORDER.filter(k => seen.has(k) && dec.indexOf(k) >= 0);

/** يُستدعى بعد كل رسم: يحدّث القائمة ويعيد بناء اللوحة إن تغيّرت */
function refreshParts(w){
  if(!w || !S.partsSeen) return;
  const set = scanParts(w);
  if(!set) return;
  const prev = S.partsSeen[w.id];
  S.partsSeen[w.id] = set;
  const same = prev && prev.size === set.size && Array.from(set).every(k => prev.has(k));
  /* قائمة العناصر القابلة للتلوين تُبنى أثناء الرسم، فلو تغيّرت (قالب جديد، أو
     تغيّر عدد السلاسل) نعيد بناء اللوحة لتظهر ألوانها فوراً. */
  const sig  = (S.lastItems[w.id] || []).join('|');
  const psig = S.itemSig && S.itemSig[w.id];
  if(!S.itemSig) S.itemSig = {};
  S.itemSig[w.id] = sig;
  if((!same || sig !== psig) && S.selected === w.id && S.multi.length === 1) buildPropsTab();

/* بعض القوالب تسمّي الجزء تسمية أدقّ: الرادار لا محور أفقي فيه */
const PART_NAME_BY_TYPE = {

function partName(k, w){

/* «موضع الرقم» في المكتبة شيئان مختلفان: داخل العمود (plotOptions.bar) أو إزاحة
   رأسية عند النقطة (dataLabels.offsetY). فنحدّد أولاً طبيعة الرسم الحالية —
   وهي تتغيّر داخل القالب الواحد: «مسار الإنجاز» و«المنحنى التراكمي» أعمدة أو خطوط. */
function isBarLike(w){
  if(!w) return false;
  const o = w.opts || {};
  if(w.type === 'bars' || w.type === 'projects_compare') return true;
  if(w.type === 'topn') return o.display === 'bars';
  if(w.type === 'progress_line' || w.type === 'scurve') return o.chartType === 'bar';
  return false;
}
function isLineLike(w){
  if(!w) return false;

  if(w.type === 'spi') return o.mode === 'trend';
  if(w.type === 'progress_line') return o.chartType !== 'bar';
  if(w.type === 'scurve') return o.chartType !== 'bar';

/** سُمك خط المنحنى — مشترك بين كل القوالب الخطية */
function lineW(w){
  const v = num((w.opts || {}).lineW);
  return (v === null || !isFinite(v)) ? 3 : Math.max(1, Math.min(8, Math.round(v)));
}
/** إزاحة رقم البيانات عند النقطة: فوقها أو عليها أو تحتها */
function dlLineOffsetY(w){
  const P = partOf(w, 'dataLabels');
  const sz = P.size || 11;
  if(P.pos === 'on')    return 0;
  if(P.pos === 'below') return Math.round(sz * 0.9) + 6;
  return -(Math.round(sz * 0.4) + 3);            // الافتراضي: فوق النقطة

/** أقل عدد خانات عشرية يجعل مسميات المحور مختلفة فعلاً.
    مع قيم متقاربة (كلها حول ٠٫٩٢) يُظهر المحور نفس الرقم خمس مرات بلا هذا. */
function axisDecimals(vals, ticks, userDec){
  const ok = (vals || []).map(num).filter(v => v !== null && isFinite(v));
  const d0 = Math.max(0, userDec || 0);
  if(ok.length < 2) return d0;
  const span = Math.max.apply(null, ok) - Math.min.apply(null, ok);
  if(!(span > 0)) return d0;
  const step = span / Math.max(1, ticks || 5);
  return Math.max(d0, Math.min(6, Math.max(0, Math.ceil(-Math.log10(step)))));
}
/* في الرادار تتوزّع المسميات حول دائرة، فالإزاحة الواحدة تحرّكها كلها في اتجاه
   واحد — بلا فائدة؛ والمكتبة أصلاً لا تدعم الميل هناك. فنُخفي الخيارين. */

   المكتبة تتجاهله ما لم يُرفع rotateAlways. ونمرّ على fitCats نفسها التي تستعملها
   الأعمدة حتى يكون سلوك المحور واحداً في كل القوالب: لفّ النص وتصغير تلقائي
   عند الضيق، وميل يدوي يُحترم. */
function dateAxis(w, cats){
  const pX = partOf(w, 'xaxis'), axX = axisStyle(w, 'xaxis');

                      !!(w.parts && w.parts.xaxis && w.parts.xaxis.size));
  return {cats:fit.cats,
          labels:{rotate:fit.rotate, rotateAlways:fit.rotateAlways, trim:fit.trim,
                  maxHeight:fit.maxHeight, hideOverlappingLabels:true,

function partCapsOf(w, k){
  let caps = partCaps(k);
  if(w && w.type === 'radar_eval' && k === 'xaxis')
    caps = caps.filter(c => c !== 'rotate' && c !== 'offset');
  /* الحلقات والشرائح ليس لرقمها «موضع» تدعمه المكتبة، فلا نعرض خياراً ميتاً */
  if(k === 'dataLabels' && !isBarLike(w) && !isLineLike(w))

/** التنسيق الفعّال لجزء: المحفوظ إن وُجد، وإلا مشتق من تنسيق القالب */
/* بعض القوالب ترسم الجزء بحجم مختلف عن الافتراضي العام (الرقم داخل الدائرة
   مثلاً أكبر بكثير). لا بد أن يكون الرقم المعروض في اللوحة هو الرقم المرسوم
   فعلاً، وإلا قفز الحجم عند الضغط على «إرجاع للافتراضي». */
function partBaseDelta(w, key){
  if(key === 'dataLabels'){
    if(w.type === 'gauge') return 5;                                   // الرقم داخل الدائرة
    if(w.type === 'spi' && (w.opts || {}).mode === 'gauge') return 10;  // رقم SPI داخل الدائرة
  }
  if(key === 'cardValue'){
    if(w.type === 'kpi') return 17;   // ٣٠px — نفس الحجم الذي كان في «حجم الرقم»
    if(w.type === 'spi') return 21;   // ٣٤px — نفس حجم رقم SPI الكبير
  }
  return (PART_DEFS[key] || {}).d || 0;
}
function partOf(w, key){
  const def = PART_DEFS[key] || {d:0};
  const saved = (w.parts && w.parts[key]) || {};
  const base = Math.max(7, wSize(w) + partBaseDelta(w, key));
  return {
    size:   saved.size   || base,
    color:  saved.color  || '',
    weight: saved.weight || (key === 'dataLabels' ? 700 : (key === 'tableHead' ? 800 : 0)),
    align:  saved.align  || '',
    rotate: (saved.rotate === undefined || saved.rotate === null) ? null : +saved.rotate,
    offsetX: +saved.offsetX || 0,
    offsetY: +saved.offsetY || 0,
    pos:    saved.pos    || '',
    legendPos: saved.legendPos || '',
    bg:     saved.bg     || '',
    _set:   Object.keys(saved).length > 0

/** نمط وسيلة الإيضاح */
function legendStyle(w, base){
  const p = partOf(w, 'legend');

  const v = String(t == null ? '' : t).trim();

function fitCats(w, names, hz, size, userRot, explicitSize){
  const n    = Math.max(1, names.length);
  const font = wFont(w);
  const budget = hz ? Math.max(90, Math.round(w.w * 0.34))
                    : Math.max(30, Math.round((w.w - 56) / n) - 4);
  /* لو لم يثبّت المستخدم حجم الخط، نصغّره تدريجياً حتى يسع الاسم كاملاً —
     تصغير الخط أرحم من القصّ أو التشابك. */

    lines = names.map(t => wrapPx(t, budget, sz, font, 3));
    worstPx = lines.reduce((m, a) =>
        Math.max(m, a.reduce((k, x) => Math.max(k, textPx(x, sz, font)), 0)), 0);
    if(worstPx <= budget + 1 || explicitSize || sz <= 7) break;
    sz -= 1;

     ما يتراكب منها بدل أن تتشابك. */
  const capH = Math.max(34, Math.round(w.h * 0.38));
  const out = {trim:false, maxHeight:Math.min(hz ? 96 : 120, capH), size:sz,
               hideOverlappingLabels:true, rotate:0, rotateAlways:false, cats:lines};
  if(hz){
    // وسّع المساحة المحجوزة لتكفي أطول سطر، فلا تقصّه المكتبة
    out.maxWidth = Math.min(Math.round(w.w * 0.50), Math.max(90, Math.ceil(worstPx) + 14));

  if(userRot !== null && userRot !== undefined){
    out.rotate = userRot; out.rotateAlways = (userRot !== 0);
    if(out.rotateAlways) out.cats = names.map(x => String(x));
    return out;
  }
  if(worstPx > budget + 1 && capH >= 50){
    /* الميل التلقائي بلا rotateAlways: تقرّر المكتبة الميل عند الحاجة وتُخفي ما
       يتراكب — أفضل من إظهار الكل متشابكاً. الميل الذي يحدّده المستخدم فقط
       هو الذي يُفرض دائماً (فوق). */
    out.rotate = -40; out.rotateAlways = false; out.cats = names.map(x => String(x));

     المكتبة تُخفي ما لا يسع — إخفاء مسمّى أفضل من تشابك غير مقروء. */
  return out;
}

          : `${tr('scale')} 0 – ${maxScale.toFixed(2)} · ${tr('target')} ${gTxt}`;
        const noteHtml = `<div class="spi-base" data-part="strip" style="${partCss(w,'strip')}">

        mkChart(body, w, {

          plotOptions:{radialBar:{hollow:{size:'58%'}, track:{background:'rgba(125,125,125,.15)'},
            dataLabels:{show:d.show !== false,
              /* معايرة مقاسة: عند إظهار الاسم تضيف المكتبة إزاحة تتناقص مع كبر
                 الخط (≈ 17.5 − 0.39×الحجم)، فنطرحها ليبقى الرقم في المنتصف. */
              name:{fontSize:Math.max(9, Math.round(d.size * 0.58)) + 'px',

          legend:{show:false}
        }, {host:body.querySelector('.gauge-chart'), reserve:measureSpiBase(body)});
        return;
      }
      const pv = partOf(w, 'cardValue');
      const vsz = pv.size;
      body.innerHTML = `<div class="spi-card">
          <div class="spi-val" data-part="cardValue" style="color:${pv.color || color};font-size:${vsz}px;${
            pv.weight ? 'font-weight:' + pv.weight + ';' : ''}${pv.align ? 'text-align:' + pv.align + ';' : ''}">${shown}</div>
          <div class="spi-status" data-part="cardLabel" style="background:${color};${
            partCss(w,'cardLabel')}">${status}</div>${base}</div>`;

      const fit = fitCats(w, cats, hz, (hz ? pY : pX).size, (hz ? pY : pX).rotate,

      cats = fit.cats;
      const catAxis = {rotate:fit.rotate, rotateAlways:fit.rotateAlways, trim:fit.trim,

      if(hz) catAxis.align = pY.align || 'right';

  radar_eval:{
    name:'مقارنة تقييمات (رادار)', icon:'🕸️', w:380, h:330,
    opts:{numMode:'axis', showValues:false, scaleMode:'target',
          fields:['eval_labor','eval_equip','eval_financial','eval_hse'],
          targets:{},
          dl:Object.assign({}, DL_DEFAULT, {show:true, bg:true, bgColor:'#ffffff'})},
    title:'مقارنة تقييمات (رادار)', title_en:'Ratings comparison (radar)', oldTitle:'التقييم الفني للمشروع', oldTitle_en:'Technical evaluation',
    render(body, w){
      if(!S.latest) return empty(body);
      const o = w.opts;
      const keys = (o.fields || []).slice(0, 10);
      if(keys.length < 3){
        body.innerHTML = `<div class="empty-note">${tr('radarNeeds3')}</div>`; return;
      }
      const tgOf  = k => radarTarget(w, k);
      const raw   = keys.map(k => valueOf(S.latest, k));
      const names = keys.map(k => fieldOrMetricName(k));
      // «نسبة من الهدف» يوحّد مقاييس مختلفة على رسم واحد (إنجاز ٪ مع عدد مخالفات مثلاً)
      const useT  = (o.scaleMode || 'target') === 'target';
      const data  = keys.map((k, i) => {
        const t = tgOf(k);
        if(!useT) return +(+raw[i] || 0).toFixed(2);
        return t ? +Math.max(0, (+raw[i] || 0) / t * 100).toFixed(1) : 0;
      });
      const shown = i => fmtValue(raw[i], fieldOrMetricType(keys[i]) || 'number',
                                  {compact:true, decimals:1});
      const mode  = o.numMode || 'axis';

      let cats = names;                       // تُبنى بعد حساب المساحة المتاحة

      const strip = o.showValues
        ? `<div class="gauge-vals" data-part="strip" style="${partCss(w,'strip')}">` +
          names.map((n, i) => `<span><i style="background:${theme().palette[0]}"></i>${n}: <b>${
            shown(i)}</b>${useT && tgOf(keys[i]) !== 100 ? ` / ${tgOf(keys[i])}` : ''}</span>`).join('') +
          `</div>` : '';
      body.innerHTML = `<div class="gauge-wrap"><div class="gauge-chart"></div>${strip}</div>`;
      const inner   = w.h - (w.title.show ? 38 : 0) - 14;
      const reserve = measureStrip(body, Math.round(inner * 0.34));
      const avail = Math.min(w.w - 20, inner - reserve);
      /* المسميات تُرسم خارج الشكل. بدل ما تتمدّد وتغطّي الرسم: نحجز لها شريطاً
         محدوداً حول الدائرة، ونقصّ الاسم على قدر الشريط، والقيمة تنزل سطراً
         ثانياً فيقلّ العرض للنصف. النص الكامل يظهر عند المرور بالماوس. */
      const axSize  = partOf(w, 'xaxis').size || 10;
      const half    = Math.round(avail / 2);
      const band    = Math.max(30, Math.round(half * 0.45));
      const rsize   = Math.max(40, half - band);
      /* أقصى طول للمسمّى يُحسب من المساحة الفعلية وحجم الخط الحالي — لا برقم
         ثابت. حدّان: عرض الشريط المحجوز، وطول القوس المتاح لكل مسمّى حول
         الدائرة (يضيق كلما زاد عدد العناصر). فتصغير الخط يُظهر حروفاً أكثر. */
      const arcCh   = (2 * Math.PI * (rsize + band * 0.5)) / Math.max(1, keys.length);
      const maxCh   = Math.max(6, Math.floor(Math.min(band / (axSize * 0.42),
                                                      arcCh / (axSize * 0.55))));
      /* المكتبة تُوسّط المسمّى على رأسه، فالرؤوس القريبة من الأفقي (يمين/يسار)
         يزحف نصف نصّها داخل الشكل. نقصّها وحدها أكثر بدل تصغير الرسم كله. */
      const angOf   = i => ((-90 + i * 360 / keys.length) % 360 + 360) % 360;
      const sideAt  = i => { const a = angOf(i);
                             return Math.min(Math.abs(a), Math.abs(a - 180), Math.abs(a - 360)) < 34; };
      /* لا قصّ إلا لكلمة واحدة أطول من ضعف المساحة — الاسم يبقى كاملاً */
      const cut     = (t, n) => { const v = String(t);
                                  return v.length > n * 1.7 ? v.slice(0, Math.round(n * 1.7)) + '…' : v; };
      /* بدل قصّ الاسم على الجانبين، نلفّه سطرين قصيرين: يبقى الاسم كاملاً
         ويقلّ عرضه للنصف فيخرج من فوق الشكل. */
      const wrap    = (t, n) => wrapLabel(t, n, 3).map(x => cut(x, n));
      const nameAt  = i => sideAt(i) ? wrap(names[i], Math.max(7, Math.round(maxCh * 0.6)))
                                     : wrap(names[i], maxCh);
      cats = names.map((n, i) => {
        const lines = nameAt(i);
        const vCh = sideAt(i) ? Math.max(7, Math.round(maxCh * 0.6)) : maxCh;
        return (mode === 'axis') ? lines.concat([cut(shown(i), vCh)]) : lines;
      });

      const radDefs = [theme().palette[0]];
      regItems(w, [useT ? tr('pctOfTarget') : tr('evaluation')], ['r0'], radDefs);
      const radCols = seriesColors(w, 1, radDefs);
      mkChart(body, w, {
        chart:{type:'radar', fontFamily:wFont(w), background:'transparent', toolbar:{show:false}},
        series:[{name:useT ? tr('pctOfTarget') : tr('evaluation'), data}],
        labels:cats, colors:radCols, stroke:{width:lineW(w)},
        dataLabels:(mode === 'chart')
          ? dlOpts(w, wText(w), (v, ctx) => {
              const i = ctx && ctx.dataPointIndex;
              return (i === undefined || i === null || !keys[i]) ? v : shown(i);
            })
          : {enabled:false},
        markers:{size:4}, yaxis:{show:false},
        tooltip:{y:{formatter:(v, ctx) => {
          const i = ctx && ctx.dataPointIndex;
          if(i === undefined || i === null || !keys[i]) return v;
          const t = tgOf(keys[i]);
          return shown(i) + (useT ? ` (${v}% ${tr('ofTarget')} ${t})` : '');
        }}},
        plotOptions:{radar:{size:rsize,
          polygons:{strokeColors:'rgba(125,125,125,.25)', connectorColors:'rgba(125,125,125,.25)'}}},
        xaxis:{labels:{style:Object.assign({}, axisStyle(w, 'xaxis').style,
                       {colors:Array(keys.length).fill(partOf(w, 'xaxis').color || wText(w))})}}
      }, {host:body.querySelector('.gauge-chart'), reserve});
    }
  },
