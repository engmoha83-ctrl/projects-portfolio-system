async function setPresent(on){
  document.body.classList.toggle('presenting', on);
  $('#btnExitPresent').hidden = !on;
  if(on){
    select(null);
    try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); }catch(e){}
  }else{
    try{ if(document.fullscreenElement) await document.exitFullscreen(); }catch(e){}
  }
  setTimeout(() => { zoomFit(); renderAll(); }, 150);   // إعادة رسم نظيفة بدل تكرار الرسم
}
function togglePresent(){ setPresent(!document.body.classList.contains('presenting')); }

$('#btnPresent').addEventListener('click', togglePresent);
$('#btnExitPresent').addEventListener('click', () => setPresent(false));
document.addEventListener('fullscreenchange', () => {          // مزامنة عند الخروج بـ Esc
  if(!document.fullscreenElement && document.body.classList.contains('presenting')) setPresent(false);
});
window.addEventListener('resize', () => {
  if(document.body.classList.contains('presenting')) zoomFit();
});
$('#btnRefresh').addEventListener('click', () => refreshData(false));
$('#btnLang').addEventListener('click', () => { setLang(isEN() ? 'ar' : 'en'); saveSession(); });
$('#btnUndo').addEventListener('click', doUndo);
$('#btnRedo').addEventListener('click', doRedo);
$('#btnZoomIn').addEventListener('click', () => setZoom(S.zoom + .05));
$('#btnZoomOut').addEventListener('click', () => setZoom(S.zoom - .05));
$('#btnZoomFit').addEventListener('click', zoomFit);

/* شريط التكبير + الإدخال اليدوي */
$('#zoomSlider').addEventListener('input', e => setZoom(+e.target.value / 100));
$('#zoomInput').addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  if(isNaN(v) || v < ZMIN * 100 || v > ZMAX * 100) return;   // قيمة ناقصة أثناء الكتابة — ننتظر
  ZTYPING = true; setZoom(v / 100); ZTYPING = false;
});
$('#zoomInput').addEventListener('change', e => {         // عند الخروج: صحّح أي قيمة خارج المدى
  const v = parseFloat(e.target.value);
  setZoom(isNaN(v) ? S.zoom : v / 100);
  e.target.value = Math.round(S.zoom * 100);
});
$('#zoomInput').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
  if(e.key === 'Escape'){ e.target.value = Math.round(S.zoom * 100); e.target.blur(); }
  if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    e.preventDefault();
    setZoom(S.zoom + (e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? .1 : .01));
    e.target.value = Math.round(S.zoom * 100);
  }
});
$('#zoomInput').addEventListener('focus', e => e.target.select());
// Ctrl + عجلة الفأرة فوق اللوحة — التكبير حول موضع المؤشر
$('#canvasArea').addEventListener('wheel', e => {
  if(!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  setZoom(S.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1), {x: e.clientX, y: e.clientY});
}, {passive:false});
$('#layoutName').addEventListener('change', e => S.layoutName = e.target.value);

$('#canvasArea').addEventListener('mousedown', e => {
  if(!(e.target.id === 'canvasArea' || e.target.id === 'page' || e.target.id === 'pageShell')) return;
  if(e.button !== 0) return;
  const additive = e.ctrlKey || e.metaKey || e.shiftKey;
  if(!additive) select(null);

  const rect = page.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / S.zoom, sy = (e.clientY - rect.top) / S.zoom;
  const box = document.createElement('div'); box.className = 'marquee';
  page.appendChild(box);
  let dragged = false;

  function mv(ev){
    const cx = (ev.clientX - rect.left) / S.zoom, cy = (ev.clientY - rect.top) / S.zoom;
    const x1 = Math.min(sx, cx), y1 = Math.min(sy, cy);
    const x2 = Math.max(sx, cx), y2 = Math.max(sy, cy);
    if(x2 - x1 > 4 || y2 - y1 > 4) dragged = true;
    box.style.left = x1 + 'px'; box.style.top = y1 + 'px';
    box.style.width = (x2 - x1) + 'px'; box.style.height = (y2 - y1) + 'px';
  }
  function up(ev){
    document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
    const cx = (ev.clientX - rect.left) / S.zoom, cy = (ev.clientY - rect.top) / S.zoom;
    const x1 = Math.min(sx, cx), y1 = Math.min(sy, cy);
    const x2 = Math.max(sx, cx), y2 = Math.max(sy, cy);
    box.remove();
    if(!dragged){ if(!additive) select(null); return; }
    const hits = S.widgets.filter(w =>
      !(w.x + w.w < x1 || w.x > x2 || w.y + w.h < y1 || w.y > y2)).map(w => w.id);
    if(!hits.length){ if(!additive) select(null); return; }
    S.multi = additive ? Array.from(new Set(S.multi.concat(hits))) : hits;
    S.selected = S.multi[S.multi.length - 1];
    paintSelection(); buildPropsTab(); buildLayersList();
  }
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
});

/* اختصارات لوحة المفاتيح مستقلة عن لغة الإدخال:
   عند لغة غير لاتينية (عربي/روسي/…) يعطي المتصفح e.key الحرف المطبوع (مثلاً «ئ»
   بدل z) فتفشل المقارنة بالحرف. الحل: نجرّب الحرف أولاً — فيبقى صحيحاً في
   التخطيطات اللاتينية مثل AZERTY/QWERTZ — ثم نرجع إلى e.code أي موضع الزر نفسه. */
function isKey(e, ch){
  const k = (e.key || '').toLowerCase();
  if(k === ch) return true;
  if(/^[a-z]$/.test(k)) return false;                 // حرف لاتيني آخر: ليس المطلوب
  const code = e.code || '';
  return /^Key[A-Z]$/.test(code) && code.charAt(3).toLowerCase() === ch;
}

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if(e.target.isContentEditable) return;        // أثناء الكتابة المباشرة داخل عنصر
  const CTRL = e.ctrlKey || e.metaKey;
  if(CTRL && isKey(e, 'z')){ e.preventDefault(); if(e.shiftKey) doRedo(); else doUndo(); return; }
  if(CTRL && isKey(e, 'y')){ e.preventDefault(); doRedo(); return; }
  if(CTRL && isKey(e, 's')){ e.preventDefault(); saveLayout(); return; }
  if(CTRL && isKey(e, 'd')){ e.preventDefault(); duplicateSelected(); return; }
  if(CTRL && isKey(e, 'a')){ e.preventDefault(); selectAll(); return; }      // تحديد الكل
  if(e.key === 'Escape'){
    if(document.body.classList.contains('presenting')){ setPresent(false); return; }
    select(null); return;
  }
  if(e.key === 'F11' || (CTRL && isKey(e, 'p'))){
    e.preventDefault(); togglePresent(); return;
  }
  if(!S.multi.length) return;
  if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); removeSelected(); return; }
  // الأسهم تتحرك بمقدار مقاس الخلية عند تفعيل الالتصاق، و Shift للتحريك الدقيق بكسل واحد
  const step = e.shiftKey ? 1 : (S.page.snap ? (S.page.grid || 1) : 1);
  let dx = 0, dy = 0;
  if(e.key === 'ArrowLeft')      dx = -step;
  else if(e.key === 'ArrowRight')dx =  step;
  else if(e.key === 'ArrowUp')   dy = -step;
  else if(e.key === 'ArrowDown') dy =  step;
  if(dx || dy){ e.preventDefault(); snapshot(); nudgeSelected(dx, dy); }
});
window.addEventListener('beforeunload', e => {
  if(S.dirty){ e.preventDefault(); e.returnValue = ''; }
});

/* =====================================================================
   قوائم الهيدر المنسدلة (ملف / تحرير / عرض / البيانات)
   ===================================================================== */
function selectAll(){
  if(!S.widgets.length) return;
  S.multi = S.widgets.map(w => w.id); S.selected = S.multi[S.multi.length - 1];
  paintSelection(); buildPropsTab(); buildLayersList();
}
function syncMenus(){
  const auto = String(parseInt(S.page.autoRefresh) || 0), src = S.page.progressSource === 'cashflow' ? 'cashflow' : 'weekly';
  document.querySelectorAll('.mi[data-auto]').forEach(b => {
    const on = b.dataset.auto === auto; b.classList.toggle('checked', on); b.setAttribute('aria-checked', on); });
  document.querySelectorAll('.mi[data-src]').forEach(b => {
    const on = b.dataset.src === src; b.classList.toggle('checked', on); b.setAttribute('aria-checked', on); });
  $('#btnUndo').disabled = !S.undo.length;
  $('#btnRedo').disabled = !S.redo.length;
  $('#mDup').disabled = $('#mDel').disabled = !S.multi.length;
  $('#mSelAll').disabled = !S.widgets.length;
}
function menuOpen(){ return document.querySelector('.menu.open'); }
function closeMenus(){
  document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open'));
  document.querySelectorAll('.nv.on').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-expanded', 'false'); });
}
function openMenu(btn){
  closeMenus(); syncMenus();
  btn.classList.add('on'); btn.setAttribute('aria-expanded', 'true');
  btn.nextElementSibling.classList.add('open');
}
document.querySelectorAll('.nv').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    if(btn.classList.contains('on')) closeMenus(); else openMenu(btn);
  });
  // مثل قوائم برامج سطح المكتب: لو فيه قائمة مفتوحة، المرور على غيرها يفتحها
  btn.addEventListener('mouseenter', () => { if(menuOpen() && !btn.classList.contains('on')) openMenu(btn); });
});
// الضغط على أي عنصر في القائمة ينفّذه ويقفلها (إلا خانات الإدخال داخلها)
document.querySelectorAll('.menu').forEach(m => m.addEventListener('click', e => {
  const it = e.target.closest('.mi');
  if(it && !it.disabled) setTimeout(closeMenus, 0);
}));
document.addEventListener('mousedown', e => { if(menuOpen() && !e.target.closest('.mwrap')) closeMenus(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && menuOpen()){ e.stopImmediatePropagation(); closeMenus(); }
}, true);
window.addEventListener('blur', closeMenus);

$('#mSave').addEventListener('click', saveLayout);
$('#mDup').addEventListener('click', duplicateSelected);
$('#mDel').addEventListener('click', removeSelected);
$('#mSelAll').addEventListener('click', selectAll);
document.querySelectorAll('.mi[data-auto]').forEach(b => b.addEventListener('click', () => setAutoRefreshUI(b.dataset.auto)));
document.querySelectorAll('.mi[data-src]').forEach(b => b.addEventListener('click', () => setProgressSource(b.dataset.src)));

function setUiLang(l){
  UIL = (l === 'ar') ? 'ar' : 'en';
  try{ localStorage.setItem(UI_KEY, UIL); }catch(e){}
  applyUiStatic();
  // النصوص المولَّدة بالكود تُبنى من جديد: بالعربي كما هي، وبالإنجليزي تمر بالقاموس
  buildTemplatesTab(); buildPageTab(); buildPropsTab(); updateScopeUI(); updateFetchLabel(); applyLang();
  const ln = $('#layoutName');
  if(!S.layoutId && (ln.value === 'قالب جديد' || ln.value === 'New layout')) ln.value = U('New layout', 'قالب جديد');
  trTree($('.sidebar')); trTree($('#modalBack'));
  setTimeout(zoomFit, 30);
}
$('#btnUiLang').addEventListener('click', () => setUiLang(uiEN() ? 'ar' : 'en'));

/* التشغيل */
applyUiStatic(); uiObserve();
$('#layoutName').value = S.layoutName;
buildTemplatesTab(); buildPageTab(); buildPropsTab(); applyPageStyle(); updateScopeUI(); zoomFit();

(async function boot(){
  const sess = loadSession();
  const sel = $('#projectSel');
  const known = Array.from(sel.options).some(o => o.value === (sess && sess.project));
  if(sess && sess.project && known){
    sel.value = sess.project;
    await loadProject(sess.project, {silent:true});          // يستعيد المشروع وقالبه المطبَّق
    if(sess.layoutId && sess.layoutId !== S.layoutId){
      try{ await loadLayout(sess.layoutId); }catch(e){}      // القالب الذي كان مفتوحاً تحديداً
    }
    toast(isEN() ? 'Restored your last session' : 'تم استرجاع آخر مشروع وقالب كنت تعمل عليهما');
  }else{
    await resolveLayout('');                                  // القالب العام
    renderAll();
  }
  setAutoRefresh(S.page.autoRefresh || 0);
  updateScopeUI(); updateFetchLabel(); zoomFit();
})();
</script>
