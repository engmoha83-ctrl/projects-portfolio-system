<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مُنشئ الداشبورد | المعماريون السعوديون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@400;600;700;900&family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --ui-bg:#f2f4f8; --ui-panel:#ffffff; --ui-bar:#0f1a2e; --ui-bar-2:#16233d;
  --ui-line:#e2e7f0; --ui-text:#1a2b4c; --ui-muted:#6c7a91; --ui-gold:#d4a373;
  --ui-accent:#2685c9; --ui-danger:#d9463f; --ui-ok:#1e8e5a;
  --sidebar-w:320px; --topbar-h:56px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:'Tajawal','Segoe UI',Tahoma,sans-serif; background:var(--ui-bg); color:var(--ui-text);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}

/* ============ الشريط العلوي ============ */
.topbar{
  height:var(--topbar-h); background:var(--ui-bar); color:#fff; display:flex; align-items:center;
  gap:10px; padding:0 14px; border-bottom:2px solid var(--ui-gold);
}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;white-space:nowrap;}
.topbar .brand span{color:var(--ui-gold);}
.topbar .sep{width:1px;height:26px;background:rgba(255,255,255,.18);}
.topbar .spacer{flex:1;}
.tb-btn{
  background:rgba(255,255,255,.10); color:#fff; border:1px solid rgba(255,255,255,.18);
  border-radius:8px; padding:6px 12px; font-size:.82rem; cursor:pointer; white-space:nowrap; transition:.15s;
}
.tb-btn:hover{background:rgba(255,255,255,.2);}
.tb-btn.primary{background:var(--ui-gold); border-color:var(--ui-gold); color:#22160a; font-weight:700;}
.tb-btn.primary:hover{background:#e0b98d;}
.tb-btn.ghost{background:transparent;}

/* ===== شريط التكبير ===== */
.zoom-box{
  display:flex; align-items:center; gap:6px; padding:3px 6px; border-radius:9px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
}
.zoom-box .tb-btn{padding:2px 8px; font-size:.9rem; line-height:1.15; border-radius:6px;}
.zoom-box .zoom-val{
  display:flex; align-items:center; gap:1px; direction:ltr;
  background:rgba(0,0,0,.22); border-radius:6px; padding:2px 5px;
}
.zoom-box .zoom-val b{font-size:.7rem; color:rgba(255,255,255,.65); font-weight:600;}
#zoomInput{
  width:34px; background:transparent; border:none; color:#fff; font-family:inherit;
  font-size:.78rem; font-weight:700; text-align:center; padding:1px 0; -moz-appearance:textfield;
}
#zoomInput::-webkit-outer-spin-button,#zoomInput::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
#zoomInput:focus{outline:1px solid var(--ui-gold); outline-offset:1px; border-radius:4px;}
#zoomSlider{
  -webkit-appearance:none; appearance:none; width:118px; height:4px; border-radius:4px;
  background:rgba(255,255,255,.25); cursor:pointer; direction:ltr; margin:0;
}
#zoomSlider:focus{outline:none;}
#zoomSlider::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%;
  background:var(--ui-gold); border:2px solid #fff; cursor:grab; box-shadow:0 1px 3px rgba(0,0,0,.4);
}
#zoomSlider::-webkit-slider-thumb:active{cursor:grabbing; transform:scale(1.12);}
#zoomSlider::-moz-range-thumb{
  width:12px; height:12px; border-radius:50%; background:var(--ui-gold);
  border:2px solid #fff; cursor:grab; box-shadow:0 1px 3px rgba(0,0,0,.4);
}
#zoomSlider::-moz-range-track{height:4px; border-radius:4px; background:rgba(255,255,255,.25);}
@media (max-width:1200px){ #zoomSlider{width:76px;} }
.tb-input,.tb-select{
  background:rgba(255,255,255,.10); color:#fff; border:1px solid rgba(255,255,255,.2);
  border-radius:8px; padding:6px 10px; font-size:.82rem; font-family:inherit; max-width:210px;
}
.tb-select option{color:#111;}
.tb-input::placeholder{color:rgba(255,255,255,.5);}
.fetch-time{font-size:.7rem; color:rgba(255,255,255,.62); white-space:nowrap;}
#btnRefresh.busy{opacity:.6; pointer-events:none;}
#btnRefresh.busy #refreshIcon{display:inline-block; animation:spin 0.9s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.scope-chip{
  font-size:.72rem; font-weight:700; padding:4px 9px; border-radius:20px; white-space:nowrap;
  background:rgba(212,163,115,.18); color:var(--ui-gold); border:1px solid rgba(212,163,115,.45);
}
.scope-chip.custom{background:rgba(38,133,201,.20); color:#8ecbff; border-color:rgba(38,133,201,.5);}
.theme-prev{display:flex; gap:4px; margin:6px 0 9px; align-items:center;}
.theme-prev .tp-page{width:26px; height:22px; border-radius:6px; border:1px solid var(--ui-line);}
.theme-prev .tp-c{width:15px; height:22px; border-radius:4px;}
.lay-badge{
  font-size:.68rem; font-weight:700; padding:2px 7px; border-radius:20px; margin-inline-start:6px;
  background:#f4ead9; color:#8a6134; border:1px solid #e5d3b6;
}

/* ============ التخطيط العام ============ */
.workspace{display:flex; height:calc(100% - var(--topbar-h));}
.sidebar{
  width:var(--sidebar-w); min-width:var(--sidebar-w); background:var(--ui-panel);
  border-inline-start:1px solid var(--ui-line); display:flex; flex-direction:column; overflow:hidden;
}
.side-tabs{display:flex; border-bottom:1px solid var(--ui-line); background:#f8fafc;}
.side-tab{
  flex:1; padding:11px 4px; text-align:center; font-size:.8rem; font-weight:700; color:var(--ui-muted);
  cursor:pointer; border-bottom:3px solid transparent; transition:.15s; user-select:none;
}
.side-tab:hover{background:#eef2f8;}
.side-tab.active{color:var(--ui-text); border-bottom-color:var(--ui-gold); background:#fff;}
.side-body{flex:1; overflow-y:auto; padding:12px;}
.side-body::-webkit-scrollbar{width:8px;}
.side-body::-webkit-scrollbar-thumb{background:#cbd4e2;border-radius:4px;}

.canvas-area{
  flex:1; overflow:auto; padding:26px; display:flex; justify-content:flex-start; align-items:flex-start;
  background:
    linear-gradient(90deg,rgba(0,0,0,.03) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(rgba(0,0,0,.03) 1px,transparent 1px) 0 0/24px 24px, var(--ui-bg);
}
.page-shell{margin:auto; flex:0 0 auto; position:relative;}   /* margin:auto يوسّط بأمان حتى عند التمرير */
#page{
  /* موضع صريح من الركن الأيسر: في صفحة RTL كان الصندوق يلتصق باليمين فينزاح بعد التكبير */
  position:absolute; left:0; top:0; background:#fff; box-shadow:0 10px 40px rgba(15,26,46,.18); overflow:hidden;
  border-radius:6px;
}
#page.show-grid::before{
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background-image:linear-gradient(90deg,rgba(26,43,76,.07) 1px,transparent 1px),
                   linear-gradient(rgba(26,43,76,.07) 1px,transparent 1px);
  background-size:var(--gs) var(--gs);
}

/* ============ الـ Visuals ============ */
.bw{
  position:absolute; z-index:1; display:flex; flex-direction:column; overflow:visible;
  background:#fff; transition:box-shadow .12s; cursor:move;
}
.bw.selected{outline:2px dashed #74b3e0; outline-offset:1px; z-index:5;}
.bw.selected.primary{outline:2px solid var(--ui-accent);}
.bw-title{
  flex:0 0 auto; padding:7px 10px; font-weight:700; line-height:1.35; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;
}
.bw-body{flex:1 1 auto; min-height:0; position:relative; overflow:hidden; padding:6px;}
/* لا غطاء شفاف فوق المحتوى: السحب من جسم العنصر نفسه حتى يعمل شريط
   التمرير وعجلة الفأرة داخل الجداول والقوائم */
.bw.editing{cursor:auto;}
.bw-tools{
  position:absolute; top:-30px; inset-inline-start:0; display:none; gap:4px; z-index:20;
}
.bw.primary .bw-tools{display:flex;}
.bw-tools button{
  background:var(--ui-bar); color:#fff; border:none; border-radius:6px; width:26px; height:26px;
  font-size:.8rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
/* صليب اتجاهات: كل سهم في موضعه الحقيقي، فلا يلتبس الترتيب ولا ينعكس مع RTL */
.dpad{
  display:grid; direction:ltr;
  grid-template-areas:". u ." "l . r" ". d .";
  grid-template-columns:repeat(3, 17px); grid-template-rows:repeat(3, 15px);
  gap:1px; margin:-8px 3px 0; align-self:flex-start;
}
.bw-tools .dpad button{
  width:17px; height:15px; font-size:.5rem; border-radius:3px; opacity:.9; padding:0;
}
.bw-tools .dpad button:hover{opacity:1; background:var(--ui-gold,#b8860b);}
.bw-tools button:hover{background:var(--ui-accent);}
.bw-tools button.del:hover{background:var(--ui-danger);}
.hnd{position:absolute; width:10px; height:10px; background:#fff; border:2px solid var(--ui-accent);
     border-radius:2px; z-index:10; display:none;}
.bw.primary .hnd{display:block;}
/* مقابض التحجيم بإحداثيات فيزيائية (يسار/يمين) حتى لا تنعكس مع اتجاه الصفحة RTL */
.hnd[data-d="nw"]{top:-5px; left:-5px; cursor:nwse-resize;}
.hnd[data-d="ne"]{top:-5px; right:-5px; cursor:nesw-resize;}
.hnd[data-d="sw"]{bottom:-5px; left:-5px; cursor:nesw-resize;}
.hnd[data-d="se"]{bottom:-5px; right:-5px; cursor:nwse-resize;}
.hnd[data-d="n"]{top:-5px; left:calc(50% - 5px); cursor:ns-resize;}
.hnd[data-d="s"]{bottom:-5px; left:calc(50% - 5px); cursor:ns-resize;}
.hnd[data-d="w"]{left:-5px; top:calc(50% - 5px); cursor:ew-resize;}
.hnd[data-d="e"]{right:-5px; top:calc(50% - 5px); cursor:ew-resize;}

/* وضع الكتابة المباشرة داخل العنصر */
.bw.editing{outline:2px dashed var(--ui-accent); outline-offset:2px; z-index:8;}
.bw.editing .hnd{display:none;}
.bw [contenteditable="true"]{outline:none; cursor:text; white-space:pre-wrap; overflow:auto;}
.bw-edit-tip{
  position:absolute; bottom:-24px; inset-inline-start:0; background:var(--ui-accent); color:#fff;
  font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:6px; white-space:nowrap; z-index:20;
}
.txt-placeholder{opacity:.45;}

.marquee{position:absolute; border:1.5px dashed var(--ui-accent); background:rgba(38,133,201,.10);
         z-index:60; pointer-events:none; border-radius:3px;}
.guide{position:absolute; background:#ff2d78; z-index:50; pointer-events:none;}
.guide.v{width:1px; top:0; bottom:0;}
.guide.h{height:1px; left:0; right:0;}

/* محتوى القوالب */
.kpi-wrap{height:100%; overflow:auto; display:flex; flex-direction:column; justify-content:center;
  align-items:center; text-align:center; gap:2px; padding:2px;}
.kpi-value{max-width:100%;}
.kpi-value{font-weight:900; line-height:1.15; word-break:break-word;}
.kpi-label{font-size:.96em; color:inherit; opacity:.72;}
.kpi-delta{font-size:.92em; font-weight:700;}
.kpi-delta.up{color:var(--ui-ok);} .kpi-delta.down{color:var(--ui-danger);}
.tbl{width:100%; border-collapse:collapse; font-size:.96em;}
.tbl td{padding:5px 7px; border-bottom:1px solid rgba(128,128,128,.22); vertical-align:top;}
.tbl td:first-child{color:inherit; opacity:.72; font-weight:700; white-space:nowrap; width:42%;}
.tbl tr:last-child td{border-bottom:none;}
.txt-visual{height:100%; overflow:auto; white-space:pre-wrap; word-break:break-word;}
/* ترتيب صحيح للنص العربي داخل رسومات ApexCharts (خصوصاً الأعمدة الأفقية بحاوية LTR) */
.bw svg text{ unicode-bidi:plaintext; }
.gauge-wrap{height:100%; display:flex; flex-direction:column; min-height:0;}
.gauge-chart{flex:1 1 auto; min-height:0; overflow:hidden;}
.gauge-vals{
  flex:0 0 auto; overflow-y:auto; display:flex; flex-wrap:wrap; gap:3px 10px;
  justify-content:center; align-content:flex-start;
  padding:4px 2px 5px; line-height:1.35;
}
.gauge-vals span{display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}
.gauge-vals i{width:9px; height:9px; border-radius:3px; display:inline-block;}
.spi-card{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; text-align:center;}
.spi-val{font-weight:900; line-height:1;}
.spi-status{color:#fff; font-weight:700; font-size:.96em; padding:3px 12px; border-radius:20px;}
.spi-base{opacity:.75; text-align:center; padding-top:2px;}
.rk-wrap{height:100%; overflow-y:auto;}
.rk-tbl td{vertical-align:middle;}
.rk-tbl td.rk-num{width:1%; white-space:nowrap; color:inherit; opacity:1;}
.rk-tbl td.rk-num span{
  display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px;
  border-radius:50%; background:rgba(128,128,128,.18); font-weight:800; font-size:.89em;
}
.rk-tbl tr.rk-first td.rk-num span{background:#d4a373; color:#22160a;}
.rk-tbl td.rk-name{width:auto; color:inherit; opacity:1; font-weight:600; white-space:normal;}
.rk-tbl td.rk-val{width:1%; white-space:nowrap; font-weight:800; text-align:end;}
.rk-bar{margin-top:4px; height:5px; border-radius:3px; background:rgba(128,128,128,.18); overflow:hidden;}
.rk-bar i{display:block; height:100%; border-radius:3px;}
.obs-wrap{height:100%; display:flex; flex-direction:column; min-height:0; gap:5px;}
.obs-scroll{flex:1 1 auto; min-height:0; overflow-y:auto;}
.obs-sum{flex:0 0 auto; display:flex; gap:12px; flex-wrap:wrap; padding-bottom:4px;
         border-bottom:1px solid rgba(128,128,128,.22);}
.obs-sum .o-open{color:#d9463f;} .obs-sum .o-closed{color:#1e8e5a;}
.obs-tbl td{vertical-align:middle;}
.obs-tbl td.obs-desc{width:auto; color:inherit; opacity:1; font-weight:500; white-space:normal;}
.obs-tbl td.obs-chips{width:1%; white-space:nowrap; text-align:end;}
.obs-chip{
  display:inline-block; font-size:.84em; font-weight:700; padding:2px 8px; border-radius:20px;
  margin-inline-start:4px; white-space:nowrap; color:#fff;
}
.imp-high{background:#d9463f;} .imp-mid{background:#d99425;}
.imp-low{background:#2685c9;}  .imp-none{background:#8a94a6;}
.st-open{background:#f0e2e1; color:#a3352f;} .st-closed{background:#e2f2ea; color:#186b45;}
.obs-cards{flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
.obs-card{border:1px solid rgba(128,128,128,.25); border-radius:9px; padding:7px 9px;
          display:flex; align-items:center; justify-content:space-between; gap:8px;}
.obs-card .obs-desc{flex:1; font-weight:600; line-height:1.5;}
.img-wrap{height:100%; display:flex; flex-direction:column; min-height:0;}
.img-wrap img{flex:1 1 auto; min-height:0; width:100%; display:block;}
.img-cap{flex:0 0 auto; text-align:center; opacity:.75; padding-top:5px;}
.empty-note{
  height:100%; display:flex; align-items:center; justify-content:center; text-align:center;
  color:var(--ui-muted); font-size:.98em; padding:8px;
}

/* ============ عناصر الشريط الجانبي ============ */
.tpl-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
.tpl-card{
  border:1px solid var(--ui-line); border-radius:10px; padding:10px 6px; text-align:center; cursor:pointer;
  background:#fbfcfe; transition:.15s; user-select:none;
}
.tpl-card:hover{border-color:var(--ui-gold); background:#fff; transform:translateY(-2px); box-shadow:0 6px 14px rgba(15,26,46,.08);}
.tpl-ico{font-size:1.5rem; display:block; margin-bottom:4px;}
.tpl-name{font-size:.74rem; font-weight:700; line-height:1.3;}
.grp{margin-bottom:16px;}
.dt-wrap{height:100%; overflow:auto;}
.dt-tbl{width:100%;}
/* رأس الجدول ثابت أثناء التمرير — لا بد من خلفية معتمة صريحة وz-index،
   وإلا مرّت الصفوف من تحته فتداخل النص. اللون يُحقن من خلفية القالب نفسه. */
.dt-tbl th{padding:5px 7px; text-align:start; white-space:nowrap; position:sticky; top:0;
           z-index:2; background:#fff; border-bottom:2px solid rgba(128,128,128,.3);}
.dt-tbl thead{background:var(--ui-card,#fff);}
.dt-tbl tbody td{background-clip:padding-box;}
.dt-tbl td{white-space:nowrap; text-align:center;}
.dt-tbl td.t-key{text-align:start; white-space:normal; width:auto;}
.dt-tbl td.t-idx{width:1%; opacity:.6;}
.dt-tbl tr.zeb td{background:rgba(128,128,128,.055);}
.fld-list{
  max-height:220px; overflow-y:auto; border:1px solid var(--ui-line); border-radius:8px;
  padding:5px; margin-bottom:8px; background:var(--ui-card);
}
.fld-item{
  display:flex; align-items:center; gap:7px; padding:4px 6px; border-radius:6px;
  font-size:.75rem; font-weight:500; cursor:pointer; line-height:1.45;
}
.fld-item:hover{background:rgba(128,128,128,.09);}
.fld-item input{flex:0 0 auto; margin:0;}
.fld-item span{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.fld-count{font-size:.7rem; font-weight:800; color:var(--ui-muted);}
.part-tabs{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:9px;}
.part-tab{
  border:1px solid var(--ui-line); background:var(--ui-card); border-radius:7px; padding:4px 9px;
  font-size:.7rem; font-weight:700; cursor:pointer; color:var(--ui-muted); font-family:inherit; transition:.12s;
}
.part-tab:hover{border-color:var(--ui-gold); color:var(--ui-text);}
.part-tab.on{background:var(--ui-navy,#1a2b4c); border-color:var(--ui-navy,#1a2b4c); color:#fff;}
.hint-inline{font-size:.62rem; font-weight:600; color:var(--ui-muted); margin-inline-start:6px;}
.inh{font-weight:700; color:var(--ui-gold,#b8860b); font-size:.92em;}
.mini-val{font-size:.68rem; color:var(--ui-muted); font-weight:700; min-width:44px; text-align:center;}
.ctl.rng{display:flex; align-items:center; gap:8px; flex-wrap:nowrap;}
.ctl.rng input[type=range]{flex:1 1 auto; min-width:0;}
.num-box{flex:0 0 84px; display:inline-flex; align-items:center; justify-content:center; gap:2px;}
.num-box input{width:56px; text-align:center;}
.num-box i{font-style:normal; font-size:.68rem; color:var(--ui-muted); font-weight:700;}
.grp-h{
  font-size:.72rem; font-weight:800; color:var(--ui-muted); letter-spacing:.02em; margin-bottom:8px;
  padding-bottom:5px; border-bottom:1px solid var(--ui-line); display:flex; align-items:center; gap:6px;
}
.row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.row label{flex:0 0 78px; font-size:.75rem; color:var(--ui-muted); font-weight:700;}
.row .ctl{flex:1; min-width:0;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
.mini{display:flex; flex-direction:column; gap:3px;}
.mini span{font-size:.7rem; color:var(--ui-muted); font-weight:700;}
input[type=text],input[type=number],select,textarea{
  width:100%; border:1px solid var(--ui-line); border-radius:7px; padding:6px 8px; font-size:.78rem;
  font-family:inherit; background:#fff; color:var(--ui-text);
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--ui-accent);}
input[type=color]{width:100%; height:30px; padding:2px; border:1px solid var(--ui-line); border-radius:7px; background:#fff; cursor:pointer;}
input[type=range]{width:100%;}
.swatches{display:flex; flex-wrap:wrap; gap:5px; margin-top:5px;}
.sw{width:19px; height:19px; border-radius:5px; cursor:pointer; border:2px solid #fff; box-shadow:0 0 0 1px var(--ui-line);}
.sw:hover{transform:scale(1.12);}
.chk{display:flex; align-items:center; gap:7px; font-size:.78rem; font-weight:700; margin-bottom:8px; cursor:pointer;}
.chk input{width:15px; height:15px; accent-color:var(--ui-accent); cursor:pointer;}
.btn-row{display:flex; gap:6px; flex-wrap:wrap;}
.sbtn{
  flex:1; border:1px solid var(--ui-line); background:#fff; border-radius:7px; padding:6px 4px;
  font-size:.74rem; font-weight:700; cursor:pointer; color:var(--ui-text); transition:.12s; min-width:0;
}
.sbtn:hover{border-color:var(--ui-accent); color:var(--ui-accent);}

.layer.on{background:#eef5fb; border-color:#74b3e0; font-weight:700;}

.lyr-btn{flex:0 0 auto; width:20px; height:20px; border:1px solid var(--ui-line); background:#fff;

.lyr-btn:hover{background:var(--ui-navy,#1a2b4c); color:#fff; border-color:var(--ui-navy,#1a2b4c);}

.modal-back{
  position:fixed; inset:0; background:rgba(15,26,46,.55); display:none; align-items:center; justify-content:center; z-index:900;
}
.modal-back.open{display:flex;}
.modal{
  background:#fff; border-radius:14px; width:min(560px,92vw); max-height:80vh; display:flex; flex-direction:column;
  box-shadow:0 24px 60px rgba(0,0,0,.35); overflow:hidden;
}
.modal h3{margin:0; padding:14px 18px; background:var(--ui-bar); color:#fff; font-size:.95rem;}
.modal-body{padding:14px 18px; overflow-y:auto;}
.modal-foot{padding:12px 18px; border-top:1px solid var(--ui-line); display:flex; justify-content:flex-start; gap:8px;}
.lay-item{
  display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--ui-line); border-radius:10px; margin-bottom:8px;
}
.lay-item .li-main{flex:1; min-width:0;}
.lay-item .li-name{font-weight:700; font-size:.85rem;}
.lay-item .li-sub{font-size:.72rem; color:var(--ui-muted);}

body.presenting .topbar,
body.presenting .sidebar{display:none !important;}
body.presenting .workspace{height:100vh;}
body.presenting .canvas-area{padding:12px; background:#11151c;}
body.presenting .bw-tools,
body.presenting .hnd{display:none !important;}
body.presenting .bw{cursor:default;}
body.presenting .bw.selected,
body.presenting .bw.primary{outline:none !important;}
body.presenting #page.show-grid::before{display:none;}
body.presenting #page{box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 20px 60px rgba(0,0,0,.55);}
.present-exit{
  position:fixed; top:14px; inset-inline-end:14px; z-index:950; cursor:pointer;
  background:rgba(15,26,46,.82); color:#fff; border:1px solid rgba(255,255,255,.25);

}
.present-exit:hover{opacity:1;}
.present-exit[hidden]{display:none !important;}

.toast{

.toast.show{opacity:1; transform:translateY(0);}
.toast.err{background:var(--ui-danger);}

function toast(msg, isErr){

  clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 2600);

function uid(){ return 'w' + (S.seq++) + Math.random().toString(36).slice(2,6); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }

function autoDecimals(type){ return type === 'percent' ? 1 : 0; }
function compactNum(n){
  const a = Math.abs(n);
  if(a >= 1e9) return (n/1e9).toFixed(2).replace(/\.?0+$/,'') + ' ' + tr('billion');
  if(a >= 1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,'') + ' ' + tr('million');
  if(a >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'') + ' ' + tr('thousand');
  return n.toLocaleString('en-US');
}
function fmtValue(v, type, o){
  o = o || {};
  if(v === null || v === undefined || v === '') return '—';
  const d = (o.decimals === undefined || o.decimals === null) ? autoDecimals(type) : o.decimals;
  if(type === 'percent'){
    let n = num(v); if(Math.abs(n) <= 1.0001) n *= 100;
    return n.toFixed(d) + '%';
  }
  if(type === 'currency'){
    const n = num(v);
    return (o.compact ? compactNum(n)
      : n.toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d})) + ' ' + tr('currency');
  }
  if(type === 'days'){
    return num(v).toLocaleString('en-US') + ' ' + tr('dayUnit');
  }
  if(type === 'points'){
    const n = num(v);
    const unit = (o.pointsAs === 'pct') ? '%' : ' ' + tr('pointUnit');
    return (n > 0 ? '+' : '') + n.toFixed(d === 0 ? 1 : d) + unit;
  }
  if(type === 'ratio'){
    return num(v).toFixed(d || 2);
  }
  if(type === 'number'){
    const n = num(v);
    return o.compact ? compactNum(n) : n.toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
  }
  return String(v);
}
function pct(v){ let n = num(v); if(Math.abs(n) <= 1.0001) n *= 100; return +n.toFixed(2); }

const ALL_PROJECTS = '__ALL__';

/* حقول التقييم درجات من ١٠٠ — تُجمَّع كمتوسط مرجّح لا كمجموع */
const RATING_FIELDS = ['eval_labor','eval_equip','eval_financial','eval_hse'];

function aggregate(rows){
  if(!rows || !rows.length) return null;
  const out = {};
  const wts  = rows.map(r => num(r.contractor_val) || 0);
  const wsum = wts.reduce((a, b) => a + b, 0);
  const wavg = key => {
    const vals = rows.map(r => num(r[key]));
    return wsum > 0 ? vals.reduce((a, v, i) => a + v * wts[i], 0) / wsum
                    : vals.reduce((a, v) => a + v, 0) / vals.length;
  };

  FIELD_META.forEach(f => {
    const k = f.key, t = f.type;
    if(RATING_FIELDS.indexOf(k) >= 0){
      out[k] = Math.round(wavg(k) * 10) / 10;                      // متوسط التقييم
    }else if(t === 'percent'){
      out[k] = wavg(k);                                            // متوسط مرجّح بقيمة العقد (0–1)
    }else if(t === 'currency' || t === 'number'){
      out[k] = rows.reduce((a, r) => a + num(r[k]), 0);            // مجموع
    }else if(t === 'days'){
      out[k] = Math.round(rows.reduce((a, r) => a + num(r[k]), 0) / rows.length);  // متوسط
    }else if(t === 'date'){
      const ds = rows.map(r => r[k]).filter(Boolean).sort();
      if(ds.length) out[k] = /^(start|current)/.test(k) ? ds[0] : ds[ds.length - 1];
      else out[k] = null;
    }else if(t === 'image'){ out[k] = ''; }
  });

  // المعوقات: تُدمج مع اسم المشروع
  let obs = [];
  rows.forEach(r => {
    let l = r.obstacles_data;
    if(typeof l === 'string'){ try{ l = JSON.parse(l || '[]'); }catch(e){ l = []; } }
    if(Array.isArray(l)) l.forEach(o => {
      if(o && (o.description || o.obstacle))
        obs.push(Object.assign({}, o, {description:`[${r.project_name}] ${o.description || o.obstacle}`}));
    });
  });
  out.obstacles_data = obs;

  const names = Array.from(new Set(rows.map(r => r.project_name).filter(Boolean)));
  out.project_name  = tr('allProjects')(names.length);
  out.project_desc  = tr('allDesc');
  out.project_type  = '—'; out.manager_name = tr('managers')(names.length);
  out.project_owner = '—'; out.project_developer = '—'; out.project_contractor = '—';
  out.works_completed = out.works_ongoing = out.works_planned = '—';
  return out;
}

/* آخر تحديث لكل مشروع */
function latestPerProject(rows){
  const m = {};
  rows.forEach(r => {
    const k = r.project_name; if(!k) return;
    if(!m[k] || String(r.current_data_date || '') >= String(m[k].current_data_date || '')) m[k] = r;
  });
  return Object.keys(m).sort().map(k => m[k]);
}

/* خط زمني مجمّع: تجميع كل المشاريع في كل تاريخ */
/* خط زمني مجمّع صحيح: عند كل تاريخ نأخذ لكل مشروع آخر تحديث له في ذلك التاريخ أو قبله
   (carry-forward). بدون ذلك يشمل كل تاريخ المشاريع التي صادف أن حدّثت فيه فقط،
   فتقفز الأرقام وتهبط بلا معنى. */
function aggregateTimeline(rows){
  const dates = Array.from(new Set(rows.map(r => r.current_data_date).filter(Boolean)))
                     .sort((a, b) => String(a).localeCompare(String(b)));
  const byProject = {};
  rows.forEach(r => {
    const k = r.project_name || '—';
    (byProject[k] = byProject[k] || []).push(r);
  });
  Object.keys(byProject).forEach(k => byProject[k].sort(
    (a, b) => String(a.current_data_date).localeCompare(String(b.current_data_date))));

  return dates.map(d => {
    const snap = [];
    Object.keys(byProject).forEach(k => {
      let last = null;
      const list = byProject[k];
      for(let i = 0; i < list.length; i++){
        if(String(list[i].current_data_date) <= String(d)) last = list[i]; else break;
      }
      if(last) snap.push(last);                 // المشاريع التي لم تبدأ بعد تُستثنى
    });
    if(!snap.length) return null;
    const a = aggregate(snap);
    a.current_data_date = d;
    a._projects = snap.length;                  // عدد المشاريع الداخلة في هذه النقطة
    return a;
  }).filter(Boolean);
}

/* ---------------- سجل التراجع ---------------- */
function snapshot(){
  S.undo.push(JSON.stringify({widgets:S.widgets, page:S.page}));
  if(S.undo.length > 40) S.undo.shift();
  S.redo.length = 0; S.dirty = true;
}
function applyState(str){
  const prev = S.selected;
  const st = JSON.parse(str);
  S.widgets = st.widgets; S.page = st.page;
  S.multi = (S.multi || []).filter(id => S.widgets.some(w => w.id === id));
  S.selected = S.widgets.some(w => w.id === prev) ? prev : (S.multi[0] || null);   // حافظ على التحديد
  renderAll(); buildPageTab(); buildPropsTab();
}
function doUndo(){
  if(!S.undo.length) return;
  S.redo.push(JSON.stringify({widgets:S.widgets, page:S.page}));
  applyState(S.undo.pop());
}
function doRedo(){
  if(!S.redo.length) return;
  S.undo.push(JSON.stringify({widgets:S.widgets, page:S.page}));
  applyState(S.redo.pop());
}

function dayDiff(a, b){
  if(!a || !b) return 0;
  const d1 = new Date(a), d2 = new Date(b);
  if(isNaN(d1.getTime()) || isNaN(d2.getTime())) return 0;
  return Math.round((d2 - d1) / 86400000);
}

const UPD_FIELD = '@updated';
/** يضبط عنوان بطاقة المؤشر تلقائياً مع تغيير الحقل، ما لم يكن المستخدم قد كتب عنواناً بنفسه */
function kpiAutoTitle(w, field){
  if(!w.title) return;
  const auto = k => k === UPD_FIELD ? {ar:'آخر تحديث للبيانات', en:'Last data update'}
                                    : {ar:(FIELD_MAP[k] || {}).label || k,
                                       en:(FIELD_MAP[k] || {}).label_en || (FIELD_MAP[k] || {}).label || k};
  const cur = String(w.title.text || '').trim();
  const known = FIELD_META.map(f => f.label).concat(['آخر تحديث للبيانات', 'الإنجاز الفعلي', VISUALS.kpi.title]);
  if(cur && known.indexOf(cur) < 0) return;      // عنوان كتبه المستخدم — لا نلمسه
  const a = auto(field);
  w.title.text = a.ar; w.title.text_en = a.en;
}
const UPD_SOURCES = ['submitted', 'data_date', 'fetched'];
function updSourceName(k){
  return {submitted:tr('updSubmitted'), data_date:tr('updDataDate'), fetched:tr('updFetched')}[k] || k;
}
/** يعيد لحظة آخر تحديث حسب المصدر المختار — Date أو null */
function updMoment(src){
  if(src === 'fetched') return S.lastFetch ? new Date(S.lastFetch) : null;
  const r = S.latest;
  if(!r) return null;
  if(src === 'data_date'){
    const d = r.current_data_date ? new Date(String(r.current_data_date).slice(0,10) + 'T00:00:00') : null;
    return (d && !isNaN(d.getTime())) ? d : null;
  }
  // submitted: تاريخ الإرسال + وقته إن وُجد، وإلا تاريخ البيانات
  const day = r.submission_date || r.current_data_date;
  if(!day) return null;
  const t = String(r.submission_time || '').trim();
  const hm = /^\d{1,2}:\d{2}/.test(t) ? (t.length === 4 ? '0' + t : t.slice(0,5)) : '00:00';
  const d = new Date(String(day).slice(0,10) + 'T' + hm + ':00');
  return isNaN(d.getTime()) ? null : d;
}
function updRelative(d){
  if(!d) return '';
  let diff = (Date.now() - d.getTime()) / 1000;
  if(diff < 0) diff = 0;
  if(diff < 60) return tr('updNow');
  const pick = (n, u) => {
    if(isEN()) return tr('updAgo')(n, n === 1 ? tr('updAgoOne')[u] : tr('updAgoTwo')[u]);
    if(n === 1) return 'منذ ' + tr('updAgoOne')[u];
    if(n === 2) return 'منذ ' + tr('updAgoTwo')[u];
    return tr('updAgo')(n, n <= 10 ? tr('updAgoFew')[u] : tr('updAgoMany')[u]);
  };
  if(diff < 3600)  return pick(Math.floor(diff / 60), 'm');
  if(diff < 86400) return pick(Math.floor(diff / 3600), 'h');
  return pick(Math.floor(diff / 86400), 'd');
}
function updFormat(d, fmt, withTime){
  if(!d) return tr('updNone');
  const loc = isEN() ? 'en-GB' : 'ar-EG';
  const dOpt = {year:'numeric', month:'long', day:'numeric'};
  const tOpt = {hour:'2-digit', minute:'2-digit'};
  let out;
  try{
    out = d.toLocaleDateString(loc, dOpt);
    if(withTime) out += ' — ' + d.toLocaleTimeString(loc, tOpt);
  }catch(e){ out = d.toISOString().slice(0, withTime ? 16 : 10).replace('T', ' '); }
  if(fmt === 'rel')     return updRelative(d);
  if(fmt === 'both')    return out + ' (' + updRelative(d) + ')';
  return out;
}

function metricName(k){ const m = METRICS[k]; return m ? (isEN() ? m.en : m.ar) : k; }
function isMetric(k){ return !!METRICS[k]; }
function fieldOrMetricName(k){ return isMetric(k) ? metricName(k) : lbl(k); }
function fieldOrMetricType(k){ return isMetric(k) ? METRICS[k].type : ((FIELD_MAP[k] || {}).type || 'number'); }
/* مقارنة الفرز حسب نوع العمود: الأرقام والنسب والمبالغ عددياً، التواريخ زمنياً،
   والنصوص أبجدياً بترتيب اللغة (مع معالجة الأرقام داخل النص). القيم الفارغة تُدفع للآخر. */
function sortKeyType(k){
  if(k === '@key') return 'text';
  if(isMetric(k)) return 'number';
  const ty = (FIELD_MAP[k] || {}).type || 'text';
  return (ty === 'percent' || ty === 'currency' || ty === 'number') ? 'number' : ty;
}
function sortCmp(a, b, k){
  const ty = sortKeyType(k);
  if(k === '@key')
    return String(a.k).localeCompare(String(b.k), isEN() ? 'en' : 'ar', {numeric:true, sensitivity:'base'});
  if(ty === 'number'){
    const x = valueOf(a.r, k), y = valueOf(b.r, k);
    const nx = !isFinite(x), ny = !isFinite(y);
    if(nx && ny) return 0;
    if(nx) return 1;                       // الفارغ في الآخر مهما كان الاتجاه
    if(ny) return -1;
    return x - y;
  }
  if(ty === 'date'){
    const x = Date.parse(a.r[k] || ''), y = Date.parse(b.r[k] || '');
    const nx = isNaN(x), ny = isNaN(y);
    if(nx && ny) return 0;
    if(nx) return 1;
    if(ny) return -1;
    return x - y;
  }
  const sx = String(a.r[k] == null ? '' : a.r[k]).trim();
  const sy = String(b.r[k] == null ? '' : b.r[k]).trim();
  if(!sx && !sy) return 0;
  if(!sx) return 1;
  if(!sy) return -1;
  return sx.localeCompare(sy, isEN() ? 'en' : 'ar', {numeric:true, sensitivity:'base'});
}
function valueOf(rec, k){
  if(isMetric(k)) return +METRICS[k].calc(rec).toFixed(3);
  const ty = (FIELD_MAP[k] || {}).type;
  return ty === 'percent' ? pct(rec[k]) : num(rec[k]);
}

function lbl(f){ const m = FIELD_MAP[f] || {}; return (isEN() ? (m.label_en || m.label) : m.label) || f; }

/* تنسيق موحّد لـ Data Labels (حجم/لون/خلفية) */
const DL_DEFAULT = {show:true, size:11, weight:700, color:'', bg:false, bgColor:'#1a2b4c'};
/* «إظهار الأرقام» وحده يبقى في خيارات القالب؛ كل التنسيق مصدره الوحيد
   هو «تنسيق أجزاء القالب» — لا مصدرَين متعارضين. */
function dlOf(w){
  const raw = Object.assign({}, DL_DEFAULT, w.opts.dl || {});
  const P = partOf(w, 'dataLabels');
  const bgOn = !!(P.bg && P.bg !== 'none');
  return {show: raw.show !== false, size: P.size, weight: P.weight || 700,
          color: P.color || '', bg: bgOn, bgColor: bgOn ? P.bg : '#1a2b4c',
          pos: P.pos || ''};
}
/* الوسم الأبيض داخل عمود ارتفاعه صفر يقع على خلفية الرسم البيضاء فيختفي.
   نحسب لوناً لكل نقطة: الأبيض داخل الأعمدة الكافية، ولون النص للصفرية والقصيرة. */
function nearWhite(c){
  const m = String(c || '').trim().match(/^#?([0-9a-f]{6})$/i);
  if(!m) return false;
  const v = parseInt(m[1], 16);
  const r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 215;     // فاتح جداً
}
function dlPointColors(w, data, insideColor){
  const nums = (data || []).map(v => {
    const n = (v && typeof v === 'object') ? v.y : v;
    return Math.abs(+n || 0);
  });
  const mx = Math.max.apply(null, nums.concat([0]));
  /* لون الوسم خارج العمود: لون المستخدم إن كان مقروءاً على الخلفية، وإلا لون
     نص الثيم. اللون الأبيض هو الافتراضي *داخل* العمود، ولا يُقرأ خارجه. */

       يتراكب — أفضل من إظهار الكل متشابكاً. الميل الذي يحدّده المستخدم فقط

          ${label}${delta}</div>`;
    }

  spi:{

              name:{fontSize:Math.max(9, Math.round(d.size * 0.58)) + 'px',

        }, {host:body.querySelector('.gauge-chart'), reserve:measureSpiBase(body)});
        return;

      const pv = partOf(w, 'cardValue');
      const vsz = (w.parts && w.parts.cardValue && w.parts.cardValue.size)

            pv.weight ? 'font-weight:' + pv.weight + ';' : ''}${pv.align ? 'text-align:' + pv.align + ';' : ''}">${shown}</div>
          <div class="spi-status" data-part="cardLabel" style="background:${color};${
            partCss(w,'cardLabel')}">${status}</div>${base}</div>`;

  },

      /* المكتبة تتجاهل قيمة الميل إن لم يُرفع rotateAlways — وكان محسوباً بشرط
         «أكثر من ٤ أعمدة»، فميل المستخدم لا يظهر مع الأعمدة القليلة. */
      const catKey = hz ? 'yaxis' : 'xaxis';
      const fit = fitCats(w, cats, hz, (hz ? pY : pX).size, (hz ? pY : pX).rotate,
                          !!(w.parts && w.parts[catKey] && w.parts[catKey].size));
      cats = fit.cats;
      const catAxis = {rotate:fit.rotate, rotateAlways:fit.rotateAlways, trim:fit.trim,
                       maxHeight:fit.maxHeight, maxWidth:fit.maxWidth,
                       hideOverlappingLabels:true,
                       style:Object.assign({}, (hz ? axY.style : axX.style), {fontSize:fit.size + 'px'}),
                       offsetX:(hz ? axY : axX).offsetX, offsetY:(hz ? axY : axX).offsetY};
      if(hz) catAxis.align = pY.align || 'right';
      if(hz) catAxis.align = pY.align || 'right';   // العرض محسوب في fitCats

  radar_eval:{
    name:'مقارنة تقييمات (رادار)', icon:'🕸️', w:380, h:330,
    opts:{numMode:'axis', showValues:false, scaleMode:'target',
          fields:['eval_labor','eval_equip','eval_financial','eval_hse'],
          targets:{},
          dl:Object.assign({}, DL_DEFAULT, {show:true, bg:true, bgColor:'#ffffff'})},
    title:'التقييم الفني للمشروع', title_en:'Technical evaluation',
    render(body, w){
      if(!S.latest) return empty(body);
      const o = w.opts;
      const keys = (o.fields || []).slice(0, 10);
      if(keys.length < 3){
        body.innerHTML = `<div class="empty-note">${tr('radarNeeds3')}</div>`; return;
      }
      const tgOf  = k => radarTarget(w, k);
      const raw   = keys.map(k => valueOf(S.latest, k));
      const names = keys.map(k => fieldOrMetricName(k));
      // «نسبة من الهدف» يوحّد مقاييس مختلفة على رسم واحد (إنجاز ٪ مع عدد مخالفات مثلاً)
      const useT  = (o.scaleMode || 'target') === 'target';
      const data  = keys.map((k, i) => {
        const t = tgOf(k);
        if(!useT) return +(+raw[i] || 0).toFixed(2);
        return t ? +Math.max(0, (+raw[i] || 0) / t * 100).toFixed(1) : 0;
      });
      const shown = i => fmtValue(raw[i], fieldOrMetricType(keys[i]) || 'number',
                                  {compact:true, decimals:1});
      const mode  = o.numMode || 'axis';

      let cats = names;                       // تُبنى بعد حساب المساحة المتاحة

      const strip = o.showValues
        ? `<div class="gauge-vals" data-part="strip" style="${partCss(w,'strip')}">` +
          names.map((n, i) => `<span><i style="background:${theme().palette[0]}"></i>${n}: <b>${
            shown(i)}</b>${useT && tgOf(keys[i]) !== 100 ? ` / ${tgOf(keys[i])}` : ''}</span>`).join('') +
          `</div>` : '';
      body.innerHTML = `<div class="gauge-wrap"><div class="gauge-chart"></div>${strip}</div>`;
      const inner   = w.h - (w.title.show ? 38 : 0) - 14;
      const reserve = measureStrip(body, Math.round(inner * 0.34));
      const avail = Math.min(w.w - 20, inner - reserve);
      /* المسميات تُرسم خارج الشكل. بدل ما تتمدّد وتغطّي الرسم: نحجز لها شريطاً
         محدوداً حول الدائرة، ونقصّ الاسم على قدر الشريط، والقيمة تنزل سطراً
         ثانياً فيقلّ العرض للنصف. النص الكامل يظهر عند المرور بالماوس. */
      const axSize  = partOf(w, 'xaxis').size || 10;
      const half    = Math.round(avail / 2);
      const band    = Math.max(30, Math.round(half * 0.45));
      const rsize   = Math.max(40, half - band);
      /* أقصى طول للمسمّى يُحسب من المساحة الفعلية وحجم الخط الحالي — لا برقم
         ثابت. حدّان: عرض الشريط المحجوز، وطول القوس المتاح لكل مسمّى حول
         الدائرة (يضيق كلما زاد عدد العناصر). فتصغير الخط يُظهر حروفاً أكثر. */
      const arcCh   = (2 * Math.PI * (rsize + band * 0.5)) / Math.max(1, keys.length);
      const maxCh   = Math.max(6, Math.floor(Math.min(band / (axSize * 0.42),
                                                      arcCh / (axSize * 0.55))));
      /* المكتبة تُوسّط المسمّى على رأسه، فالرؤوس القريبة من الأفقي (يمين/يسار)
         يزحف نصف نصّها داخل الشكل. نقصّها وحدها أكثر بدل تصغير الرسم كله. */
      const angOf   = i => ((-90 + i * 360 / keys.length) % 360 + 360) % 360;
      const sideAt  = i => { const a = angOf(i);
                             return Math.min(Math.abs(a), Math.abs(a - 180), Math.abs(a - 360)) < 34; };
      /* لا قصّ إلا لكلمة واحدة أطول من ضعف المساحة — الاسم يبقى كاملاً */
      const cut     = (t, n) => { const v = String(t);
                                  return v.length > n * 1.7 ? v.slice(0, Math.round(n * 1.7)) + '…' : v; };
      /* بدل قصّ الاسم على الجانبين، نلفّه سطرين قصيرين: يبقى الاسم كاملاً
         ويقلّ عرضه للنصف فيخرج من فوق الشكل. */
      const wrap    = (t, n) => wrapLabel(t, n, 3).map(x => cut(x, n));
      const nameAt  = i => sideAt(i) ? wrap(names[i], Math.max(7, Math.round(maxCh * 0.6)))
                                     : wrap(names[i], maxCh);
      cats = names.map((n, i) => {
        const lines = nameAt(i);
        const vCh = sideAt(i) ? Math.max(7, Math.round(maxCh * 0.6)) : maxCh;
        return (mode === 'axis') ? lines.concat([cut(shown(i), vCh)]) : lines;
      });

      mkChart(body, w, {
        chart:{type:'radar', fontFamily:wFont(w), background:'transparent', toolbar:{show:false}},
        series:[{name:useT ? tr('pctOfTarget') : tr('evaluation'), data}],
        labels:cats, colors:[theme().palette[0]],
        dataLabels:(mode === 'chart')
          ? dlOpts(w, theme().text, (v, ctx) => {

  scurve:{
    name:'المنحنى التراكمي', icon:'📉', w:560, h:320,
    opts:{showActual:true, showPlanned:true, showFinancial:true, finSource:'contractor',
          finMode:'percent', chartType:'area', smooth:true, forceMono:true, showCount:false,
          dl:Object.assign({}, DL_DEFAULT, {show:false})},
    title:'المنحنى التراكمي للإنجاز والصرف', title_en:'Cumulative progress & spend curve',
    render(body, w){
      if(!S.records || S.records.length < 2){
        body.innerHTML = `<div class="empty-note">${tr('noTimeline')}</div>`;
        return;
      }
      const rows = S.records;
      const cats = rows.map(r => r.current_data_date || '');
      const finPct = r => {
        const src = w.opts.finSource;
        const inv = (src === 'consultant') ? num(r.cons_inv_val)
                  : (src === 'both') ? num(r.cont_inv_val) + num(r.cons_inv_val)
                  : num(r.cont_inv_val);
        const con = (src === 'consultant') ? num(r.consultant_val)
                  : (src === 'both') ? num(r.contractor_val) + num(r.consultant_val)
                  : num(r.contractor_val);
        return con > 0 ? +(inv / con * 100).toFixed(2) : 0;
      };
      const finVal = r => {
        const src = w.opts.finSource;
        return (src === 'consultant') ? num(r.cons_inv_val)
             : (src === 'both') ? num(r.cont_inv_val) + num(r.cons_inv_val)
             : num(r.cont_inv_val);
      };
      const asValue = (w.opts.finMode === 'value');

      // القيم تراكمية بطبيعتها؛ هذا يمنع أي هبوط ناتج عن إدخال قيمة أقل في تحديث لاحق
      const mono = arr => {
        if(!w.opts.forceMono) return arr;
        let mx = -Infinity;
        return arr.map(v => { mx = Math.max(mx, num(v)); return +mx.toFixed(2); });
      };
      const barType = (w.opts.chartType === 'bar');

      const series = [], colors = [], types = [];
      if(w.opts.showActual){
        series.push({name:tr('cumActual'), type:barType ? 'column' : w.opts.chartType,
                     data:mono(rows.map(r => pct(r.act_prog_cur)))});
        colors.push(theme().palette[0]); types.push('pct');
      }
      if(w.opts.showPlanned){
        series.push({name:tr('cumPlanned'), type:'line', data:mono(rows.map(r => pct(r.plan_prog_cur)))});
        colors.push(theme().palette[1]); types.push('pct');
      }
      if(w.opts.showFinancial){
        series.push({name:asValue ? tr('cumFinanceVal') : tr('cumFinance'),
                     type:barType ? 'column' : 'line',
                     data:mono(rows.map(r => asValue ? finVal(r) : finPct(r)))});
        colors.push(theme().palette[3] || '#1e8e5a'); types.push(asValue ? 'val' : 'pct');
      }
      if(!series.length){ body.innerHTML = `<div class="empty-note">—</div>`; return; }

      const hasVal = types.indexOf('val') >= 0;
      const axFont = axisStyle(w, 'yaxis').style;
      const yaxes = series.map((sr, i) => (types[i] === 'val')
        ? {opposite:true, seriesName:sr.name, min:0,
           labels:{formatter:v => compactNum(num(v)), style:axFont}, title:{text:''}}
        : {seriesName:series.find((_, j) => types[j] === 'pct').name, min:0, max:100, tickAmount:5,
           show:i === types.indexOf('pct'),
           labels:{formatter:v => Math.round(v) + '%', style:axFont}});

      mkChart(body, w, {
        chart:{type:barType ? 'bar' : 'line', fontFamily:wFont(w), background:'transparent',
               toolbar:{show:false}, stacked:false},
        series, colors,
        plotOptions:barType ? {bar:{columnWidth:'55%', borderRadius:4}} : {},
        stroke:{curve:w.opts.smooth ? 'smooth' : 'straight',
                width:series.map(sr => sr.type === 'column' ? 0 : (sr.type === 'area' ? 2 : 3)),
                dashArray:series.map((sr, i) => (types[i] === 'pct' && sr.type === 'line' && i === 1) ? 5 : 0)},
        fill:{colors:colors, type:'solid',
              opacity:series.map(sr => sr.type === 'area' ? 0.20 : (sr.type === 'column' ? 0.92 : 1))},
        markers:{size:barType ? 0 : 3},
        dataLabels:dlOpts(w, theme().text, (v, o) => {
          const i = o && o.seriesIndex;
          return (types[i] === 'val') ? compactNum(num(v)) : num(v).toFixed(1) + '%';
        }),
        xaxis:{categories:cats, labels:Object.assign(axisStyle(w,'xaxis'), {rotate:partOf(w,'xaxis').rotate})},
        yaxis:hasVal ? yaxes : {min:0, max:100, tickAmount:5,
               labels:Object.assign(axisStyle(w,'yaxis'),
                     {formatter:v => Math.round(v) + '%', align:partOf(w,'yaxis').align || undefined})},
        grid:{borderColor:'rgba(125,125,125,.18)'},
        legend:legendStyle(w, {position:'top', horizontalAlign:'center'}),
        // ApexCharts يرفض shared مع intersect في الأعمدة
        tooltip:{shared:!barType, intersect:barType, y:{formatter:(v, o) => {
          const i = o && o.seriesIndex;
          return (types[i] === 'val') ? compactNum(num(v)) + ' ' + tr('currency') : num(v).toFixed(1) + '%';
        }}}
      });
    }
  },
  topn:{
    name:'ترتيب Top N', icon:'🏆', w:480, h:330,
    opts:{source:'projects', field:'@prog_delta', fields:['drawings_sub','ir_sub','ncr_open'],

    render(body, w){
      const src = w.opts.source || 'projects';
      let items = [], ftype = 'number';

      if(src === 'projects'){
        if(S.mode !== 'all' || !S.projLatest.length){
          body.innerHTML = `<div class="empty-note">${tr('allOnly')}</div>`; return;
        }
        ftype = fieldOrMetricType(w.opts.field);
        items = S.projLatest.map(r => ({n:r.project_name || '—', v:valueOf(r, w.opts.field)}));
      }else if(src === 'timeline'){
        if(!S.records || !S.records.length){ empty(body); return; }
        ftype = fieldOrMetricType(w.opts.field);
        items = S.records.map(r => ({n:r.current_data_date || '—', v:valueOf(r, w.opts.field)}));
      }else{
        if(!S.latest){ empty(body); return; }
        const fs = (w.opts.fields && w.opts.fields.length) ? w.opts.fields : [];
        if(fs.length < 2){
          body.innerHTML = `<div class="empty-note">${tr('pickFields')}</div>`;
          return;
        }
        const types = fs.map(f => fieldOrMetricType(f));
        const uniq = Array.from(new Set(types));
        ftype = uniq.length === 1 ? uniq[0] : 'mixed';
        items = fs.map((f, i) => ({n:fieldOrMetricName(f), v:valueOf(S.latest, f), t:types[i]}));
      }

      items.sort((a, b) => w.opts.order === 'asc' ? a.v - b.v : b.v - a.v);
      const n = parseInt(w.opts.limit) || 0;
      if(n > 0) items = items.slice(0, n);
      if(!items.length){ body.innerHTML = `<div class="empty-note">—</div>`; return; }

      const fmtOne = (it) => fmtValue(it.v, it.t || ftype, {compact:true, pointsAs:w.opts.pointsAs,
                              decimals:(it.t || ftype) === 'percent' ? 1 : undefined});
      const maxAbs = Math.max(...items.map(i => Math.abs(i.v)), 0.0001);

      if(w.opts.display === 'bars'){
        const hz = !!w.opts.horizontal;
        const axX2 = axisStyle(w, 'xaxis'), axY2 = axisStyle(w, 'yaxis');
        const pX2 = partOf(w, 'xaxis'), pY2 = partOf(w, 'yaxis');
        const axFont = axX2.style;
        const numFmt = v => (ftype === 'percent' ? Math.round(v) + '%'
                          : ftype === 'currency' ? compactNum(num(v))
                          : ftype === 'ratio' ? num(v).toFixed(2)
                          : Math.round(num(v)).toLocaleString('en-US'));
        const catKey2 = hz ? 'yaxis' : 'xaxis';
        const fit2 = fitCats(w, items.map(i => i.n), hz, (hz ? pY2 : pX2).size,
                             (hz ? pY2 : pX2).rotate,
                             !!(w.parts && w.parts[catKey2] && w.parts[catKey2].size));
        const catAxis = {trim:fit2.trim, maxHeight:fit2.maxHeight, maxWidth:fit2.maxWidth,
                         hideOverlappingLabels:true,
                         style:Object.assign({}, (hz ? axY2.style : axX2.style), {fontSize:fit2.size + 'px'}),
                         rotate:fit2.rotate, rotateAlways:fit2.rotateAlways};
        if(hz) catAxis.align = pY2.align || 'right';  // العرض محسوب في fitCats
        const numAxis = {formatter:numFmt, style:(hz ? axX2.style : axY2.style),
                         align:(hz ? pX2.align : pY2.align) || undefined};
        let hostEl = null;
        if(hz){ body.innerHTML = '<div style="width:100%;height:100%;direction:ltr"></div>'; hostEl = body.firstChild; }
        S.lastItems[w.id] = items.map(i => i.n);
        mkChart(body, w, {
          chart:{type:'bar', fontFamily:wFont(w), background:'transparent', toolbar:{show:false}},
          series:[{name:tr('ranking'), data:items.map(i => i.v)}],
          colors:items.map((i, idx) => ((w.opts.itemColors || {})[idx]) ||
            (idx === 0 && w.opts.highlightTop ? (theme().palette[1] || '#d4a373')
                                              : (i.v < 0 ? '#d9463f' : theme().palette[0]))),
          plotOptions:{bar:{horizontal:hz, distributed:true, borderRadius:5, columnWidth:'58%', barHeight:'62%',
                            dataLabels:{position:partOf(w,'dataLabels').pos || 'center'}}},
          dataLabels:dlOpts(w, '#ffffff', (v, o) => {
            const i = o && o.dataPointIndex;
            return (i !== undefined && items[i]) ? fmtOne(items[i]) : v;
          }, items.map(i => i.v)),
          xaxis:{categories:fit2.cats, labels:hz ? numAxis : catAxis},
          yaxis:{labels:hz ? catAxis : numAxis},
          grid:{borderColor:'rgba(125,125,125,.18)'},
          legend:{show:false},
          tooltip:{y:{formatter:v => numFmt(v)}}
        }, {host:hostEl});
        return;
      }

      // جدول ترتيب
      S.lastItems[w.id] = items.map(i => i.n);
      const rows = items.map((it, i) => {
        const pos = (w.opts.order === 'asc') ? i + 1 : i + 1;
        const medal = (w.opts.showRank && w.opts.highlightTop && i === 0) ? 'rk-first' : '';
        const barW = Math.round(Math.abs(it.v) / maxAbs * 100);
        const barC = ((w.opts.itemColors || {})[i]) || (it.v < 0 ? '#d9463f'
                      : (i === 0 && w.opts.highlightTop ? (theme().palette[1] || '#d4a373')
                                                        : theme().palette[0]));
        const hC = partCss(w, 'tableHead'), cC = partCss(w, 'tableCell');
        return `<tr class="${medal}">
          ${w.opts.showRank ? `<td class="rk-num" data-part="tableHead" style="${hC}"><span>${pos}</span></td>` : ''}
          <td class="rk-name" data-part="tableHead" style="${hC}">${String(it.n).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}
            ${w.opts.showBar ? `<div class="rk-bar"><i style="width:${barW}%;background:${barC}"></i></div>` : ''}
          </td>
          <td class="rk-val" data-part="tableCell" style="${cC}">${fmtOne(it)}</td></tr>`;
      }).join('');
      body.innerHTML = `<div class="rk-wrap"><table class="tbl rk-tbl">${rows}</table></div>`;
    }
  },

  obstacles:{

        body.innerHTML = `<div class="empty-note">—</div>`; return;
      }
      S.lastItems[w.id] = labels.slice();

      const t0 = types[0] || 'number';

        if(o.showAs === 'label')  return labels[i];

      }
      const heatBg = v => {
        if(!o.heatOn || !o.heatField || hMax === hMin) return '';
        const t = Math.max(0, Math.min(1, (v - hMin) / (hMax - hMin)));
        return `background:rgba(30,142,90,${(0.06 + t * 0.32).toFixed(3)});`;
      };

      // خلفية الرأس الثابت: خلفية القالب ما لم يحدّد المستخدم لوناً للرؤوس

function impactClass(imp){
  if(/كبير|عالي|high/i.test(imp))   return 'imp-high';
  if(/متوسط|medium/i.test(imp))     return 'imp-mid';
  if(/منخفض|low/i.test(imp))        return 'imp-low';
  return 'imp-none';
}

/* الارتفاع الفعلي لشريط القيم أسفل الرسم حتى لا يُقص */
function measureSpiBase(body){
  const el = body.querySelector('.spi-base');
  return el ? el.offsetHeight + 6 : 0;
}
/* الشريط لا يأكل الرسم: له سقف يتمرر بعده، ومسافة تفصله عن حافة القالب */
function measureStrip(body, cap){
  const el = body.querySelector('.gauge-vals');
  if(!el) return 0;
  if(cap){ el.style.maxHeight = Math.max(24, Math.round(cap)) + 'px'; }
  return Math.min(el.offsetHeight, cap || el.offsetHeight) + 6;
}
function mkChart(body, w, opt, extra){
  extra = extra || {};
  if(typeof ApexCharts === 'undefined'){
    body.innerHTML = `<div class="empty-note">${tr('chartLibError')}</div>`;
    return;
  }
  let host = extra.host;
  if(!host){
    body.innerHTML = '<div style="width:100%;height:100%"></div>';
    host = body.firstChild;
  }
  const h = Math.max(60, w.h - (w.title.show ? 38 : 0) - 14 - (extra.reserve || 0));
  opt.chart = Object.assign({height:h, width:'100%'}, opt.chart);
  if(S.charts[w.id]){ try{ S.charts[w.id].destroy(); }catch(e){} }
  const c = new ApexCharts(host, opt);
  const done = c.render(); S.charts[w.id] = c;
  if(done && done.then) done.then(() => refreshParts(w)).catch(() => {});
  setTimeout(() => refreshParts(w), 400);     // احتياط لو تأخّر الرسم
}

function removeSelected(){

  });

  S.multi = []; S.selected = null;

}
function duplicateSelected(){
  const ws = selWidgets(); if(!ws.length) return;
  snapshot();
  const ids = [];
  ws.forEach(src => {
    const c = clone(src); c.id = uid(); c.x = snap(src.x + 20); c.y = snap(src.y + 20);
    S.widgets.push(c); drawWidget(c); ids.push(c.id);
  });
