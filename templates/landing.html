<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البوابة الرئيسية | المعماريون السعوديون</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body {
            background:
                radial-gradient(circle at 15% 20%, rgba(212,163,115,0.14), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(212,163,115,0.10), transparent 40%),
                linear-gradient(135deg, var(--navy-900) 0%, var(--navy-700) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .landing-container { text-align: center; color: white; max-width: 900px; padding: 20px; }
        .brand-badge {
            display: inline-block; width: 75px; height: 75px; border-radius: 18px;
            background: #fff; padding: 5px; object-fit: contain;
            margin-bottom: 1.25rem; box-shadow: var(--shadow-md);
        }
        .logo-text { font-size: 2.6rem; font-weight: 800; color: #fff; margin-bottom: 6px; }
        .subtitle { font-size: 1.1rem; color: var(--gold-100); margin-bottom: 3rem; opacity: 0.9; }
        .landing-footer { color: rgba(255,255,255,0.45); font-size: 0.8rem; margin-top: 3rem; }
    </style>
</head>
<body>

    <div class="landing-container">
        <img src="/static/img/logo.png" alt="المعماريون السعوديون" class="brand-badge">
        <div class="logo-text">المعماريون السعوديون</div>
        <div class="subtitle">النظام المركزي لإدارة ومتابعة المشاريع (PMIS)</div>

        <div class="row justify-content-center g-4">
            <div class="col-md-5">
                <a href="/login" class="card-btn">
                    <div class="icon">📊</div>
                    <div class="card-title">بوابة التحديث الأسبوعي</div>
                    <div class="card-text">دخول مديري المشاريع والمهندسين لإرسال التحديثات الأسبوعية ونسب الإنجاز.</div>
                </a>
            </div>

            <div class="col-md-5">
                <a href="/admin" class="card-btn">
                    <div class="icon">🔐</div>
                    <div class="card-title">لوحة تحكم الإدارة</div>
                    <div class="card-text">دخول خاص لإدارة التخطيط لمراجعة وتعديل قواعد البيانات المركزية.</div>
                </a>
            </div>
        </div>

        <div class="landing-footer">المعماريون السعوديون — نظام إدارة المشاريع</div>
    </div>

</body>
</html>
