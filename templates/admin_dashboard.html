<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | سجل التحديثات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <!-- استدعاء مكتبة SheetJS لتصدير الإكسيل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .table-container { max-height: 70vh; }

        #updatesTable { margin-bottom: 0; }

        /* تثبيت رأس الجدول أثناء التمرير باحترافية */
        #updatesTable thead th {
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: inset 0 -2px 0 var(--navy-600);
            padding-top: 15px;
            padding-bottom: 15px;
        }

        td { cursor: pointer; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
        td:hover { background-color: var(--bg-muted); }
        .filter-section { background: white; border-radius: var(--radius-md); padding: 1.1rem; box-shadow: var(--shadow-sm); margin-bottom: 1.25rem; }
    </style>
</head>
<body>
    {% include "_admin_nav.html" %}

    <div class="container-fluid px-4 mb-5">
        <h3 class="mb-3">سجل تحديثات المشاريع</h3>

        <!-- قسم الفلاتر ومؤشرات الأداء -->
        <div class="filter-section">
            <div class="row g-3 align-items-stretch">
                <!-- الفلاتر -->
                <div class="col-md-8">
                    <div class="row g-2">
                        <div class="col-md-3">
                            <label class="form-label text-muted small mb-1">اسم المشروع</label>
                            <select id="filter-project" class="form-select" onchange="applyFilters()">
                                <option value="">الكل</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted small mb-1">مدير المشروع</label>
                            <select id="filter-pm" class="form-select" onchange="applyFilters()">
                                <option value="">الكل</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted small mb-1">نوع المشروع</label>
                            <select id="filter-type" class="form-select" onchange="applyFilters()">
                                <option value="">الكل</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted small mb-1">تاريخ البيانات</label>
                            <select id="filter-date" class="form-select" onchange="applyFilters()">
                                <option value="">الكل</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- مربعات عدد التحديثات وزر التصدير -->
                <div class="col-md-4 d-flex flex-column gap-2">
                    <div class="d-flex gap-2 flex-grow-1">
                        <div class="kpi-tile kpi-green flex-grow-1">
                            <span class="kpi-label" title="عدد المشاريع التي تم تحديثها في أحدث تاريخ بيانات مسجل">تحديثات أحدث دورة</span>
                            <span class="kpi-value" id="latest-count">0</span>
                        </div>
                        <div class="kpi-tile kpi-info flex-grow-1">
                            <span class="kpi-label" title="عدد التحديثات المعروضة حالياً بناءً على الفلاتر">المعروض حالياً</span>
                            <span class="kpi-value" id="update-count">0</span>
                        </div>
                    </div>
                    <button class="btn btn-gold fw-bold shadow-sm w-100" onclick="exportToExcel()">
                        📥 تصدير Excel
                    </button>
                </div>
            </div>
        </div>

        <!-- الجدول -->
        <div class="table-container">
            <table class="table table-bordered table-hover align-middle" id="updatesTable">
                <thead class="table-dark" id="tableHeader">
                    <tr>
                        {% for col in translated_columns %}
                        <th>{{ col }}</th>
                        {% endfor %}
                    </tr>
                </thead>
                <tbody id="tableBody">
                    {% for row in rows %}
                    <tr class="data-row">
                        {% for i in range(original_columns|length) %}
                        <td onclick="editCell({{ row[0] }}, '{{ original_columns[i] }}', this)" title="اضغط للتعديل">
                            {{ row[i] if row[i] != None else '' }}
                        </td>
                        {% endfor %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let colIndex = { project: -1, pm: -1, type: -1, date: -1 };

        function initFilters() {
            const headers = Array.from(document.querySelectorAll("#tableHeader th")).map(th => th.innerText.trim());
            
            colIndex.project = headers.indexOf('اسم المشروع');
            colIndex.pm = headers.indexOf('مدير المشروع');
            colIndex.type = headers.indexOf('نوع المشروع');
            colIndex.date = headers.indexOf('تاريخ البيانات');

            const rows = document.querySelectorAll("#tableBody .data-row");
            let projects = new Set(), pms = new Set(), types = new Set(), dates = new Set();

            rows.forEach(row => {
                const cells = row.querySelectorAll("td");
                if(colIndex.project > -1) projects.add(cells[colIndex.project].innerText.trim());
                if(colIndex.pm > -1) pms.add(cells[colIndex.pm].innerText.trim());
                if(colIndex.type > -1) types.add(cells[colIndex.type].innerText.trim());
                if(colIndex.date > -1) dates.add(cells[colIndex.date].innerText.trim());
            });

            populateSelect("filter-project", projects);
            populateSelect("filter-pm", pms);
            populateSelect("filter-type", types);
            populateSelect("filter-date", dates);

            applyFilters();
        }

        function populateSelect(elementId, dataSet) {
            const select = document.getElementById(elementId);
            select.innerHTML = '<option value="">الكل</option>';
            const sortedArray = Array.from(dataSet).filter(val => val !== "").sort();
            sortedArray.forEach(val => {
                const option = document.createElement("option");
                option.value = val;
                option.text = val;
                select.appendChild(option);
            });
        }

        function applyFilters() {
            const filterProject = document.getElementById("filter-project").value.toLowerCase();
            const filterPm = document.getElementById("filter-pm").value.toLowerCase();
            const filterType = document.getElementById("filter-type").value.toLowerCase();
            const filterDate = document.getElementById("filter-date").value.toLowerCase();
            
            let visibleCount = 0;
            let latestDateCount = 0;
            const rows = document.querySelectorAll("#tableBody .data-row");

            // العثور على أحدث تاريخ مسجل في الجدول
            let allDates = [];
            if(colIndex.date > -1) {
                rows.forEach(row => {
                    let d = row.querySelectorAll("td")[colIndex.date].innerText.trim();
                    if(d) allDates.push(d);
                });
            }
            allDates.sort().reverse();
            let latestDate = allDates.length > 0 ? allDates[0] : "";

            rows.forEach(row => {
                const cells = row.querySelectorAll("td");
                
                const valProject = colIndex.project > -1 ? cells[colIndex.project].innerText.trim().toLowerCase() : "";
                const valPm = colIndex.pm > -1 ? cells[colIndex.pm].innerText.trim().toLowerCase() : "";
                const valType = colIndex.type > -1 ? cells[colIndex.type].innerText.trim().toLowerCase() : "";
                const valDate = colIndex.date > -1 ? cells[colIndex.date].innerText.trim().toLowerCase() : "";

                // حساب عدد المشاريع التي تم تحديثها في أحدث دورة زمنية مستقلة عن الفلاتر
                if (colIndex.date > -1 && cells[colIndex.date].innerText.trim() === latestDate) {
                    latestDateCount++;
                }

                const matchProject = (filterProject === "" || valProject === filterProject);
                const matchPm = (filterPm === "" || valPm === filterPm);
                const matchType = (filterType === "" || valType === filterType);
                const matchDate = (filterDate === "" || valDate === filterDate);

                if (matchProject && matchPm && matchType && matchDate) {
                    row.style.display = ""; 
                    visibleCount++;
                } else {
                    row.style.display = "none"; 
                }
            });

            document.getElementById("update-count").innerText = visibleCount;
            document.getElementById("latest-count").innerText = latestDateCount;
        }

        document.addEventListener("DOMContentLoaded", initFilters);

        function editCell(rowId, column, cellElement) {
            if (column === 'id') return;
            
            // 1. تحديد الأعمدة التي تقبل أرقاماً فقط
            const numberColumns = [
                'consultant_val', 'contractor_val', 
                'consultant_mods_count', 'consultant_mods_val', 'consultant_mods_time', 
                'contractor_mods_count', 'contractor_mods_val', 'contractor_mods_time',
                'cons_inv_count', 'cons_inv_val', 'cont_inv_count', 'cont_inv_val',
                'act_prog_cur', 'act_prog_prev', 'plan_prog_cur', 'plan_prog_prev',
                'eval_labor', 'eval_equip', 'eval_financial', 'eval_hse',
                'drawings_sub', 'drawings_app', 'drawings_rev',
                'ir_sub', 'ir_app', 'ir_rev', 'ncr_open', 'ncr_closed'
            ];

            // 2. تحديد الأعمدة التي تقبل تواريخ فقط
            const dateColumns = [
                'current_data_date', 'consultant_mods_end_date', 'contractor_mods_end_date',
                'cons_inv_date', 'cont_inv_date', 'start_contractual', 'end_contractual',
                'start_actual', 'end_expected', 'submission_date'
            ];

            let currentValue = cellElement.innerText.trim();
            let newValue = prompt(`تعديل القيمة:`, currentValue);
            
            if (newValue !== null && newValue !== currentValue) {
                
                // --- نظام الحماية (Validation) ---
                if (newValue.trim() !== "") {
                    // حماية الأرقام
                    if (numberColumns.includes(column)) {
                        if (isNaN(Number(newValue))) {
                            alert("⛔ خطأ: هذا الحقل مخصص للأرقام فقط. لا يمكنك إدخال نصوص مثل '" + newValue + "'.");
                            return; // إيقاف العملية
                        }
                    }
                    // حماية التواريخ
                    if (dateColumns.includes(column)) {
                        let dateRegex = /^\d{4}-\d{2}-\d{2}$/;
                        if (!dateRegex.test(newValue)) {
                            alert("⛔ خطأ: يرجى إدخال التاريخ بالصيغة الصحيحة (YYYY-MM-DD).");
                            return; // إيقاف العملية
                        }
                    }
                }
                // --------------------------------

                fetch('/api/update-cell', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: rowId, column: column, value: newValue })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        cellElement.innerText = newValue;
                        cellElement.style.backgroundColor = '#d4edda';
                        setTimeout(() => cellElement.style.backgroundColor = '', 2000);
                        initFilters(); 
                    } else {
                        alert("حدث خطأ أثناء الحفظ: " + data.error);
                    }
                })
                .catch(err => alert("حدث خطأ في الاتصال بالسيرفر."));
            }
        }

        // --- الدالة الجديدة لتصدير الإكسيل بذكاء ---
        function exportToExcel() {
            let table = document.getElementById("updatesTable");
            let rows = table.querySelectorAll("tr");
            let exportData = [];

            // المرور على جميع الصفوف (بما فيها رأس الجدول)
            rows.forEach(row => {
                // نأخذ الصف فقط إذا لم يكن مخفياً (حتى نحترم الفلاتر التي اخترتها)
                if (row.style.display !== "none") {
                    let rowData = [];
                    let cells = row.querySelectorAll("th, td");
                    cells.forEach(cell => {
                        rowData.push(cell.innerText.trim());
                    });
                    exportData.push(rowData);
                }
            });

            // إنشاء ملف الإكسيل باستخدام مكتبة SheetJS
            let worksheet = XLSX.utils.aoa_to_sheet(exportData);
            
            // تحديد اتجاه الشيت ليكون من اليمين لليسار (RTL) ليتناسب مع اللغة العربية
            if(!worksheet['!views']) worksheet['!views'] = [];
            worksheet['!views'].push({ rightToLeft: true });

            let workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "سجل التحديثات");
            
            // تجهيز اسم الملف مضافاً إليه تاريخ اليوم
            let today = new Date().toISOString().split('T')[0];
            XLSX.writeFile(workbook, `سجل_المشاريع_${today}.xlsx`);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
