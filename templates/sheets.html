<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheets | Saudi Architects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EBEF; --panel:#fff; --tint:#F1F3F7; --tint2:#E6EAF0; --line:#E3E6EC;
  --ink:#172033; --muted:#5B6577; --navy:#1F3A5F; --navy2:#274A78; --gold:#C8A165;
  --danger:#C8543E; --ok:#1C6A43; --head-h:58px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif; background:var(--bg); color:var(--ink);
     overflow:hidden; -webkit-font-smoothing:antialiased;}
html[lang="ar"] body{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;}
button,input,select,textarea{font-family:inherit; border-radius:0;}

/* ===== الهيدر ===== */
.hdr{height:var(--head-h); background:#fff; box-shadow:0 1px 3px rgba(23,32,51,.07); display:flex;
     align-items:center; gap:6px; padding:0 16px; position:relative; z-index:30;}
.hdr-back{width:36px; height:36px; display:flex; align-items:center; justify-content:center;
          background:var(--tint); color:var(--ink); text-decoration:none; flex:0 0 auto; transition:background-color .15s ease;}
.hdr-back:hover{background:var(--tint2);}
[dir="rtl"] .hdr-back svg{transform:scaleX(-1);}
.hdr-title{display:flex; flex-direction:column; line-height:1.2; padding:0 12px; min-width:0;}
.hdr-title small{font-size:11px; color:var(--muted); font-weight:500;}
.hdr-title b{font-size:14px; font-weight:600;}
.spacer{flex:1;}
.btn{height:36px; border:none; background:var(--tint); padding:0 13px; font-size:13px; font-weight:500;
     color:var(--ink); cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:7px;
     transition:background-color .15s ease, transform .15s ease;}
.btn:hover{background:var(--tint2);}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--navy); color:#fff; font-weight:600;}
.btn.primary:hover{background:var(--navy2);}
.btn.primary[disabled]{opacity:.45; pointer-events:none;}
.btn.danger{color:var(--danger);}
.btn.danger:hover{background:#FBEDEA;}
.fld{height:36px; background:var(--tint); border:none; padding:0 10px; font-size:13px; color:var(--ink); max-width:280px;}
.fld:focus{outline:2px solid #C9D6E8;}

/* ===== شريط الأدوات ===== */
.bar{height:46px; background:#fff; box-shadow:0 1px 2px rgba(23,32,51,.05); display:flex; align-items:center;
     gap:8px; padding:0 16px; position:relative; z-index:20;}
.bar .sep{width:1px; height:22px; background:var(--line);}
.count{font-size:12.5px; color:var(--muted); white-space:nowrap;}
.search{height:32px; background:var(--tint); border:none; padding:0 10px; font-size:13px; width:230px;}

/* ===== الشبكة ===== */
.wrap{height:calc(100% - var(--head-h) - 46px); overflow:auto; background:var(--bg); padding:14px 16px 40px;}
table.grid{border-collapse:separate; border-spacing:0; background:#fff; box-shadow:0 1px 2px rgba(23,32,51,.05), 0 8px 20px rgba(23,32,51,.06);}
.grid th, .grid td{border-bottom:1px solid var(--line); border-inline-end:1px solid var(--line); padding:0; height:34px;}
.grid th{position:sticky; top:0; z-index:5; background:#F7F8FA; font-size:12px; font-weight:600; color:var(--ink);
         text-align:start; padding:0 10px; white-space:nowrap; cursor:pointer; user-select:none;}
.grid th:hover{background:var(--tint);}
.grid th .sortmark{color:var(--muted); font-size:10px; margin-inline-start:5px;}
.grid th.col-calc{color:var(--muted);}
.grid td{font-size:13px; background:#fff;}
.grid tr:hover td{background:#FAFBFC;}
.grid td.cell-calc{background:#F7F8FA; color:var(--ink); padding:0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.grid tr:hover td.cell-calc{background:#F4F6F8;}
.grid td.rownum{width:46px; text-align:center; color:var(--muted); font-size:11.5px; background:#F7F8FA; position:relative;}
.grid th.rownum{width:46px; text-align:center; cursor:default;}
.grid td.rownum input{margin:0;}
.grid td input[type=text], .grid td input[type=number], .grid td input[type=date], .grid td select{
  width:100%; height:33px; border:none; background:transparent; padding:0 10px; font-size:13px; color:inherit;
  font-family:inherit;}
.grid td input:focus, .grid td select:focus{outline:2px solid var(--navy); outline-offset:-2px; background:#F4F8FF;}
.grid td.num input{text-align:end; font-variant-numeric:tabular-nums;}
.grid td.cell-calc.num{text-align:end; font-variant-numeric:tabular-nums;}
.grid td.chk{text-align:center;}
.grid tr.sel td{background:#EAF0F8;}
.grid tr.dirty td.rownum{box-shadow:inset 3px 0 0 var(--gold);}
.filters td{background:#FCFCFD; height:30px;}
.filters input{width:100%; height:29px; border:none; background:transparent; padding:0 10px; font-size:12px;}
.filters input::placeholder{color:#A9B0BC;}
.empty{padding:40px 10px; text-align:center; color:var(--muted); font-size:13.5px;}

/* ===== النوافذ ===== */
.modal-back{position:fixed; inset:0; background:rgba(23,32,51,.40); display:flex; align-items:center; justify-content:center;
  z-index:80; opacity:0; visibility:hidden; transition:opacity .2s ease, visibility 0s linear .2s;}
.modal-back.open{opacity:1; visibility:visible; transition:opacity .2s ease, visibility 0s;}
.modal{background:#fff; width:min(860px,95vw); max-height:86vh; display:flex; flex-direction:column;
  box-shadow:0 24px 60px rgba(23,32,51,.28); transform:translateY(8px) scale(.98); transition:transform .25s var(--ease);}
.modal-back.open .modal{transform:none;}
.modal h3{margin:0; padding:16px 20px 6px; font-size:16px; font-weight:700;}
.modal-body{padding:8px 20px 16px; overflow:auto;}
.modal-foot{padding:12px 20px; background:#F7F8FA; display:flex; justify-content:flex-end; gap:8px;}
.col-row{display:grid; grid-template-columns:26px 1fr 1fr 130px 1fr 76px 64px; gap:8px; align-items:center;
         padding:8px 0; border-bottom:1px solid #F0F2F5;}
.col-row input, .col-row select{height:32px; background:var(--tint); border:none; padding:0 8px; font-size:12.5px; width:100%;}
.col-row .mv{display:flex; flex-direction:column; gap:2px;}
.col-row .mv button{width:22px; height:15px; border:none; background:var(--tint); font-size:9px; cursor:pointer; color:var(--muted);}
.col-row .mv button:hover{background:var(--navy); color:#fff;}
.col-head{display:grid; grid-template-columns:26px 1fr 1fr 130px 1fr 76px 64px; gap:8px; font-size:10.5px;
          font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; padding-bottom:6px;}
.sheet-item{display:flex; align-items:center; gap:10px; padding:10px 12px; background:#F7F8FA; margin-bottom:6px;}
.sheet-item .nm{flex:1; min-width:0;}
.sheet-item .nm b{font-size:13.5px; font-weight:600; display:block;}
.sheet-item .nm span{font-size:12px; color:var(--muted);}
.toast{position:fixed; bottom:22px; inset-inline-end:22px; background:var(--ink); color:#fff; padding:12px 18px;
  font-size:13px; box-shadow:0 18px 40px rgba(23,32,51,.22); z-index:99; opacity:0; transform:translateY(12px);
  transition:opacity .25s ease, transform .3s var(--ease); pointer-events:none;}
.toast.show{opacity:1; transform:none;}
.toast.err{background:var(--danger);}
.load-bar{position:fixed; top:var(--head-h); left:0; right:0; height:3px; z-index:70; overflow:hidden; pointer-events:none;
  opacity:0; transition:opacity .25s ease;}
.load-bar.on{opacity:1;}
.load-bar i{position:absolute; top:0; bottom:0; width:35%; background:var(--gold); animation:ls 1.1s var(--ease) infinite;}
.load-bar::before{content:''; position:absolute; inset:0; background:rgba(200,161,101,.22);}
@keyframes ls{from{left:-35%}to{left:100%}}
@media (prefers-reduced-motion: reduce){ .load-bar i{animation-duration:2.4s;} }
</style>
</head>
<body>

<header class="hdr">
  <a class="hdr-back" href="/admin-hub" data-i18n-title="back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
  <div class="hdr-title"><small data-i18n="sheets">Sheets</small><b id="sheetName">—</b></div>
  <select class="fld" id="sheetSel" style="margin-inline-start:10px;" data-no-tr></select>
  <button class="btn" id="btnNew" data-i18n="newSheet">New sheet</button>
  <button class="btn" id="btnManage" data-i18n="manage">Manage…</button>
  <button class="btn" id="btnCols" data-i18n="columns">Columns…</button>
  <div class="spacer"></div>
  <span class="count" id="savedAt"></span>
  <button class="btn" id="btnLang">العربية</button>
  <button class="btn primary" id="btnSave" disabled data-i18n="save">Save</button>
</header>

<div class="load-bar" id="loadBar"><i></i></div>

<div class="bar">
  <button class="btn" id="btnAddRow" data-i18n="addRow">+ Row</button>
  <button class="btn danger" id="btnDelRows" data-i18n="delRows">Delete selected</button>
  <div class="sep"></div>
  <input class="search" id="search" data-i18n-ph="search" placeholder="Search…">
  <button class="btn" id="btnFilters" data-i18n="filters">Filters</button>
  <div class="spacer"></div>
  <span class="count" id="rowCount"></span>
  <button class="btn" id="btnPrev">‹</button>
  <span class="count" id="pageLbl"></span>
  <button class="btn" id="btnNext">›</button>
</div>

<div class="wrap" id="wrap"><div class="empty" id="empty" data-i18n="noSheet">No sheet yet — create one to start.</div></div>

<!-- نافذة الأعمدة -->
<div class="modal-back" id="colsModal">
  <div class="modal">
    <h3 data-i18n="columnsT">Columns</h3>
    <div class="modal-body">
      <div class="col-head">
        <span></span><span data-i18n="cLabelAr">Name (AR)</span><span data-i18n="cLabelEn">Name (EN)</span>
        <span data-i18n="cType">Type</span><span data-i18n="cExtra">Source / options / formula</span>
        <span data-i18n="cWidth">Width</span><span></span>
      </div>
      <div id="colList"></div>
      <div style="margin-top:12px;"><button class="btn" id="btnAddCol" data-i18n="addCol">+ Column</button></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close data-i18n="cancel">Cancel</button>
      <button class="btn primary" id="btnColsSave" data-i18n="apply">Apply</button>
    </div>
  </div>
</div>

<!-- نافذة إدارة الجداول -->
<div class="modal-back" id="mgrModal">
  <div class="modal" style="width:min(620px,95vw);">
    <h3 data-i18n="manageT">Sheets</h3>
    <div class="modal-body" id="mgrBody"></div>
    <div class="modal-foot"><button class="btn" data-close data-i18n="close">Close</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PROJECTS = {{ projects | tojson }};
const FIELDS   = {{ field_meta | tojson }};

/* ================= لغة الواجهة (إنجليزي افتراضي) ================= */
const UI_KEY = 'pmis_ui_lang';
let UIL = (() => { try{ return localStorage.getItem(UI_KEY) === 'ar' ? 'ar' : 'en'; }catch(e){ return 'en'; } })();
const en = () => UIL !== 'ar';
const U  = (e, a) => en() ? e : a;
const I18N = {
  sheets:['Sheets','الجداول'], back:['Back','رجوع'], newSheet:['New sheet','جدول جديد'],
  manage:['Manage…','إدارة…'], manageT:['Sheets','الجداول'], columns:['Columns…','الأعمدة…'],
  columnsT:['Columns','الأعمدة'], save:['Save','حفظ'], addRow:['+ Row','+ صف'],
  delRows:['Delete selected','حذف المحدد'], search:['Search…','بحث…'], filters:['Filters','فلاتر'],
  noSheet:['No sheet yet — create one to start.','لا توجد جداول — أنشئ جدول للبدء.'],
  cLabelAr:['Name (AR)','الاسم (عربي)'], cLabelEn:['Name (EN)','الاسم (إنجليزي)'], cType:['Type','النوع'],
  cExtra:['Source / options / formula','المصدر / الاختيارات / المعادلة'], cWidth:['Width','العرض'],
  addCol:['+ Column','+ عمود'], cancel:['Cancel','إلغاء'], apply:['Apply','تطبيق'], close:['Close','إغلاق'],
  open:['Open','فتح'], rename:['Rename','إعادة تسمية'], del:['Delete','حذف']
};
const TYPES = [['text','Text','نص'], ['number','Number','رقم'], ['date','Date','تاريخ'],
               ['select','Choice list','قائمة اختيارات'], ['bool','Yes / No','صح / غلط'],
               ['project','Project','المشروع'], ['lookup','From project data','من بيانات المشروع'],
               ['formula','Formula','معادلة']];
function applyLang(){
  const i = en() ? 0 : 1;
  document.documentElement.lang = en() ? 'en' : 'ar';
  document.documentElement.dir  = en() ? 'ltr' : 'rtl';
  document.title = en() ? 'Sheets | Saudi Architects' : 'الجداول | المعماريون السعوديون';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = (I18N[el.dataset.i18n] || ['', ''])[i]);
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = (I18N[el.dataset.i18nPh] || ['', ''])[i]);
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = (I18N[el.dataset.i18nTitle] || ['', ''])[i]);
  const b = $('#btnLang'); if(b) b.textContent = en() ? 'Arabic' : 'English';
}

/* ================= أدوات ================= */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = t => String(t == null ? '' : t).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function toast(msg, isErr){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 2800);
}
let BUSY = 0;
function busy(on){
  BUSY = Math.max(0, BUSY + (on ? 1 : -1));
  $('#loadBar').classList.toggle('on', BUSY > 0);
}
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; };
const colLabel = c => (en() ? (c.label_en || c.label) : c.label) || c.key;
const fieldLabel = f => (en() ? (f.label_en || f.label) : f.label) || f.key;

/* ================= المعادلات (نفس قواعد السيرفر) ================= */
const FN = {
  sum:(...a) => a.reduce((s, x) => s + num(x), 0),
  min:(...a) => Math.min(...a.map(num)), max:(...a) => Math.max(...a.map(num)),
  abs:x => Math.abs(num(x)), round:(x, n) => +num(x).toFixed(Math.max(0, Math.min(6, num(n)))),
  avg:(...a) => a.length ? a.reduce((s, x) => s + num(x), 0) / a.length : 0,
  if:(c, a, b) => c ? a : (b === undefined ? 0 : b)
};
function evalFormula(expr, vals){
  let i = 0; const s = String(expr || '');
  const ws = () => { while(i < s.length && /\s/.test(s[i])) i++; };
  const eat = t => { ws(); if(s.startsWith(t, i)){ i += t.length; return true; } return false; };
  function atom(){
    ws();
    if(i >= s.length) throw 0;
    const ch = s[i];
    if(ch === '('){ i++; const v = cmp(); if(!eat(')')) throw 0; return v; }
    if(ch === '['){ const e = s.indexOf(']', i); if(e < 0) throw 0; const k = s.slice(i + 1, e).trim(); i = e + 1; return vals[k] != null ? vals[k] : 0; }
    if(/[0-9.]/.test(ch)){ let j = i; while(j < s.length && /[0-9.]/.test(s[j])) j++; const n = parseFloat(s.slice(i, j)); i = j; return n; }
    if(/[a-zA-Z_]/.test(ch)){
      let j = i; while(j < s.length && /[a-zA-Z0-9_]/.test(s[j])) j++;
      const name = s.slice(i, j).toLowerCase(); i = j;
      if(!eat('(')) throw 0;
      const args = [];
      if(!eat(')')){ for(;;){ args.push(cmp()); if(eat(',')) continue; if(eat(')')) break; throw 0; } }
      const fn = FN[name]; if(!fn) throw 0;
      return fn.apply(null, args);
    }
    throw 0;
  }
  function un(){ if(eat('-')) return -num(un()); if(eat('+')) return un(); return atom(); }
  function pw(){ const v = un(); if(eat('^')) return Math.pow(num(v), num(pw())); return v; }
  function mul(){ let v = pw(); for(;;){ if(eat('*')) v = num(v) * num(pw()); else if(eat('/')){ const d = num(pw()); v = d ? num(v) / d : 0; } else if(eat('%')){ const d = num(pw()); v = d ? num(v) % d : 0; } else return v; } }
  function add(){ let v = mul(); for(;;){ if(eat('+')) v = num(v) + num(mul()); else if(eat('-')) v = num(v) - num(mul()); else return v; } }
  function cmp(){
    const l = add();
    for(const op of ['>=', '<=', '<>', '!=', '=', '>', '<']){
      if(eat(op)){ const r = add(), a = num(l), b = num(r);
        return op === '>=' ? a >= b : op === '<=' ? a <= b : op === '<>' || op === '!=' ? a !== b : op === '=' ? a === b : op === '>' ? a > b : a < b; }
    }
    return l;
  }
  try{
    const out = cmp(); ws();
    if(i < s.length) return null;
    return typeof out === 'boolean' ? (out ? 1 : 0) : (typeof out === 'number' ? +out.toFixed(6) : out);
  }catch(e){ return null; }
}

/* ================= الحالة ================= */
const S = {
  sheets:[], sheet:null, rows:[], total:0, page:0, per:200,
  sort:'', dir:'asc', q:'', filters:{}, showFilters:false,
  dirty:new Map(), adds:[], dels:new Set(), colsDraft:null, lookup:{}
};
const fmtNum = (v, dec, unit) => (v === null || v === undefined || v === '') ? ''
  : num(v).toLocaleString('en-US', {minimumFractionDigits:dec || 0, maximumFractionDigits:dec || 0}) + (unit ? ' ' + unit : '');

/* ================= الشبكة ================= */
function recalcRow(r){
  const cols = S.sheet.columns;
  const vals = Object.assign({}, r.data);
  const pk = (cols.find(c => c.type === 'project') || {}).key;
  const rec = pk ? (S.lookup[vals[pk]] || null) : null;
  cols.forEach(c => { if(c.type === 'lookup') vals[c.key] = rec ? rec[c.source] : null; });
  for(let k = 0; k < 4; k++){
    let ch = false;
    cols.forEach(c => { if(c.type !== 'formula') return;
      const v = evalFormula(c.formula, vals);
      if(vals[c.key] !== v){ vals[c.key] = v; ch = true; } });
    if(!ch) break;
  }
  r.data = vals;
}
function renderGrid(){
  const wrap = $('#wrap');
  if(!S.sheet){ wrap.innerHTML = `<div class="empty">${(I18N.noSheet)[en() ? 0 : 1]}</div>`; return; }
  const cols = S.sheet.columns;
  if(!cols.length){ wrap.innerHTML = `<div class="empty">${U('This sheet has no columns yet — open Columns…', 'الجدول ملوش أعمدة — افتح «الأعمدة…»')}</div>`; return; }
  const head = cols.map(c => {
    const calc = (c.type === 'formula' || c.type === 'lookup');
    const mark = S.sort === c.key ? `<span class="sortmark">${S.dir === 'asc' ? '▲' : '▼'}</span>` : '';
    return `<th style="min-width:${c.width || 150}px" class="${calc ? 'col-calc' : ''}" data-sort="${c.key}" data-no-tr>${esc(colLabel(c))}${mark}</th>`;
  }).join('');
  const filt = S.showFilters ? `<tr class="filters"><td class="rownum"></td>${cols.map(c =>
      `<td><input data-filter="${c.key}" value="${esc(S.filters[c.key] || '')}" placeholder="—"></td>`).join('')}</tr>` : '';
  const body = S.rows.map((r, i) => rowHtml(r, i, cols)).join('');
  wrap.innerHTML = `<table class="grid">
      <thead><tr><th class="rownum"><input type="checkbox" id="selAll"></th>${head}</tr>${filt}</thead>
      <tbody id="gridBody">${body}</tbody></table>`;
  bindGrid();
}
function rowHtml(r, i, cols){
  const cells = cols.map(c => cellHtml(r, c)).join('');
  const isNew = String(r.id).startsWith('n');
  return `<tr data-id="${r.id}" class="${S.dirty.has(r.id) || isNew ? 'dirty' : ''}">
      <td class="rownum"><input type="checkbox" data-rowsel="${r.id}"></td>${cells}</tr>`;
}
function cellHtml(r, c){
  const v = r.data[c.key];
  if(c.type === 'formula' || c.type === 'lookup'){
    const fld = c.type === 'lookup' ? FIELDS.find(f => f.key === c.source) : null;
    let shown = v;
    if(v === null || v === undefined || v === '') shown = '';
    else if(c.type === 'formula') shown = fmtNum(v, c.decimals, c.unit);
    else if(fld && ['number','percent','currency','days'].includes(fld.type)) shown = num(v).toLocaleString('en-US', {maximumFractionDigits:2}) + (fld.type === 'percent' ? '%' : '');
    const cls = (c.type === 'formula' || (fld && fld.type !== 'text' && fld.type !== 'date')) ? 'num' : '';
    return `<td class="cell-calc ${cls}" data-no-tr title="${esc(shown)}">${esc(shown)}</td>`;
  }
  if(c.type === 'project')
    return `<td><select data-cell="${c.key}" data-no-tr><option value=""></option>${PROJECTS.map(p =>
      `<option value="${esc(p)}" ${v === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></td>`;
  if(c.type === 'select')
    return `<td><select data-cell="${c.key}" data-no-tr><option value=""></option>${(c.options || []).map(o =>
      `<option value="${esc(o)}" ${v === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></td>`;
  if(c.type === 'bool')
    return `<td class="chk"><input type="checkbox" data-cell="${c.key}" ${v ? 'checked' : ''}></td>`;
  if(c.type === 'date')
    return `<td><input type="date" data-cell="${c.key}" value="${esc(v || '')}"></td>`;
  if(c.type === 'number')
    return `<td class="num"><input type="number" step="any" data-cell="${c.key}" value="${v === null || v === undefined ? '' : esc(v)}"></td>`;
  return `<td><input type="text" data-cell="${c.key}" value="${esc(v || '')}" data-no-tr></td>`;
}
function bindGrid(){
  $$('#wrap th[data-sort]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if(S.sort === k) S.dir = (S.dir === 'asc') ? 'desc' : 'asc'; else { S.sort = k; S.dir = 'asc'; }
    S.page = 0; refresh();
  }));
  $$('#wrap [data-filter]').forEach(inp => inp.addEventListener('change', () => {
    S.filters[inp.dataset.filter] = inp.value.trim(); S.page = 0; refresh();
  }));
  const sa = $('#selAll');
  if(sa) sa.addEventListener('change', () => $$('#wrap [data-rowsel]').forEach(c => { c.checked = sa.checked; c.closest('tr').classList.toggle('sel', sa.checked); }));
  $$('#wrap [data-rowsel]').forEach(c => c.addEventListener('change', () => c.closest('tr').classList.toggle('sel', c.checked)));
  $$('#wrap [data-cell]').forEach(inp => {
    const ev = (inp.tagName === 'SELECT' || inp.type === 'checkbox' || inp.type === 'date') ? 'change' : 'input';
    inp.addEventListener(ev, () => {
      const tr = inp.closest('tr'), id = tr.dataset.id;
      const r = S.rows.find(x => String(x.id) === String(id)); if(!r) return;
      const key = inp.dataset.cell;
      const col = S.sheet.columns.find(c => c.key === key);
      let val = inp.type === 'checkbox' ? inp.checked : inp.value;
      if(col.type === 'number') val = (val === '' ? null : num(val));
      r.data[key] = val;
      recalcRow(r);
      // الأعمدة المحسوبة تتحدث فوراً من غير إعادة بناء الصف كله (عشان مكان الكتابة ما يضيعش)
      S.sheet.columns.forEach((c, ci) => {
        if(c.type !== 'formula' && c.type !== 'lookup') return;
        const td = tr.children[ci + 1]; if(!td) return;
        const nv = r.data[c.key];
        const fld = c.type === 'lookup' ? FIELDS.find(f => f.key === c.source) : null;
        let shown = (nv === null || nv === undefined || nv === '') ? ''
          : (c.type === 'formula') ? fmtNum(nv, c.decimals, c.unit)
          : (fld && ['number','percent','currency','days'].includes(fld.type))
            ? num(nv).toLocaleString('en-US', {maximumFractionDigits:2}) + (fld.type === 'percent' ? '%' : '') : nv;
        td.textContent = shown; td.title = shown;
      });
      markDirty(r);
    });
  });
}
markDirty._t = 0;
function markDirty(r){
  if(!String(r.id).startsWith('n')) S.dirty.set(r.id, r);
  const tr = $(`#wrap tr[data-id="${r.id}"]`); if(tr) tr.classList.add('dirty');
  $('#btnSave').disabled = false;
  clearTimeout(markDirty._t);
  markDirty._t = setTimeout(saveChanges, 1500);      // حفظ تلقائي بعد ما تبطّل كتابة
}

/* ================= الاتصال بالسيرفر ================= */
async function api(url, opts){
  busy(true);
  try{
    const r = await fetch(url, opts);
    const j = await r.json().catch(() => ({success:false, error:'bad response'}));
    if(!j.success && j.error) toast(j.error, true);
    return j;
  }catch(e){ toast(String(e.message || e), true); return {success:false}; }
  finally{ busy(false); }
}
async function loadLatest(){
  const j = await api('/api/sheets/_latest');
  if(j && j.success) S.lookup = j.latest || {};
}
async function loadSheets(keepId){
  const j = await api('/api/sheets');
  if(!j.success) return;
  S.sheets = j.sheets || [];
  const sel = $('#sheetSel');
  sel.innerHTML = S.sheets.map(s => `<option value="${s.id}">${esc(en() ? (s.name_en || s.name) : s.name)}</option>`).join('');
  const want = keepId || (S.sheet && S.sheet.id) || (S.sheets[0] && S.sheets[0].id);
  if(want){ sel.value = want; await openSheet(want); }
  else { S.sheet = null; renderGrid(); $('#sheetName').textContent = '—'; }
}
async function openSheet(id){
  S.page = 0; S.sort = ''; S.dir = 'asc'; S.q = ''; S.filters = {}; $('#search').value = '';
  S.dirty.clear(); S.adds = []; S.dels.clear(); $('#btnSave').disabled = true;
  const meta = S.sheets.find(s => String(s.id) === String(id));
  S.sheet = meta ? JSON.parse(JSON.stringify(meta)) : null;
  $('#sheetName').textContent = meta ? (en() ? (meta.name_en || meta.name) : meta.name) : '—';
  await loadRows();
}
async function loadRows(){
  if(!S.sheet){ renderGrid(); return; }
  const p = new URLSearchParams({q:S.q, sort:S.sort, dir:S.dir, limit:S.per, offset:S.page * S.per,
                                filters:JSON.stringify(S.filters)});
  const j = await api(`/api/sheets/${S.sheet.id}/rows?` + p.toString());
  if(!j.success) return;
  S.sheet = j.sheet;
  S.rows = j.rows || [];
  S.total = j.total || 0;
  if(!Object.keys(S.lookup).length) loadLatest();     // بيانات المشاريع لحساب أعمدة lookup فوراً
  renderGrid(); updatePager();
}
function updatePager(){
  const from = S.total ? S.page * S.per + 1 : 0, to = Math.min(S.total, (S.page + 1) * S.per);
  $('#rowCount').textContent = S.total ? U(`${from}–${to} of ${S.total}`, `${from}–${to} من ${S.total}`) : U('No rows', 'لا توجد صفوف');
  $('#pageLbl').textContent = S.total ? `${S.page + 1} / ${Math.max(1, Math.ceil(S.total / S.per))}` : '';
  $('#btnPrev').disabled = S.page <= 0;
  $('#btnNext').disabled = (S.page + 1) * S.per >= S.total;
}
function hasPending(){
  return S.dirty.size > 0 || S.dels.size > 0 || S.rows.some(r => String(r.id).startsWith('n'));
}
/** يحفظ التعديلات المعلّقة ويرجّع true لو الدنيا تمام (أو مفيش حاجة تتحفظ) */
async function saveChanges(skipReload){
  if(!S.sheet) return true;
  clearTimeout(markDirty._t);
  const add = S.rows.filter(r => String(r.id).startsWith('n')).map(r => ({data:r.data}));
  const update = Array.from(S.dirty.values()).map(r => ({id:r.id, data:r.data}));
  const del = Array.from(S.dels);
  if(!add.length && !update.length && !del.length){ $('#btnSave').disabled = true; return true; }
  const j = await api(`/api/sheets/${S.sheet.id}/rows`, {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({add, update, delete:del})});
  if(!j.success) return false;
  S.dirty.clear(); S.dels.clear(); $('#btnSave').disabled = true;
  $('#savedAt').textContent = U('Saved ', 'تم الحفظ ') + new Date().toLocaleTimeString(en() ? 'en-GB' : 'ar-EG', {hour:'2-digit', minute:'2-digit'});
  if(!skipReload) await loadRows();
  return true;
}
/** أي إعادة تحميل من السيرفر (فرز/بحث/فلتر/صفحة) بتحفظ الأول — عشان صف جديد أو تعديل ما يضيعش */
async function refresh(){
  if(hasPending() && !(await saveChanges(true))){
    toast(U('Could not save your changes — nothing was reloaded', 'تعذّر حفظ تعديلاتك — لم يُعد التحميل'), true);
    return;
  }
  await loadRows();
}

/* ================= الأعمدة ================= */
function openCols(){
  S.colsDraft = JSON.parse(JSON.stringify(S.sheet.columns || []));
  drawCols(); $('#colsModal').classList.add('open');
}
function drawCols(){
  const list = $('#colList');
  list.innerHTML = S.colsDraft.map((c, i) => {
    const extra = c.type === 'lookup'
      ? `<select data-cf="source" data-i="${i}">${FIELDS.map(f => `<option value="${f.key}" ${c.source === f.key ? 'selected' : ''}>${esc(fieldLabel(f))}</option>`).join('')}</select>`
      : c.type === 'select'
      ? `<input data-cf="options" data-i="${i}" value="${esc((c.options || []).join(', '))}" placeholder="${U('A, B, C', 'أ، ب، ج')}">`
      : c.type === 'formula'
      ? `<input data-cf="formula" data-i="${i}" value="${esc(c.formula || '')}" placeholder="[qty] * [price]" data-no-tr>`
      : (c.type === 'number' ? `<input data-cf="unit" data-i="${i}" value="${esc(c.unit || '')}" placeholder="${U('unit (SAR, day…)', 'الوحدة (ر.س، يوم…)')}">` : '<span></span>');
    return `<div class="col-row">
      <div class="mv"><button data-mv="up" data-i="${i}">▲</button><button data-mv="dn" data-i="${i}">▼</button></div>
      <input data-cf="label" data-i="${i}" value="${esc(c.label || '')}" data-no-tr>
      <input data-cf="label_en" data-i="${i}" value="${esc(c.label_en || '')}" data-no-tr>
      <select data-cf="type" data-i="${i}">${TYPES.map(([v, e, a]) => `<option value="${v}" ${c.type === v ? 'selected' : ''}>${en() ? e : a}</option>`).join('')}</select>
      ${extra}
      <input type="number" data-cf="width" data-i="${i}" value="${c.width || 150}" min="70" max="600">
      <button class="btn danger" data-rmcol="${i}" style="height:32px;padding:0 10px;">${U('Remove', 'حذف')}</button>
    </div>`;
  }).join('');
  list.querySelectorAll('[data-cf]').forEach(inp => inp.addEventListener('change', () => {
    const c = S.colsDraft[+inp.dataset.i], f = inp.dataset.cf;
    if(f === 'options') c.options = inp.value.split(/[,،]/).map(x => x.trim()).filter(Boolean);
    else if(f === 'width') c.width = Math.max(70, Math.min(600, +inp.value || 150));
    else c[f] = inp.value;
    if(f === 'type'){
      if(c.type === 'number' || c.type === 'formula') c.decimals = c.decimals || 0;
      drawCols();
    }
  }));
  list.querySelectorAll('[data-rmcol]').forEach(b => b.addEventListener('click', () => {
    S.colsDraft.splice(+b.dataset.rmcol, 1); drawCols();
  }));
  list.querySelectorAll('[data-mv]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i, j = b.dataset.mv === 'up' ? i - 1 : i + 1;
    if(j < 0 || j >= S.colsDraft.length) return;
    const t = S.colsDraft[i]; S.colsDraft[i] = S.colsDraft[j]; S.colsDraft[j] = t; drawCols();
  }));
}
$('#btnAddCol').addEventListener('click', () => {
  const n = S.colsDraft.length + 1;
  S.colsDraft.push({key:'c' + n + Math.random().toString(36).slice(2, 5), type:'text',
                    label:'عمود ' + n, label_en:'Column ' + n, width:150});
  drawCols();
});
$('#btnColsSave').addEventListener('click', async () => {
  const j = await api(`/api/sheets/${S.sheet.id}`, {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({columns:S.colsDraft})});
  if(!j.success) return;
  $('#colsModal').classList.remove('open');
  await loadSheets(S.sheet.id);
  toast(U('Columns updated', 'تم تحديث الأعمدة'));
});

/* ================= إدارة الجداول ================= */
function openMgr(){
  $('#mgrBody').innerHTML = S.sheets.map(s => `
    <div class="sheet-item">
      <div class="nm"><b data-no-tr>${esc(en() ? (s.name_en || s.name) : s.name)}</b>
        <span>${U(s.rows + ' rows', s.rows + ' صف')} · ${esc(String(s.updated_at).slice(0, 16))}</span></div>
      <button class="btn" data-open="${s.id}">${(I18N.open)[en() ? 0 : 1]}</button>
      <button class="btn" data-ren="${s.id}">${(I18N.rename)[en() ? 0 : 1]}</button>
      <button class="btn danger" data-del="${s.id}">${(I18N.del)[en() ? 0 : 1]}</button>
    </div>`).join('') || `<div class="empty">${(I18N.noSheet)[en() ? 0 : 1]}</div>`;
  $('#mgrBody').querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', async () => {
    $('#sheetSel').value = b.dataset.open; $('#mgrModal').classList.remove('open'); await openSheet(b.dataset.open);
  }));
  $('#mgrBody').querySelectorAll('[data-ren]').forEach(b => b.addEventListener('click', async () => {
    const s = S.sheets.find(x => String(x.id) === b.dataset.ren);
    const name = prompt(U('Sheet name (Arabic):', 'اسم الجدول (بالعربي):'), s.name);
    if(name === null) return;
    const nameEn = prompt(U('Sheet name (English):', 'اسم الجدول (بالإنجليزي):'), s.name_en || '');
    await api(`/api/sheets/${s.id}`, {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name, name_en:nameEn === null ? (s.name_en || '') : nameEn})});
    await loadSheets(s.id); openMgr();
  }));
  $('#mgrBody').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm(U('Delete this sheet and all its rows? This cannot be undone.',
                  'حذف الجدول وكل صفوفه نهائياً؟ لا يمكن التراجع.'))) return;
    await api(`/api/sheets/${b.dataset.del}`, {method:'DELETE'});
    S.sheet = null; await loadSheets(); openMgr();
  }));
  $('#mgrModal').classList.add('open');
}

/* ================= الأزرار ================= */
$('#btnNew').addEventListener('click', async () => {
  const name = prompt(U('New sheet name:', 'اسم الجدول الجديد:'), U('New sheet', 'جدول جديد'));
  if(name === null) return;
  const j = await api('/api/sheets', {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:name.trim() || U('New sheet', 'جدول جديد'), name_en:name.trim()})});
  if(j.success){ await loadSheets(j.id); toast(U('Sheet created', 'تم إنشاء الجدول')); }
});
$('#btnManage').addEventListener('click', openMgr);
$('#btnCols').addEventListener('click', () => { if(S.sheet) openCols(); });
$('#btnSave').addEventListener('click', saveChanges);
$('#sheetSel').addEventListener('change', async e => { await saveChanges(true); openSheet(e.target.value); });
$('#btnAddRow').addEventListener('click', () => {
  if(!S.sheet) return;
  const r = {id:'n' + Date.now() + Math.random().toString(36).slice(2, 5), data:{}};
  recalcRow(r);
  S.rows.push(r); S.total++;
  renderGrid(); updatePager();
  $('#btnSave').disabled = false;
  const tr = $(`#wrap tr[data-id="${r.id}"]`);
  if(tr){ tr.scrollIntoView({block:'nearest'}); const f = tr.querySelector('[data-cell]'); if(f) f.focus(); }
});
$('#btnDelRows').addEventListener('click', async () => {
  const ids = $$('#wrap [data-rowsel]:checked').map(c => c.dataset.rowsel);
  if(!ids.length){ toast(U('Select rows first', 'اختر صفوفاً أولاً'), true); return; }
  if(!confirm(U(`Delete ${ids.length} row(s)?`, `حذف ${ids.length} صف؟`))) return;
  ids.forEach(id => { if(!String(id).startsWith('n')) S.dels.add(+id); S.dirty.delete(+id); });
  S.rows = S.rows.filter(r => !ids.includes(String(r.id)));
  renderGrid();
  await saveChanges();
});
$('#btnFilters').addEventListener('click', () => { S.showFilters = !S.showFilters; if(!S.showFilters) S.filters = {}; renderGrid(); if(!S.showFilters) refresh(); });
$('#search').addEventListener('input', e => {
  clearTimeout(window._sq);
  window._sq = setTimeout(() => { S.q = e.target.value.trim(); S.page = 0; refresh(); }, 350);
});
$('#btnPrev').addEventListener('click', () => { if(S.page > 0){ S.page--; refresh(); } });
$('#btnNext').addEventListener('click', () => { if((S.page + 1) * S.per < S.total){ S.page++; refresh(); } });
$$('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('.modal-back').classList.remove('open')));
$$('.modal-back').forEach(m => m.addEventListener('click', e => { if(e.target === m) m.classList.remove('open'); }));
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') $$('.modal-back.open').forEach(m => m.classList.remove('open'));
  if((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')){ e.preventDefault(); saveChanges(); }
});
$('#btnLang').addEventListener('click', () => {
  UIL = en() ? 'ar' : 'en';
  try{ localStorage.setItem(UI_KEY, UIL); }catch(e){}
  applyLang(); renderGrid(); updatePager();
  if(S.sheet) $('#sheetName').textContent = en() ? (S.sheet.name_en || S.sheet.name) : S.sheet.name;
});
window.addEventListener('beforeunload', e => { if(hasPending()){ e.preventDefault(); e.returnValue = ''; } });

applyLang();
loadSheets();
</script>
<script>
/* انتهاء الجلسة: أي رد 401/403 من السيرفر معناه إن الجلسة خلصت —
   نقول للمستخدم ونحوّله لصفحة الدخول بدل رسالة «غير مصرح» الغامضة */
(function(){
  if(window.__pmisAuthGuard) return;
  window.__pmisAuthGuard = true;
  var LOGIN = '/admin', gone = false;
  var MSG = {ar:'انتهت الجلسة — يتم تحويلك لصفحة الدخول…', en:'Your session has expired — taking you to the sign-in page…'};
  function expired(){
    if(gone) return; gone = true;
    var en = (document.documentElement.lang === 'en');
    var msg = en ? MSG.en : MSG.ar;
    try{
      if(typeof toast === 'function'){
        var real = toast;
        window.toast = function(){ real(msg, true); };
        real(msg, true);
      }else alert(msg);
    }catch(e){}
    try{ window.onbeforeunload = null; }catch(e){}
    setTimeout(function(){ location.href = LOGIN; }, 1800);
  }
  var nativeFetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    var u = String((input && input.url) || input || '');
    return nativeFetch(input, init).then(function(r){
      try{
        var sameSite = !/^https?:\/\//.test(u) || u.indexOf(location.origin) === 0;
        if((r.status === 401 || r.status === 403) && sameSite) expired();
      }catch(e){}
      return r;
    });
  };
  window.pmisSessionExpired = expired;
})();
</script>
