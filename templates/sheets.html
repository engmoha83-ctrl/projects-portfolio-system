<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheets | Saudi Architects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EBEF; --tint:#F1F3F7; --tint2:#E6EAF0; --line:#E3E6EC; --ink:#172033; --muted:#5B6577;
  --navy:#1F3A5F; --navy2:#274A78; --gold:#C8A165; --danger:#C8543E; --head-h:58px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{height:100%;margin:0;}
body{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif; background:var(--bg); color:var(--ink);
     overflow:hidden; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;}
html[lang="ar"] body{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;}
button,input,select,textarea{font-family:inherit; border-radius:0;}

.hdr{height:var(--head-h); flex:0 0 auto; background:#fff; box-shadow:0 1px 3px rgba(23,32,51,.07); display:flex;
     align-items:center; gap:6px; padding:0 16px; position:relative; z-index:30;}
.hdr-back{width:36px; height:36px; display:flex; align-items:center; justify-content:center;
          background:var(--tint); color:var(--ink); text-decoration:none; flex:0 0 auto; transition:background-color .15s ease;}
.hdr-back:hover{background:var(--tint2);}
[dir="rtl"] .hdr-back svg{transform:scaleX(-1);}
.hdr-title{display:flex; flex-direction:column; line-height:1.2; padding:0 12px; min-width:0;}
.hdr-title small{font-size:11px; color:var(--muted); font-weight:500;}
.hdr-title b{font-size:14px; font-weight:600;}
.spacer{flex:1;}
.btn{height:34px; border:none; background:var(--tint); padding:0 12px; font-size:13px; font-weight:500;
     color:var(--ink); cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px;
     transition:background-color .15s ease, transform .15s ease;}
.btn:hover{background:var(--tint2);}
.btn:active{transform:scale(.98);}
.btn[disabled]{opacity:.4; pointer-events:none;}
.btn.primary{background:var(--navy); color:#fff; font-weight:600; height:36px;}
.btn.primary:hover{background:var(--navy2);}
.btn.danger{color:var(--danger);}
.btn.danger:hover{background:#FBEDEA;}
.btn.icon{width:34px; padding:0; justify-content:center; font-size:15px;}
.fld{height:36px; background:var(--tint); border:none; padding:0 10px; font-size:13px; color:var(--ink); max-width:260px;}
.fld:focus{outline:2px solid #C9D6E8;}

.bar{flex:0 0 auto; min-height:46px; background:#fff; box-shadow:0 1px 2px rgba(23,32,51,.05); display:flex; align-items:center;
     flex-wrap:wrap; gap:8px; padding:6px 16px; position:relative; z-index:20;}
.bar.ctx{background:#EAF0F8; box-shadow:inset 0 -1px 0 #D6E0EE; gap:7px; row-gap:6px;}
.bar .sep{width:1px; height:22px; background:#D3DEEC;}
/* مجموعة خيارات: ظاهرة دايماً، ورمادية لحد ما يكون فيه تحديد */
.bar.ctx{position:relative;}
.grp{display:flex; align-items:center; gap:6px; flex-wrap:nowrap;}
/* كل مجموعة بتبدأ بخانة عرضها ثابت (اسم المجموعة فوق والمحدد تحته) — الأزرار ما بتتحركش */
.gtag{flex:0 0 92px; width:92px; display:flex; flex-direction:column; justify-content:center;
  line-height:1.25; overflow:hidden; margin-inline-end:2px;}
.gtag b{font-size:9.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:#8E98A8;}
.gtag i{font-style:normal; font-size:12px; font-weight:600; color:var(--navy);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.grp.off{opacity:.5;}
.grp.off .gtag i{color:#9AA4B4;}
.bar label.inline > span{white-space:nowrap;}
/* نافذة إعدادات العمود */
.pop{position:absolute; top:calc(100% - 2px); inset-inline-start:16px; z-index:60; background:#fff; padding:12px 14px;
  box-shadow:0 14px 34px rgba(23,32,51,.18); display:flex; flex-direction:column; gap:10px; min-width:280px;}
.pop-hd{display:flex; align-items:center; justify-content:space-between; gap:14px;
  font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
.pop{max-width:min(460px, 92vw);}
.pop #colExtra{display:flex; flex-direction:column; gap:9px;}
.pop-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.pop-lbl{flex:0 0 66px; font-size:12.5px; color:var(--muted);}
.chips{display:flex; flex-wrap:wrap; gap:6px; flex:1; min-width:180px;}
.chip2{display:inline-flex; align-items:center; gap:5px; background:var(--tint); color:var(--ink);
  font-size:12.5px; padding:5px 8px; border:none; font-family:inherit; max-width:200px;}
.chip2 button{border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:11px; padding:0 1px;}
.chip2 button:hover{color:var(--danger);}
.chip2.ins{cursor:pointer; background:#E7EEF8; color:var(--navy); font-weight:500;}
.chip2.ins:hover{background:#D9E5F5;}
.addopt{display:flex; gap:6px; flex:1; min-width:200px;}
.hintline{font-size:11.5px; color:var(--muted); line-height:1.55;}
.bar .fld[disabled], .bar select[disabled]{background:#E4E9F0; color:var(--muted); cursor:default;}
.swatch.off{pointer-events:none;}
/* قائمة التصدير */
.menu{position:absolute; top:calc(100% + 4px); inset-inline-start:0; z-index:70; background:#fff; min-width:230px;
  box-shadow:0 14px 34px rgba(23,32,51,.18); padding:5px 0; display:flex; flex-direction:column;}
.menu button{display:flex; flex-direction:column; align-items:flex-start; gap:1px; background:none; border:none;
  padding:8px 14px; cursor:pointer; text-align:start; font-family:inherit; width:100%;}
.menu button:hover{background:var(--tint);}
.menu button b{font-size:13px; font-weight:600; color:var(--ink);}
.menu button i{font-style:normal; font-size:11px; color:var(--muted);}
/* الطباعة */
#printArea{display:none;}
@media print{
  html, body{height:auto; overflow:visible; background:#fff;}
  body{display:block;}
  .hdr, .bar, .statusbar, .load-bar, .toast, .modal-back, .wrap, .pop, .menu{display:none !important;}
  #printArea{display:block;}
  .pr-head{margin:0 0 10px;}
  .pr-head h1{font-size:15px; margin:0 0 3px; color:#1F3A5F;}
  .pr-head small{font-size:10.5px; color:#5B6577;}
  table.pr{width:100%; border-collapse:collapse; font-size:9.5px; table-layout:auto;}
  table.pr th, table.pr td{border:1px solid #C9CFD8; padding:4px 6px; text-align:start; vertical-align:middle;}
  table.pr thead th{background:#1F3A5F !important; color:#fff !important; font-weight:700;}
  table.pr tfoot td{background:#EDF1F7 !important; font-weight:700;}
  table.pr thead{display:table-header-group;}
  table.pr tfoot{display:table-footer-group;}
  table.pr tr{break-inside:avoid;}
  table.pr td.pnum, table.pr th.pnum{width:24px; color:#5B6577; text-align:center;}
  table.pr th.num, table.pr td.num{text-align:end; font-variant-numeric:tabular-nums;}
  *{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;}
}
body.picking, body.picking .grid td, body.picking .grid td input{user-select:none; cursor:cell;}
#colOpts.has{background:var(--navy); color:#fff;}
#colOpts.has:hover{background:var(--navy2);}
/* الأسهم دي بتشاور على ترتيب الأعمدة — بتتقلب مع الواجهة العربية */
[dir="rtl"] #colLeft, [dir="rtl"] #colRight, [dir="rtl"] #colInsL, [dir="rtl"] #colInsR,
[dir="rtl"] #cellFillRight{transform:scaleX(-1);}
.btn.icon svg{display:block;}
.bar label.inline{font-size:12.5px; color:var(--muted); display:inline-flex; align-items:center; gap:6px;}
.bar .fld, .bar select, .bar input[type=text], .bar input[type=number]{height:34px;}
.count{font-size:12.5px; color:var(--muted); white-space:nowrap;}
.chip{font-size:12px; font-weight:600; background:var(--navy); color:#fff; padding:5px 10px; white-space:nowrap;}
.search{height:34px; background:var(--tint); border:none; padding:0 10px; font-size:13px; width:220px;}

.wrap{flex:1 1 auto; min-height:0; overflow:auto; background:var(--bg); padding:14px 16px 60px;}
table.grid{border-collapse:separate; border-spacing:0; background:#fff; table-layout:fixed;
           box-shadow:0 1px 2px rgba(23,32,51,.05), 0 8px 20px rgba(23,32,51,.06);}
.grid td, .grid th{overflow:hidden;}
.grid th, .grid td{border-bottom:1px solid var(--line); border-inline-end:1px solid var(--line); padding:0; height:34px;}
.grid th{position:sticky; top:0; z-index:5; background:#F7F8FA; font-size:12px; font-weight:600; color:var(--ink);
         text-align:start; white-space:nowrap; user-select:none;}
.grid th .thin{display:flex; align-items:center; gap:6px; padding:0 8px; height:100%;}
.grid th .thlbl{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; cursor:pointer; padding:3px 2px;}
.grid th .thlbl:hover{color:var(--navy);}
.grid th .sortmark{font-size:10px; color:var(--muted);}
.grid th .grip{cursor:grab; color:#C2C8D2; font-size:11px; letter-spacing:-1px;}
.grid th .grip:active{cursor:grabbing;}
.grid th.sel{background:#EAF0F8; box-shadow:inset 0 -2px 0 var(--navy);}
.grid th.calc .thlbl{color:var(--muted);}
.grid th.drop-before{box-shadow:inset 3px 0 0 var(--navy);}
.grid th.drop-after{box-shadow:inset -3px 0 0 var(--navy);}
.grid td{font-size:13px; background:#fff;}
.grid tr:hover td{background:#FAFBFC;}
.grid td.colsel{background:#F5F8FC;}
.grid td.cell-calc{background:#F7F8FA; padding:0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.grid tr:hover td.cell-calc{background:#F4F6F8;}
.grid td.rownum, .grid th.rownum{width:74px; background:#F7F8FA; text-align:center; color:var(--muted); font-size:11.5px;}
.grid td.rownum .rn{display:flex; align-items:center; justify-content:center; gap:5px; height:100%;}
.grid td.rownum .rgrip{cursor:grab; color:#C2C8D2; font-size:11px; letter-spacing:-1px;}
.grid td.rownum .rgrip.off{cursor:not-allowed; color:#E0E4EA;}
.grid td input[type=text], .grid td input[type=number], .grid td input[type=date], .grid td select{
  width:100%; height:33px; border:none; background:transparent; padding:0 10px; font-size:inherit; color:inherit;
  font-family:inherit; font-weight:inherit; font-style:inherit; text-decoration:inherit;}
.grid td{font-size:13px;}
.grid td input:focus, .grid td select:focus{outline:2px solid var(--navy); outline-offset:-2px; background:#F4F8FF;}
.grid td.num input, .grid td.cell-calc.num{text-align:end; font-variant-numeric:tabular-nums;}
.grid td.chk{text-align:center;}
.grid tr.sel td{background:#EAF0F8;}
.grid tr.dirty td.rownum{box-shadow:inset 3px 0 0 var(--gold);}
.grid tr.drag-over td{box-shadow:inset 0 3px 0 var(--navy);}
.grid tr.dragging{opacity:.45;}
.grid td.cell-sel{background:#EDF3FB; outline:1px solid #AFC6E4; outline-offset:-1px;}
.grid td.cell-sel.cell-calc{background:#E7EEF8;}
.grid td.cell-anchor{box-shadow:inset 0 0 0 2px var(--navy); outline:none;}
/* تجميد أول عمود مع عمود الترقيم */
.grid td.fz, .grid th.fz{position:sticky; z-index:4;}
.grid th.fz{z-index:7;}
.grid td.fz{box-shadow:1px 0 0 var(--line);}
[dir="rtl"] .grid td.fz{box-shadow:-1px 0 0 var(--line);}
/* صف المجاميع */
.grid tfoot td{position:sticky; bottom:0; z-index:4; background:#F1F4F8; font-weight:600; font-size:12.5px;
  padding:0 10px; white-space:nowrap; box-shadow:inset 0 1px 0 var(--line);}
.grid tfoot td.num{text-align:end; font-variant-numeric:tabular-nums;}
.grid tfoot td .ag{color:var(--muted); font-weight:500; font-size:11px; margin-inline-end:5px;}
/* شريط الحالة */
.statusbar{position:fixed; inset-inline-start:0; inset-inline-end:0; bottom:0; height:30px; background:#fff; z-index:40;
  display:flex; align-items:center; gap:16px; padding:0 16px; font-size:12px; color:var(--muted);
  box-shadow:0 -1px 2px rgba(23,32,51,.06); transform:translateY(100%); transition:transform .18s var(--ease);}
.statusbar.on{transform:none;}
.statusbar b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums;}
/* أدوات التنسيق */
.swatch{position:relative; width:34px; height:34px; background:var(--tint); display:inline-flex; align-items:center;
  justify-content:center; cursor:pointer; font-size:13px; font-weight:700; overflow:hidden;}
.swatch:hover{background:var(--tint2);}
.swatch input[type=color]{position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; border:none; padding:0;}
.swatch i{position:absolute; left:4px; right:4px; bottom:4px; height:4px; background:var(--ink);}
.btn.on{background:var(--navy); color:#fff;}
#fillHandle{position:absolute; width:9px; height:9px; background:var(--navy); border:1px solid #fff;
  cursor:crosshair; z-index:6;}
#fillHandle[hidden]{display:none;}
.grid th.addcol{width:44px; text-align:center; cursor:pointer; color:var(--muted); font-size:17px; background:#F7F8FA;}
.grid th.addcol:hover{background:var(--tint2); color:var(--navy);}
.filters td{background:#FCFCFD; height:30px;}
.filters input{width:100%; height:29px; border:none; background:transparent; padding:0 10px; font-size:12px;}
.empty{padding:44px 10px; text-align:center; color:var(--muted); font-size:13.5px;}
/* هيكل مبدئي أثناء تحميل الجدول */
.skel{background:#fff; max-width:980px; box-shadow:0 1px 2px rgba(23,32,51,.05), 0 8px 20px rgba(23,32,51,.06);}
.sk-row{display:flex; height:34px; align-items:center; border-bottom:1px solid var(--line);}
.sk-row.sk-head{background:#F7F8FA; height:36px;}
.sk-row i{flex:1; height:11px; margin:0 12px; border-radius:2px;
  background:linear-gradient(90deg,#EEF1F5 25%,#E1E6EE 37%,#EEF1F5 63%); background-size:400% 100%;
  animation:sk 1.4s var(--ease) infinite;}
.sk-row.sk-head i{background:linear-gradient(90deg,#E4E9F0 25%,#D8DFE9 37%,#E4E9F0 63%); background-size:400% 100%;}
.sk-row i:nth-child(1){flex:1.6;} .sk-row i:nth-child(3){flex:.7;}
@keyframes sk{from{background-position:100% 50%} to{background-position:0 50%}}
@media (prefers-reduced-motion: reduce){ .sk-row i{animation-duration:3s;} }
.addrow{display:flex; align-items:center; gap:7px; height:34px; padding:0 12px; font-size:13px; color:var(--muted);
        background:#fff; cursor:pointer; box-shadow:0 1px 2px rgba(23,32,51,.05); transition:background-color .15s ease;}
.addrow:hover{background:var(--tint); color:var(--navy);}

.modal-back{position:fixed; inset:0; background:rgba(23,32,51,.40); display:flex; align-items:center; justify-content:center;
  z-index:80; opacity:0; visibility:hidden; transition:opacity .2s ease, visibility 0s linear .2s;}
.modal-back.open{opacity:1; visibility:visible; transition:opacity .2s ease, visibility 0s;}
.modal{background:#fff; width:min(620px,95vw); max-height:86vh; display:flex; flex-direction:column;
  box-shadow:0 24px 60px rgba(23,32,51,.28); transform:translateY(8px) scale(.98); transition:transform .25s var(--ease);}
.modal-back.open .modal{transform:none;}
.modal h3{margin:0; padding:16px 20px 6px; font-size:16px; font-weight:700;}
.modal-body{padding:8px 20px 16px; overflow:auto;}
.modal-foot{padding:12px 20px; background:#F7F8FA; display:flex; justify-content:flex-end; gap:8px;}
.sheet-item{display:flex; align-items:center; gap:10px; padding:10px 12px; background:#F7F8FA; margin-bottom:6px;}
.sheet-item .nm{flex:1; min-width:0;}
.sheet-item .nm b{font-size:13.5px; font-weight:600; display:block;}
.sheet-item .nm span{font-size:12px; color:var(--muted);}
.toast{position:fixed; bottom:22px; inset-inline-end:22px; background:var(--ink); color:#fff; padding:12px 18px;
  font-size:13px; box-shadow:0 18px 40px rgba(23,32,51,.22); z-index:99; opacity:0; transform:translateY(12px);
  transition:opacity .25s ease, transform .3s var(--ease); pointer-events:none;}
.toast.show{opacity:1; transform:none;}
.toast.err{background:var(--danger);}
.load-bar{position:fixed; top:var(--head-h); left:0; right:0; height:3px; z-index:70; overflow:hidden; pointer-events:none;
  opacity:0; transition:opacity .25s ease;}
.load-bar.on{opacity:1;}
.load-bar i{position:absolute; top:0; bottom:0; width:35%; background:var(--gold); animation:ls 1.1s var(--ease) infinite;}
.load-bar::before{content:''; position:absolute; inset:0; background:rgba(200,161,101,.22);}
@keyframes ls{from{left:-35%}to{left:100%}}
@media (prefers-reduced-motion: reduce){ .load-bar i{animation-duration:2.4s;} }
</style>
</head>
<body>

<header class="hdr">
  <a class="hdr-back" href="/admin-hub" data-i18n-title="back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
  <div class="hdr-title"><small data-i18n="sheets">Sheets</small><b id="sheetName">—</b></div>
  <select class="fld" id="sheetSel" style="margin-inline-start:10px;" data-no-tr></select>
  <button class="btn" id="btnNew" data-i18n="newSheet">New sheet</button>
  <button class="btn" id="btnManage" data-i18n="manage">Manage…</button>
  <span style="position:relative">
    <button class="btn" id="btnExport" data-i18n="exportBtn">Export ▾</button>
    <div class="menu" id="exportMenu" hidden>
      <button data-exp="xlsx-view"><b data-i18n="expXlsx">Excel (.xlsx)</b><i data-i18n="expView">what you see now</i></button>
      <button data-exp="xlsx-all"><b data-i18n="expXlsxAll">Excel — all rows</b><i data-i18n="expAll">ignores search and filters</i></button>
      <button data-exp="csv-view"><b data-i18n="expCsv">CSV</b><i data-i18n="expView">what you see now</i></button>
      <button data-exp="print"><b data-i18n="expPrint">Print / PDF</b><i data-i18n="expPrintHint">opens the print window</i></button>
    </div>
  </span>
  <div class="spacer"></div>
  <span class="count" id="savedAt"></span>
  <button class="btn" id="btnLang">العربية</button>
  <button class="btn primary" id="btnSave" disabled data-i18n="save">Save</button>
</header>

<div class="load-bar" id="loadBar"><i></i></div>

<!-- شريط عادي -->
<div class="bar" id="mainBar">
  <button class="btn" id="btnAddRow" data-i18n="addRow">+ Row</button>
  <button class="btn" id="btnAddCol" data-i18n="addCol">+ Column</button>
  <div class="sep"></div>
  <button class="btn icon" id="btnUndo" data-i18n-title="undo" disabled>↶</button>
  <button class="btn icon" id="btnRedo" data-i18n-title="redo" disabled>↷</button>
  <button class="btn icon" id="btnFreeze" data-i18n-title="freeze">❄</button>
  <div class="sep"></div>
  <input class="search" id="search" data-i18n-ph="search" placeholder="Search…">
  <button class="btn" id="btnFilters" data-i18n="filters">Filters</button>
  <button class="btn" id="btnClearFilters" disabled data-i18n="clearFilters">Clear filters</button>
  <div class="spacer"></div>
  <span class="count" id="rowCount"></span>
  <button class="btn icon" id="btnPrev">‹</button>
  <span class="count" id="pageLbl"></span>
  <button class="btn icon" id="btnNext">›</button>
</div>

<!-- شريط ثابت: كل خانة عرضها ثابت عشان مفيش حاجة تتحرك لما تحدد -->
<div class="bar ctx" id="ctxBar">
  <span class="grp" id="colGroup">
    <span class="gtag"><b data-i18n="colLbl">Column</b><i id="colChip">—</i></span>
    <label class="inline"><span data-i18n="name">Name</span>
      <input class="fld" id="colName" style="width:136px" data-no-tr></label>
    <label class="inline"><span data-i18n="type">Type</span>
      <select class="fld" id="colType" style="width:142px"></select></label>
    <button class="btn icon" id="colOpts" data-i18n-title="colSettings">⚙</button>
    <label class="inline"><span data-i18n="width">Width</span>
      <input class="fld" id="colWidth" type="number" min="70" max="900" step="10" style="width:72px"></label>
    <label class="inline"><span data-i18n="total">Total</span>
      <select class="fld" id="colAgg" style="width:104px"></select></label>
    <button class="btn icon" id="colSortA" data-i18n-title="sortAsc">↑A</button>
    <button class="btn icon" id="colSortD" data-i18n-title="sortDesc">↓Z</button>
    <button class="btn icon" id="colLeft" data-i18n-title="moveColBefore">◀</button>
    <button class="btn icon" id="colRight" data-i18n-title="moveColAfter">▶</button>
    <button class="btn icon" id="colDup" data-i18n-title="dupCol">⧉</button>
    <button class="btn icon" id="colInsL" data-i18n-title="insColBefore">⇤+</button>

<script>
const PROJECTS = {{ projects | tojson }};
const FIELDS   = {{ field_meta | tojson }};

/* ================= اللغة ================= */
const UI_KEY = 'pmis_ui_lang';
let UIL = (() => { try{ return localStorage.getItem(UI_KEY) === 'ar' ? 'ar' : 'en'; }catch(e){ return 'en'; } })();
const en = () => UIL !== 'ar';
const U  = (e, a) => en() ? e : a;
const I18N = {
  sheets:['Sheets','الجداول'], back:['Back','رجوع'], newSheet:['New sheet','جدول جديد'],
  manage:['Manage…','إدارة…'], manageT:['Sheets','الجداول'], save:['Save','حفظ'],

             'تكرار للجنب (Ctrl+Shift+R) — بيكرر قيمة الخلية للجنب'], clearCells:['Clear','مسح'],
  unit:['Unit','الوحدة'], options:['Choices','الاختيارات'], formula:['Formula','المعادلة'], source:['Source','المصدر'],
  total:['Total','الإجمالي'], undo:['Undo (Ctrl+Z)','تراجع (Ctrl+Z)'], redo:['Redo (Ctrl+Y)','إعادة (Ctrl+Y)'],
  freeze:['Freeze first column','تثبيت أول عمود'], bold:['Bold (Ctrl+B)','عريض (Ctrl+B)'],
  italic:['Italic (Ctrl+I)','مائل (Ctrl+I)'], underline:['Underline (Ctrl+U)','تسطير (Ctrl+U)'],
  fontSize:['Font size','حجم الخط'], align:['Alignment','المحاذاة'], textColor:['Text colour','لون النص'],
  fillColor:['Fill colour','لون الخلفية'], clearFmt:['Clear formatting','مسح التنسيق'],

  insRowBelow:['Insert row below','إدراج صف تحت'], insColBefore:['Insert column before','إدراج عمود قبل'],
  insColAfter:['Insert column after','إدراج عمود بعد'], sum:['Sum','المجموع'], avg:['Average','المتوسط'],
  countL:['Count','العدد'], minL:['Min','الأصغر'], maxL:['Max','الأكبر'], sel:['Selected','المحدد'],
  colLbl:['Column','العمود'], rowsLbl:['Rows','الصفوف'], cellsLbl:['Cells','الخلايا'], fmtLbl:['Format','التنسيق'],
  moveColBefore:['Move column before','تحريك العمود للخلف'], moveColAfter:['Move column after','تحريك العمود للأمام'],
  moveRowUp:['Move row up','تحريك الصف لأعلى'], moveRowDown:['Move row down','تحريك الصف لأسفل'],
  exportBtn:['Export ▾','تصدير ▾'], expXlsx:['Excel (.xlsx)','إكسيل (.xlsx)'],
  expXlsxAll:['Excel — all rows','إكسيل — كل الصفوف'], expCsv:['CSV','CSV'],
  expView:['what you see now','زي ما هو ظاهر دلوقتي'], expAll:['ignores search and filters','من غير البحث والفلترة'],
  expPrint:['Print / PDF','طباعة / PDF'], expPrintHint:['opens the print window','بتفتح نافذة الطباعة'],
  dupCol:['Duplicate column','تكرار العمود'], copySuffix:['(copy)','نسخة'],
  sortAsc:['Sort A → Z (smallest first)','فرز تصاعدي'], sortDesc:['Sort Z → A (largest first)','فرز تنازلي'],
  colSettings:['Column settings','إعدادات العمود'], delCol:['Delete column','حذف العمود'],
  delRow:['Delete rows','حذف الصفوف'],
  sortedRows:['Rows follow the sort — press the highlighted sort button again to clear it first',
              'الصفوف مرتبة بالفرز — اضغط زرار الفرز المميّز تاني لإلغائه الأول']
};
const TYPES = [['text','Text','نص'], ['number','Number','رقم'], ['date','Date','تاريخ'],
               ['select','Choice list','قائمة اختيارات'], ['bool','Yes / No','صح / غلط'],
               ['project','Project','المشروع'], ['lookup','From project data','من بيانات المشروع'],
               ['formula','Formula','معادلة']];
const AGGS  = [['','None','بدون'], ['sum','Sum','المجموع'], ['avg','Average','المتوسط'],
               ['count','Count','العدد'], ['min','Min','الأصغر'], ['max','Max','الأكبر']];
const ALIGNS = [['','Auto','تلقائي'], ['left','Left','يسار'], ['center','Centre','وسط'], ['right','Right','يمين']];
const SIZES = [11, 12, 13, 14, 16, 18, 22];
function applyLang(){
  const i = en() ? 0 : 1;
  document.documentElement.lang = en() ? 'en' : 'ar';
  document.documentElement.dir  = en() ? 'ltr' : 'rtl';
  document.title = en() ? 'Sheets | Saudi Architects' : 'الجداول | المعماريون السعوديون';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = (I18N[el.dataset.i18n] || ['', ''])[i]);
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = (I18N[el.dataset.i18nPh] || ['', ''])[i]);
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = (I18N[el.dataset.i18nTitle] || ['', ''])[i]);
  const b = $('#btnLang'); if(b) b.textContent = en() ? 'Arabic' : 'English';
  const opts = (el, list) => { if(!el) return; const keep = el.value;
    el.innerHTML = list.map(([v, e2, a]) => `<option value="${v}">${en() ? e2 : a}</option>`).join('');
    el.value = keep; };
  opts($('#colType'), TYPES);
  opts($('#colAgg'), AGGS);
  opts($('#fmtAlign'), ALIGNS);
  const fs = $('#fmtSize');
  if(fs){ const keep = fs.value;
    fs.innerHTML = `<option value="">${U('Size', 'حجم')}</option>` + SIZES.map(s => `<option value="${s}">${s}</option>`).join('');
    fs.value = keep; }
}

/* ================= أدوات ================= */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = t => String(t == null ? '' : t).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function toast(msg, isErr){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 2800);
}
let BUSY = 0;
function busy(on){ BUSY = Math.max(0, BUSY + (on ? 1 : -1)); $('#loadBar').classList.toggle('on', BUSY > 0); }
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; };
const colLabel = c => (en() ? (c.label_en || c.label) : (c.label || c.label_en)) || c.key;
const fieldLabel = f => (en() ? (f.label_en || f.label) : f.label) || f.key;
const isCalc = c => c.type === 'formula' || c.type === 'lookup';

/* ================= المعادلات ================= */
const FN = {
  sum:(...a) => a.reduce((s, x) => s + num(x), 0),
  min:(...a) => Math.min(...a.map(num)), max:(...a) => Math.max(...a.map(num)),
  abs:x => Math.abs(num(x)), round:(x, n) => +num(x).toFixed(Math.max(0, Math.min(6, num(n)))),
  avg:(...a) => a.length ? a.reduce((s, x) => s + num(x), 0) / a.length : 0,
  if:(c, a, b) => c ? a : (b === undefined ? 0 : b)
};
function evalFormula(expr, vals){
  let i = 0; const s = String(expr || '');
  const ws = () => { while(i < s.length && /\s/.test(s[i])) i++; };
  const eat = t => { ws(); if(s.startsWith(t, i)){ i += t.length; return true; } return false; };
  function atom(){
    ws(); if(i >= s.length) throw 0;
    const ch = s[i];
    if(ch === '('){ i++; const v = cmp(); if(!eat(')')) throw 0; return v; }
    if(ch === '['){ const e = s.indexOf(']', i); if(e < 0) throw 0; const k = s.slice(i + 1, e).trim(); i = e + 1; return vals[k] != null ? vals[k] : 0; }
    if(/[0-9.]/.test(ch)){ let j = i; while(j < s.length && /[0-9.]/.test(s[j])) j++; const n = parseFloat(s.slice(i, j)); i = j; return n; }
    if(/[a-zA-Z_]/.test(ch)){
      let j = i; while(j < s.length && /[a-zA-Z0-9_]/.test(s[j])) j++;
      const name = s.slice(i, j).toLowerCase(); i = j;
      if(!eat('(')) throw 0;
      const args = [];
      if(!eat(')')){ for(;;){ args.push(cmp()); if(eat(',')) continue; if(eat(')')) break; throw 0; } }
      const fn = FN[name]; if(!fn) throw 0;
      return fn.apply(null, args);
    }
    throw 0;
  }
  function un(){ if(eat('-')) return -num(un()); if(eat('+')) return un(); return atom(); }
  function pw(){ const v = un(); if(eat('^')) return Math.pow(num(v), num(pw())); return v; }
  function mul(){ let v = pw(); for(;;){ if(eat('*')) v = num(v) * num(pw()); else if(eat('/')){ const d = num(pw()); v = d ? num(v) / d : 0; } else if(eat('%')){ const d = num(pw()); v = d ? num(v) % d : 0; } else return v; } }
  function add(){ let v = mul(); for(;;){ if(eat('+')) v = num(v) + num(mul()); else if(eat('-')) v = num(v) - num(mul()); else return v; } }
  function cmp(){
    const l = add();
    for(const op of ['>=', '<=', '<>', '!=', '=', '>', '<']){
      if(eat(op)){ const r = add(), a = num(l), b = num(r);
        return op === '>=' ? a >= b : op === '<=' ? a <= b : (op === '<>' || op === '!=') ? a !== b : op === '=' ? a === b : op === '>' ? a > b : a < b; }
    }
    return l;
  }
  try{
    const out = cmp(); ws();
    if(i < s.length) return null;
    return typeof out === 'boolean' ? (out ? 1 : 0) : (typeof out === 'number' ? +out.toFixed(6) : out);
  }catch(e){ return null; }
}

/* ================= الحالة ================= */
const S = {
  sheets:[], sheet:null, rows:[], total:0, page:0, per:200,
  sort:'', dir:'asc', q:'', filters:{}, showFilters:false, loaded:false,
  dirty:new Map(), dels:new Set(), lookup:{}, cols:new Set(), rowsSel:new Set()
};
const fmtNum = (v, dec, unit) => (v === null || v === undefined || v === '') ? ''
  : num(v).toLocaleString('en-US', {minimumFractionDigits:dec || 0, maximumFractionDigits:dec || 0}) + (unit ? ' ' + unit : '');

/* ================= الشبكة ================= */
function recalcRow(r){
  const cols = S.sheet.columns, vals = Object.assign({}, r.data);
  const pk = (cols.find(c => c.type === 'project') || {}).key;
  const rec = pk ? (S.lookup[vals[pk]] || null) : null;
  cols.forEach(c => { if(c.type === 'lookup') vals[c.key] = rec ? rec[c.source] : null; });
  for(let k = 0; k < 4; k++){
    let ch = false;
    cols.forEach(c => { if(c.type !== 'formula') return;
      const v = evalFormula(c.formula, vals);
      if(vals[c.key] !== v){ vals[c.key] = v; ch = true; } });
    if(!ch) break;
  }
  r.data = vals;
}
function shownValue(r, c){
  const v = r.data[c.key];
  if(v === null || v === undefined || v === '') return '';
  if(c.type === 'formula') return fmtNum(v, c.decimals, c.unit);
  const fld = FIELDS.find(f => f.key === c.source);
  if(fld && ['number','percent','currency','days'].includes(fld.type))
    return num(v).toLocaleString('en-US', {maximumFractionDigits:2}) + (fld.type === 'percent' ? '%' : '');
  return v;
}
/* ================= التنسيق (ألوان وخطوط) =================
   تنسيق العمود يتخزّن في تعريف العمود، وتنسيق الخلية في __fmt جوه بيانات الصف،
   وتنسيق الخلية بيغلب على تنسيق العمود. */
function effFmt(r, c){
  const cf = (r.data && r.data.__fmt) ? (r.data.__fmt[c.key] || null) : null;
  if(!c.fmt && !cf) return null;
  return Object.assign({}, c.fmt || {}, cf || {});
}
function fmtStyle(f){
  if(!f) return '';
  let s = '';
  if(f.bg) s += `background:${f.bg};`;
  if(f.fg) s += `color:${f.fg};`;
  if(f.bold) s += 'font-weight:700;';
  if(f.italic) s += 'font-style:italic;';
  if(f.under) s += 'text-decoration:underline;';
  if(f.size) s += `font-size:${f.size}px;`;
  if(f.align) s += `text-align:${f.align};`;
  return s;
}
function mergeFmt(base, patch){
  const f = Object.assign({}, base || {});
  Object.keys(patch).forEach(k => {
    const v = patch[k];
    if(v === null || v === false || v === '') delete f[k]; else f[k] = v;
  });
  return Object.keys(f).length ? f : null;
}
function touch(row){
  if(!String(row.id).startsWith('n')) S.dirty.set(row.id, row);
  $('#btnSave').disabled = false;
}
/** التنسيق بيتطبق على كل اللي محدد مع بعض: الأعمدة + الصفوف + مدى الخلايا */
function fmtHasTarget(){ return !!(S.cols.size || S.rowsSel.size || rng()); }
function applyFmt(patch, live){
  if(!S.sheet || !fmtHasTarget()) return;
  const cols = selCols(), rowsIdx = selRowIdx(), R = rng();
  const before = snap();
  let changed = false;
  if(cols.length){
    cols.forEach(c => { const f = mergeFmt(c.fmt, patch); if(f) c.fmt = f; else delete c.fmt; });
    changed = true;
  }
  const cells = new Map();                       // رقم الصف -> أرقام الأعمدة
  const add = (r, ci) => { if(!cells.has(r)) cells.set(r, new Set()); cells.get(r).add(ci); };
  rowsIdx.forEach(r => S.sheet.columns.forEach((c, ci) => add(r, ci)));
  if(R) for(let r = R.r1; r <= R.r2; r++) for(let ci = R.c1; ci <= R.c2; ci++) add(r, ci);
  cells.forEach((set, r) => {
    const row = S.rows[r]; if(!row) return;
    const fm = Object.assign({}, row.data.__fmt || {});
    set.forEach(ci => {
      const col = S.sheet.columns[ci]; if(!col) return;
      const nf = mergeFmt(fm[col.key], patch);
      if(nf) fm[col.key] = nf; else delete fm[col.key];
    });
    if(Object.keys(fm).length) row.data.__fmt = fm; else delete row.data.__fmt;
    touch(row);
    changed = true;
  });
  if(!changed) return;
  if(live) pushUndoLive(before); else commitUndo(before);
  if(cols.length) saveColumns(); else { renderGrid(); syncBars(); }
  scheduleSave();
}
/** أثناء سحب منتقي الألوان: لقطة تراجع واحدة لكل سلسلة */
let LIVE_U = 0;
function pushUndoLive(before){
  const now = Date.now();
  if(now - LIVE_U < 1500){ LIVE_U = now; return; }
  LIVE_U = now;
  commitUndo(before);
}
function curFmt(){
  if(!S.sheet) return {};
  if(S.cols.size){ const c = selCols()[0]; return (c && c.fmt) || {}; }
  const idx = selRowIdx(), R = rng();
  const r0 = idx.length ? idx[0] : (R ? R.r1 : -1);
  const c0 = idx.length && !R ? 0 : (R ? R.c1 : 0);
  const row = S.rows[r0], col = S.sheet.columns[c0];
  return (row && col && effFmt(row, col)) || {};
}

/* ================= التراجع والإعادة ================= */
const UNDO = [], REDO = [];
let LAST_U = {k:'', t:0};
function snap(){
  return JSON.stringify({rows:S.rows.map(r => ({id:r.id, data:r.data})),
                         cols:S.sheet ? S.sheet.columns : []});
}
function commitUndo(before){
  if(!S.sheet) return;
  UNDO.push(before);
  if(UNDO.length > 60) UNDO.shift();
  REDO.length = 0;
  LAST_U = {k:'', t:0};
  syncUndoBtns();
}
function pushUndo(){ if(S.sheet) commitUndo(snap()); }
/** لقطة واحدة لسلسلة كتابة متتالية في نفس الخلية بدل لقطة لكل حرف */
function pushUndoCell(key){
  const now = Date.now();
  if(key === LAST_U.k && now - LAST_U.t < 1500){ LAST_U.t = now; return; }
  pushUndo();
  LAST_U = {k:key, t:now};
}
function syncUndoBtns(){
  $('#btnUndo').disabled = !UNDO.length;
  $('#btnRedo').disabled = !REDO.length;
}
function applySnap(str){
  const o = JSON.parse(str);
  const colsChanged = JSON.stringify(S.sheet.columns) !== JSON.stringify(o.cols);
  S.sheet.columns = o.cols;
  const before = new Map(S.rows.map(r => [String(r.id), r]));
  const keep = new Set(o.rows.map(r => String(r.id)));
  // صف اتشال في اللقطة ولسه موجود = كان اتضاف بعدها، يتحذف
  before.forEach((r, id) => { if(!keep.has(id) && !id.startsWith('n')) S.dels.add(+id); });
  S.rows = o.rows.map(r0 => {
    const id = String(r0.id);
    const r = before.get(id) || {id:r0.id};
    r.data = JSON.parse(JSON.stringify(r0.data));
    recalcRow(r);
    if(!id.startsWith('n')){ S.dels.delete(+id); S.dirty.set(r.id, r); }

  S.rowsSel = new Set(Array.from(S.rowsSel).filter(id => keep.has(String(id))));

/* ================= صف المجاميع ================= */
function aggValue(c){
  if(!c.agg) return '';
  const vals = S.rows.map(r => r.data[c.key]).filter(v => v !== null && v !== undefined && v !== '' && v !== false);
  if(c.agg === 'count') return String(vals.length);
  const nums = vals.map(num);
  if(!nums.length) return '';
  let v;
  if(c.agg === 'sum') v = nums.reduce((a, b) => a + b, 0);
  else if(c.agg === 'avg') v = nums.reduce((a, b) => a + b, 0) / nums.length;
  else if(c.agg === 'min') v = Math.min.apply(null, nums);
  else if(c.agg === 'max') v = Math.max.apply(null, nums);
  else return '';
  const dec = c.decimals != null ? c.decimals : (c.agg === 'avg' ? 2 : 0);
  return fmtNum(v, Math.abs(v) < 1000 && v % 1 !== 0 ? Math.max(dec, 2) : dec, c.unit);
}

/* ================= شريط الحالة (زي إكسل) ================= */
function syncStatus(){
  const bar = $('#statusBar'); if(!bar) return;
  const R = rng();
  if(!R || !S.sheet){ bar.classList.remove('on'); bar.innerHTML = ''; return; }
  const nCells = (R.r2 - R.r1 + 1) * (R.c2 - R.c1 + 1);
  const nums = [];
  for(let r = R.r1; r <= R.r2; r++) for(let c = R.c1; c <= R.c2; c++){
    const row = S.rows[r], col = S.sheet.columns[c];
    if(!row || !col) continue;
    const v = row.data[col.key];
    if(v === null || v === undefined || v === '' || typeof v === 'boolean') continue;
    const n = parseFloat(String(v).replace(/,/g, ''));
    if(!isNaN(n) && /^[-+]?[\d,. ]+%?$/.test(String(v).trim())) nums.push(n);
  }
  const f = v => v.toLocaleString('en-US', {maximumFractionDigits:2});
  let html = `<span>${I18N.sel[en() ? 0 : 1]}: <b>${nCells}</b></span>`;
  if(nums.length){
    const sum = nums.reduce((a, b) => a + b, 0);
    html += `<span>${I18N.sum[en() ? 0 : 1]}: <b>${f(sum)}</b></span>`
          + `<span>${I18N.avg[en() ? 0 : 1]}: <b>${f(sum / nums.length)}</b></span>`
          + `<span>${I18N.minL[en() ? 0 : 1]}: <b>${f(Math.min.apply(null, nums))}</b></span>`
          + `<span>${I18N.maxL[en() ? 0 : 1]}: <b>${f(Math.max.apply(null, nums))}</b></span>`
          + `<span>${I18N.countL[en() ? 0 : 1]}: <b>${nums.length}</b></span>`;
  }
  bar.innerHTML = html;
  bar.classList.toggle('on', nCells > 1 || nums.length > 0);
}

      ? {r1:Math.min(R.r1, p.r), r2:Math.max(R.r2, p.r), c1:R.c1, c2:R.c2}

/* ---- متتاليات ذكية: 1,2,3… / تواريخ / "بند 1" ---- */
const DAY = 86400000;
const dayNum = v => { const t = Date.parse(String(v) + 'T00:00:00Z'); return isNaN(t) ? null : t / DAY; };
function seriesStep(col, vals){
  const clean = vals.filter(v => v !== null && v !== undefined && v !== '');
  if(!clean.length || clean.length !== vals.length) return null;
  if(col.type === 'number'){
    if(clean.length < 2) return null;                       // خلية واحدة: تكرار زي إكسل
    const d = num(clean[1]) - num(clean[0]);
    if(!d) return null;
    for(let i = 1; i < clean.length; i++) if(Math.abs((num(clean[i]) - num(clean[i - 1])) - d) > 1e-9) return null;
    return {kind:'num', step:d};
  }
  if(col.type === 'date'){
    const ds = clean.map(dayNum);
    if(ds.some(x => x === null)) return null;
    if(ds.length === 1) return {kind:'date', step:1};
    const d = ds[1] - ds[0];
    if(!d) return null;
    for(let i = 1; i < ds.length; i++) if(ds[i] - ds[i - 1] !== d) return null;
    return {kind:'date', step:d};
  }
  if(col.type === 'text'){
    const m = clean.map(v => String(v).match(/^(.*?)(\d+)(\D*)$/));
    if(m.some(x => !x)) return null;
    const pre = m[0][1], post = m[0][3], pad = m[0][2].length;
    if(m.some(x => x[1] !== pre || x[3] !== post)) return null;
    const ns = m.map(x => parseInt(x[2], 10));
    if(ns.length === 1) return {kind:'text', step:1, pre, post, pad};
    const d = ns[1] - ns[0];
    if(!d) return null;
    for(let i = 1; i < ns.length; i++) if(ns[i] - ns[i - 1] !== d) return null;
    return {kind:'text', step:d, pre, post, pad};
  }
  return null;
}
function seriesAt(vals, s, k, back){
  const base = back ? vals[0] : vals[vals.length - 1];
  const mul = (k + 1) * (back ? -1 : 1);
  if(s.kind === 'num') return num(base) + s.step * mul;
  if(s.kind === 'date') return new Date((dayNum(base) + s.step * mul) * DAY).toISOString().slice(0, 10);
  const m = String(base).match(/^(.*?)(\d+)(\D*)$/);
  let n = parseInt(m[2], 10) + s.step * mul;
  if(n < 0) n = 0;
  let str = String(n);
  while(str.length < s.pad) str = '0' + str;
  return s.pre + str + s.post;
}
/** يكرّر قيم المصدر على المدى المطلوب — ولو القيم متتالية بيكمّلها (زي السحب في إكسل) */
function applyFill(src, target, plain){
  if(!S.sheet) return;
  const before = snap();
  const vertical = (target.r1 < src.r1 || target.r2 > src.r2);
  const sw = src.c2 - src.c1 + 1;
  let n = 0;
  if(vertical){
    for(let c = src.c1; c <= src.c2; c++){
      const col = S.sheet.columns[c]; if(!col || isCalc(col)) continue;
      const vals = [];
      for(let r = src.r1; r <= src.r2; r++) vals.push(S.rows[r] ? S.rows[r].data[col.key] : '');
      const s = plain ? null : seriesStep(col, vals);
      for(let r = src.r2 + 1; r <= target.r2; r++){
        const k = r - src.r2 - 1;
        if(writeCell(r, c, s ? seriesAt(vals, s, k, false) : vals[k % vals.length])) n++;
      }
      for(let r = src.r1 - 1; r >= target.r1; r--){
        const k = src.r1 - r - 1;
        if(writeCell(r, c, s ? seriesAt(vals, s, k, true) : vals[vals.length - 1 - (k % vals.length)])) n++;
      }
    }
  }else{
    for(let r = src.r1; r <= src.r2; r++){
      const row = S.rows[r]; if(!row) continue;
      const val = sc => { const col = S.sheet.columns[sc]; return col ? row.data[col.key] : ''; };
      for(let c = src.c2 + 1; c <= target.c2; c++)
        if(writeCell(r, c, val(src.c1 + ((c - src.c2 - 1) % sw)))) n++;
      for(let c = src.c1 - 1; c >= target.c1; c--)
        if(writeCell(r, c, val(src.c2 - ((src.c1 - c - 1) % sw)))) n++;
    }
  }
  SEL = {r1:target.r1, c1:target.c1, r2:target.r2, c2:target.c2};
  renderGrid();
  if(n){ commitUndo(before); toast(U(`Filled ${n} cells`, `تم نسخ القيمة في ${n} خلية`)); scheduleSave(); }
  else toast(U('Nothing changed — the cells already hold the same value, or they are calculated',
               'مفيش حاجة اتغيرت — الخلايا فيها نفس القيمة أصلاً أو بتتحسب بمعادلة'));
}
/** يكتب قيمة في خلية حسب نوع عمودها؛ يرجّع true لو اتغيّرت */
function writeCell(ri, ci, raw){
  const row = S.rows[ri], col = S.sheet.columns[ci];
  if(!row || !col || isCalc(col)) return false;
  let v = raw;
  if(col.type === 'number'){                       // نص مش رقم = نسيبها فاضية مش صفر
    if(raw === '' || raw === null || raw === undefined) v = null;
    else { const n = parseFloat(String(raw).replace(/,/g, '')); v = isNaN(n) ? null : n; }
  }
  else if(col.type === 'bool') v = !!(raw === true || raw === 1 || /^(1|true|yes|نعم|صح)$/i.test(String(raw || '')));
  else if(col.type === 'project') v = PROJECTS.includes(String(raw)) ? String(raw) : (raw ? String(raw) : '');
  else if(col.type === 'select') v = (col.options || []).includes(String(raw)) ? String(raw) : '';
  else v = (raw === null || raw === undefined) ? '' : String(raw);

function caretAtEdge(el, dir){

  try{
    const p = el.selectionStart, q = el.selectionEnd;

function onCellEdit(inp){

/* ================= السحب والإفلات ================= */
let DRAG = null;
function bindDnd(){
  $$('#wrap th[data-col]').forEach(th => {
    th.addEventListener('dragstart', e => {
      DRAG = {kind:'col', key:th.dataset.col};
      e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', th.dataset.col);
    });
    th.addEventListener('dragover', e => {
      if(!DRAG || DRAG.kind !== 'col') return;
      e.preventDefault();
      const r = th.getBoundingClientRect();
      const before = en() ? (e.clientX < r.left + r.width / 2) : (e.clientX > r.left + r.width / 2);
      th.classList.toggle('drop-before', before); th.classList.toggle('drop-after', !before);
    });
    th.addEventListener('dragleave', () => th.classList.remove('drop-before', 'drop-after'));
    th.addEventListener('drop', e => {
      e.preventDefault();
      const before = th.classList.contains('drop-before');
      th.classList.remove('drop-before', 'drop-after');
      if(!DRAG || DRAG.kind !== 'col' || DRAG.key === th.dataset.col) return;
      moveColumnTo(DRAG.key, th.dataset.col, before);
      DRAG = null;
    });
  });
  $$('#wrap tbody tr[data-id]').forEach(tr => {
    tr.addEventListener('dragstart', e => {
      if(!GRIP){ e.preventDefault(); return; }          // السحب من وسط الصف = تحديد خلايا
      if(S.sort){ e.preventDefault(); toast(I18N.sortedRows[en() ? 0 : 1]); return; }
      DRAG = {kind:'row', id:tr.dataset.id}; tr.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', tr.dataset.id);
    });
    tr.addEventListener('dragend', () => tr.classList.remove('dragging'));
    tr.addEventListener('dragover', e => {
      if(!DRAG || DRAG.kind !== 'row') return;
      e.preventDefault(); tr.classList.add('drag-over');
    });
    tr.addEventListener('dragleave', () => tr.classList.remove('drag-over'));
    tr.addEventListener('drop', e => {
      e.preventDefault(); tr.classList.remove('drag-over');
      if(!DRAG || DRAG.kind !== 'row' || DRAG.id === tr.dataset.id) return;
      moveRowTo(DRAG.id, tr.dataset.id); DRAG = null;
    });
  });
}
function moveColumnTo(key, targetKey, before){
  const cols = S.sheet.columns;
  const from = cols.findIndex(c => c.key === key);
  const col = cols.splice(from, 1)[0];
  let to = cols.findIndex(c => c.key === targetKey);
  if(!before) to += 1;
  cols.splice(to, 0, col);
  saveColumns();
}
function moveRowTo(id, targetId){
  const from = S.rows.findIndex(r => String(r.id) === String(id));
  const row = S.rows.splice(from, 1)[0];
  const to = S.rows.findIndex(r => String(r.id) === String(targetId));
  S.rows.splice(to, 0, row);

async function saveOrder(){

                        .map((r, i) => ({id:r.id, seq:S.page * S.per + i + 1}));

  await api(`/api/sheets/${S.sheet.id}/rows`, {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({reorder})});

/** نسخة من العمود المحدد تنزل جنبه على طول — بنفس النوع والعرض والتنسيق والمعادلة والبيانات */
function duplicateColumns(){
  if(!S.sheet) return;
  const cols = S.sheet.columns;
  const idx = cols.map((c, i) => S.cols.has(c.key) ? i : -1).filter(i => i >= 0);
  if(!idx.length) return;
  pushUndo();
  const newKeys = [];
  let n = 0;
  idx.slice().sort((a, b) => b - a).forEach(i => {
    const src = cols[i];
    const key = 'c' + (cols.length + 1 + (n++)) + Math.random().toString(36).slice(2, 5);
    const copy = JSON.parse(JSON.stringify(src));
    copy.key = key;
    copy.label    = 'نسخة من ' + (src.label || src.label_en || src.key);
    copy.label_en = (src.label_en || src.label || src.key) + ' (copy)';
    cols.splice(i + 1, 0, copy);
    newKeys.push(key);
    if(!isCalc(src)) S.rows.forEach(r => {                 // البيانات وتنسيق الخلايا كمان
      let hit = false;
      const v = r.data[src.key];
      if(v !== undefined && v !== null && v !== ''){ r.data[key] = v; hit = true; }
      const fm = r.data.__fmt;
      if(fm && fm[src.key]){ fm[key] = JSON.parse(JSON.stringify(fm[src.key])); hit = true; }
      if(hit) touch(r);
    });
  });
  S.cols = new Set(newKeys);
  saveColumns();
  scheduleSave();
  toast(U(newKeys.length === 1 ? 'Column duplicated' : `${newKeys.length} columns duplicated`,
          newKeys.length === 1 ? 'تم تكرار العمود' : `تم تكرار ${newKeys.length} أعمدة`));
}

/** عمود جديد جنب العمود المحدد */
function insertColumn(dir){
  if(!S.sheet) return;
  const cols = S.sheet.columns;
  const idx = cols.map((c, i) => S.cols.has(c.key) ? i : -1).filter(i => i >= 0);
  if(!idx.length) return addColumn();
  const at = dir < 0 ? Math.min.apply(null, idx) : Math.max.apply(null, idx) + 1;
  pushUndo();
  const n = cols.length + 1;
  const key = 'c' + n + Math.random().toString(36).slice(2, 5);
  cols.splice(at, 0, {key, type:'text', label:'عمود ' + n, label_en:'Column ' + n, width:150});
  S.cols = new Set([key]);
  saveColumns();
  const inp = $('#colName'); if(inp){ inp.focus(); inp.select(); }
}
function shiftCols(dir){
  const cols = S.sheet.columns;
  const idx = cols.map((c, i) => S.cols.has(c.key) ? i : -1).filter(i => i >= 0);
  if(!idx.length) return;
  const order = dir < 0 ? idx : idx.slice().reverse();
  for(const i of order){
    const j = i + dir;
    if(j < 0 || j >= cols.length || S.cols.has(cols[j].key)) continue;
    const t = cols[i]; cols[i] = cols[j]; cols[j] = t;
  }
  saveColumns();
}

function selRowIdx(){ return S.rows.map((r, i) => S.rowsSel.has(String(r.id)) ? i : -1).filter(i => i >= 0); }
function shiftRows(dir){

  const order = dir < 0 ? idx : idx.slice().reverse();
  for(const i of order){
    const j = i + dir;
    if(j < 0 || j >= S.rows.length || S.rowsSel.has(String(S.rows[j].id))) continue;
    const t = S.rows[i]; S.rows[i] = S.rows[j]; S.rows[j] = t;
  }

async function duplicateRows(){

/* ================= السيرفر ================= */
async function api(url, opts){
  busy(true);
  try{
    const r = await fetch(url, opts);
    const j = await r.json().catch(() => ({success:false, error:'bad response'}));
    if(!j.success && j.error) toast(j.error, true);
    return j;
  }catch(e){ toast(String(e.message || e), true); return {success:false}; }
  finally{ busy(false); }
}
async function loadLatest(){
  const j = await api('/api/sheets/_latest');
  if(j && j.success) S.lookup = j.latest || {};
}
async function loadSheets(keepId){
  const j = await api('/api/sheets');
  if(!j.success){ S.loaded = true; renderGrid(); return; }
  S.loaded = true;
  S.sheets = j.sheets || [];
  const sel = $('#sheetSel');
  sel.innerHTML = S.sheets.map(s => `<option value="${s.id}">${esc(en() ? (s.name_en || s.name) : s.name)}</option>`).join('');
  const want = keepId || (S.sheet && S.sheet.id) || (S.sheets[0] && S.sheets[0].id);
  if(want){ sel.value = want; await openSheet(want); }
  else { S.sheet = null; renderGrid(); $('#sheetName').textContent = '—'; syncBars(); }
}
async function openSheet(id){
  S.page = 0; S.sort = ''; S.dir = 'asc'; S.q = ''; S.filters = {}; $('#search').value = '';
  S.dirty.clear(); S.dels.clear(); S.cols.clear(); S.rowsSel.clear(); $('#btnSave').disabled = true;
  const meta = S.sheets.find(s => String(s.id) === String(id));
  S.sheet = meta ? JSON.parse(JSON.stringify(meta)) : null;
  $('#sheetName').textContent = meta ? (en() ? (meta.name_en || meta.name) : meta.name) : '—';
  await loadRows(); syncBars();
}
async function loadRows(){
  if(!S.sheet){ renderGrid(); return; }
  const p = new URLSearchParams({q:S.q, sort:S.sort, dir:S.dir, limit:S.per, offset:S.page * S.per,
                                filters:JSON.stringify(S.filters)});
  const j = await api(`/api/sheets/${S.sheet.id}/rows?` + p.toString());
  if(!j.success) return;
  S.sheet = j.sheet; S.rows = j.rows || []; S.total = j.total || 0;
  S.rowsSel = new Set(Array.from(S.rowsSel).filter(id => S.rows.some(r => String(r.id) === id)));
  if(SEL && (SEL.r1 >= S.rows.length || SEL.r2 >= S.rows.length)) SEL = null;
  if(!Object.keys(S.lookup).length) loadLatest();
  renderGrid(); updatePager(); syncBars();
}
function updatePager(){
  const from = S.total ? S.page * S.per + 1 : 0, to = Math.min(S.total, (S.page + 1) * S.per);
  $('#rowCount').textContent = S.total ? U(`${from}–${to} of ${S.total}`, `${from}–${to} من ${S.total}`) : U('No rows', 'لا توجد صفوف');
  $('#pageLbl').textContent = S.total ? `${S.page + 1} / ${Math.max(1, Math.ceil(S.total / S.per))}` : '';
  $('#btnPrev').disabled = S.page <= 0;
  $('#btnNext').disabled = (S.page + 1) * S.per >= S.total;
}
function hasPending(){ return S.dirty.size > 0 || S.dels.size > 0 || S.rows.some(r => String(r.id).startsWith('n')); }
/* الحفظ يمشي واحد ورا التاني (مش أكتر من طلب في نفس الوقت)، والصف الجديد بياخد رقمه
   من السيرفر على طول — عشان ما يتبعتش تاني في الحفظ اللي بعده فيتكرر أو تتبدّل الصفوف */
let SAVE_LOCK = Promise.resolve();
function saveChanges(skipReload){
  const p = SAVE_LOCK.then(() => doSave(skipReload));
  SAVE_LOCK = p.then(() => {}, () => {});
  return p;
}
async function doSave(skipReload){
  if(!S.sheet) return true;
  clearTimeout(markDirty._t);
  const addRows = S.rows.filter(r => String(r.id).startsWith('n'));
  const add = addRows.map(r => ({data:r.data}));
  const update = Array.from(S.dirty.values()).map(r => ({id:r.id, data:r.data}));
  const del = Array.from(S.dels);
  if(!add.length && !update.length && !del.length){ $('#btnSave').disabled = true; return true; }
  S.dirty.clear(); S.dels.clear();
  const j = await api(`/api/sheets/${S.sheet.id}/rows`, {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({add, update, delete:del})});
  if(!j.success){
    update.forEach(u => { const r = S.rows.find(x => String(x.id) === String(u.id)); if(r) S.dirty.set(r.id, r); });
    del.forEach(id => S.dels.add(id));
    return false;
  }
  // ربط الصفوف الجديدة بأرقامها الحقيقية من غير إعادة رسم (عشان مكان الكتابة ما يضيعش)
  (j.ids || []).forEach((newId, i) => {
    const r = addRows[i]; if(!r || newId == null) return;
    const old = String(r.id);
    r.id = newId;
    const tr = $(`#wrap tr[data-id="${old}"]`);
    if(tr){
      tr.dataset.id = newId; tr.classList.remove('dirty');
      const cb = tr.querySelector('[data-rowsel]'); if(cb) cb.dataset.rowsel = newId;
    }
    if(S.rowsSel.has(old)){ S.rowsSel.delete(old); S.rowsSel.add(String(newId)); }
  });
  $('#btnSave').disabled = hasPending() ? false : true;
  $('#savedAt').textContent = U('Saved ', 'تم الحفظ ') + new Date().toLocaleTimeString(en() ? 'en-GB' : 'ar-EG', {hour:'2-digit', minute:'2-digit'});
  if(!skipReload) await loadRows();
  return true;
}
async function refresh(){
  if(hasPending() && !(await saveChanges(true))){
    toast(U('Could not save your changes — nothing was reloaded', 'تعذّر حفظ تعديلاتك — لم يُعد التحميل'), true);
    return;
  }
  await loadRows();
}

/* ================= التصدير والطباعة ================= */
const sheetTitle = () => !S.sheet ? '' : (en() ? (S.sheet.name_en || S.sheet.name) : (S.sheet.name || S.sheet.name_en));
function printValue(r, c){
  if(isCalc(c)) return shownValue(r, c);
  const v = r.data[c.key];
  if(v === null || v === undefined || v === '') return '';
  if(c.type === 'bool') return v ? U('Yes', 'نعم') : U('No', 'لا');
  if(c.type === 'number') return fmtNum(v, c.decimals, c.unit);
  return String(v);
}
/** بيبني نسخة نضيفة للطباعة: من غير خانات إدخال ولا أزرار، ورأس الجدول بيتكرر كل صفحة */
function buildPrint(){
  if(!S.sheet) return;
  const cols = S.sheet.columns;
const isNumCol = c => c.type === 'number' || c.type === 'formula'
    || (c.type === 'lookup' && ['number', 'percent', 'currency', 'days'].includes((FIELDS.find(f => f.key === c.source) || {}).type));
  const nc = c => isNumCol(c) ? ' class="num"' : '';
  const head = `<tr><th class="pnum">#</th>${cols.map(c => `<th${nc(c)}>${esc(colLabel(c))}</th>`).join('')}</tr>`;
  const body = S.rows.map((r, i) => `<tr><td class="pnum">${S.page * S.per + i + 1}</td>${
    cols.map(c => { const st = fmtStyle(effFmt(r, c));
      return `<td${nc(c)}${st ? ` style="${st}"` : ''}>${esc(printValue(r, c))}</td>`; }).join('')}</tr>`).join('');
  const foot = cols.some(c => c.agg) ? `<tfoot><tr><td class="pnum">Σ</td>${cols.map(c => {
      const v = aggValue(c);
      return `<td${nc(c)}>${v === '' ? '' : esc(aggLabel(c.agg) + ' ' + v)}</td>`; }).join('')}</tr></tfoot>` : '';
  const filtered = S.q || Object.values(S.filters).some(v => v);
  const from = S.total ? S.page * S.per + 1 : 0, to = Math.min(S.total, (S.page + 1) * S.per);
  const bits = [new Date().toLocaleString(en() ? 'en-GB' : 'ar-EG'),
                U(`rows ${from}–${to} of ${S.total}`, `الصفوف ${from}–${to} من ${S.total}`)];
  if(filtered) bits.push(U('filtered view', 'حسب الفلترة الظاهرة'));
  $('#printArea').innerHTML = `<div class="pr-head"><h1>${esc(sheetTitle())}</h1>
      <small>${esc(bits.join('  ·  '))}</small></div>
    <table class="pr"><thead>${head}</thead><tbody>${body}</tbody>${foot}</table>`;
  const wide = cols.length > 5 || cols.reduce((t, c) => t + (+c.width || 150), 0) > 760;   // أعمدة كتير = ورق أفقي
  let st = document.getElementById('pageStyle');
  if(!st){ st = document.createElement('style'); st.id = 'pageStyle'; document.head.appendChild(st); }
  st.textContent = `@page{size:A4 ${wide ? 'landscape' : 'portrait'}; margin:12mm;}`;
}

$('#cellCopy').addEventListener('click', async () => {

  catch(e){ toast(U('Use Ctrl+C to copy', 'استخدم Ctrl+C للنسخ'), true); }
});
$('#cellClear').addEventListener('click', clearCells);
/* تكرار لتحت / للجنب:
   - محدد مدى  → بيملاه من أول صف (أو أول عمود) في المدى
   - محدد خلية واحدة → بينزل بقيمتها لآخر الجدول (أو للجنب لآخر عمود) — نفس اتجاه السحب */
const cellVal = (r, ci) => { const row = S.rows[r], col = S.sheet.columns[ci];
                             return row && col ? row.data[col.key] : null; };
function rangeEmpty(R){
  for(let r = R.r1; r <= R.r2; r++) for(let ci = R.c1; ci <= R.c2; ci++){
    const v = cellVal(r, ci);
    if(v !== null && v !== undefined && v !== '' && v !== false) return false;
  }
  return true;
}
$('#cellFillDown').addEventListener('click', () => {
  const R = rng(); if(!R || !S.sheet) return;
  if(R.r1 === R.r2){
    const src = {r1:R.r1, r2:R.r1, c1:R.c1, c2:R.c2};
    if(rangeEmpty(src)){ toast(U('This cell is empty — nothing to copy down', 'الخلية فاضية — مفيش قيمة نكررها')); return; }
    if(R.r1 >= S.rows.length - 1){ toast(U('There are no rows below it', 'مفيش صفوف تحتها')); return; }
    applyFill(src, {r1:R.r1, r2:S.rows.length - 1, c1:R.c1, c2:R.c2}, true);
    return;
  }
  applyFill({r1:R.r1, r2:R.r1, c1:R.c1, c2:R.c2}, R, true);
});
$('#cellFillRight').addEventListener('click', () => {
  const R = rng(); if(!R || !S.sheet) return;
  const last = S.sheet.columns.length - 1;
  if(R.c1 === R.c2){
    const src = {r1:R.r1, r2:R.r2, c1:R.c1, c2:R.c1};
    if(rangeEmpty(src)){ toast(U('This cell is empty — nothing to copy across', 'الخلية فاضية — مفيش قيمة نكررها')); return; }
    if(R.c1 >= last){ toast(U('There are no columns beside it', 'مفيش أعمدة جنبها')); return; }
    applyFill(src, {r1:R.r1, r2:R.r2, c1:R.c1, c2:last}, true);
    return;
  }
  applyFill({r1:R.r1, r2:R.r2, c1:R.c1, c2:R.c1}, R, true);
});

/* اللون بيتغير وانت بتختاره من المنتقي، مش بعد ما تقفله */
const liveColor = (el, key) => {
  let t = 0;
  el.addEventListener('input', e => {
    clearTimeout(t);
    const v = e.target.value;
    t = setTimeout(() => applyFmt({[key]:v}, true), 90);
  });
  el.addEventListener('change', e => { clearTimeout(t); applyFmt({[key]:e.target.value}, true); });
};

$('#fmtNone').addEventListener('click', () => {
  const R = rng(), rowsOn = S.rowsSel.size, colsOn = S.cols.size;
  applyFmt({bold:null, italic:null, under:null, size:null, align:null, fg:null, bg:null});
  if(!colsOn && (R || rowsOn) && S.sheet){                 // ألوان جاية من تنسيق العمود نفسه؟
    const cs = new Set();
    if(rowsOn) S.sheet.columns.forEach(c => cs.add(c));
    if(R) for(let i = R.c1; i <= R.c2; i++) cs.add(S.sheet.columns[i]);
    if(Array.from(cs).some(c => c && c.fmt))
      toast(U('Some of this colouring comes from the column itself — tick the column to clear it',
              'فيه ألوان جاية من تنسيق العمود نفسه — علّم على العمود عشان تمسحها'));
  }
});

$('#btnFreeze').addEventListener('click', async () => {
  if(!S.sheet) return;

  renderGrid(); syncBars();
  const meta = S.sheets.find(x => String(x.id) === String(S.sheet.id));
  if(meta) meta.settings = JSON.parse(JSON.stringify(S.sheet.settings));
  await api(`/api/sheets/${S.sheet.id}`, {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({settings:S.sheet.settings})});

/* ---- تراجع وإعادة ---- */
$('#btnUndo').addEventListener('click', undo);
$('#btnRedo').addEventListener('click', redo);
$('#fillHandle').addEventListener('mousedown', startFill);
$('#wrap').addEventListener('scroll', () => placeHandle());
window.addEventListener('resize', () => placeHandle());
document.addEventListener('copy', e => {
  const R = rng();
  if(!R || (R.r1 === R.r2 && R.c1 === R.c2)) return;        // خلية واحدة: النسخ العادي
  e.clipboardData.setData('text/plain', selValues());
  e.preventDefault();
});
document.addEventListener('paste', e => {
  if(!SEL || !S.sheet) return;
  const txt = (e.clipboardData || window.clipboardData).getData('text');
  if(!txt) return;
  const multi = /[\t\n]/.test(txt.replace(/\n$/, ''));
  const inInput = document.activeElement && /input|textarea/i.test(document.activeElement.tagName)
                  && document.activeElement.closest('#wrap');
  if(!multi && inInput) return;                              // قيمة واحدة داخل خانة: لصق عادي
  e.preventDefault();
  pasteValues(txt);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    $$('.modal-back.open').forEach(m => m.classList.remove('open'));
    closePop(); closeExportMenu();
    if(S.cols.size || S.rowsSel.size) clearSelection();
    if(SEL){ SEL = null; paintSel(); }
  }
  const ctrl = e.ctrlKey || e.metaKey;
  const k = (e.key || '').toLowerCase();
  if(ctrl && k === 's'){ e.preventDefault(); saveChanges(); return; }
  if(ctrl && k === 'z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
  if(ctrl && (k === 'y' || (k === 'z' && e.shiftKey))){ e.preventDefault(); redo(); return; }
  if(ctrl && k === 'd'){ e.preventDefault(); $('#cellFillDown').click(); return; }
  if(ctrl && k === 'r' && e.shiftKey){ e.preventDefault(); $('#cellFillRight').click(); return; }
  if(ctrl && (k === 'b' || k === 'i' || k === 'u') && (S.cols.size || S.rowsSel.size || SEL)){
    e.preventDefault();
    const f = curFmt();
    applyFmt(k === 'b' ? {bold:!f.bold} : k === 'i' ? {italic:!f.italic} : {under:!f.under});
    return;
  }
  const ae = document.activeElement;
  const inFilter = !!(ae && ae.dataset && ae.dataset.filter);
  const inWrap = !!(ae && ae.closest && ae.closest('#wrap'));
  const typing = !!(ae && /input|textarea|select/i.test(ae.tagName) && !inWrap);
  const R = rng();
  if((e.key === 'Delete' || e.key === 'Backspace') && R && !(R.r1 === R.r2 && R.c1 === R.c2) && !inFilter){
    const inInput = ae && /input|textarea/i.test(ae.tagName);
    if(!inInput || !ae.value){ e.preventDefault(); clearCells(); }
  }
  if(!SEL || !S.sheet || inFilter || typing) return;
  if(ctrl && k === 'a'){
    e.preventDefault();
    SEL = {r1:0, c1:0, r2:S.rows.length - 1, c2:S.sheet.columns.length - 1};
    paintSel(); return;
  }
  const rtl = document.documentElement.dir === 'rtl' ? -1 : 1;
  const step = (dr, dc) => {
    e.preventDefault();
    if(e.shiftKey && (e.key.indexOf('Arrow') === 0)){
      setSel(Math.max(0, Math.min(S.rows.length - 1, SEL.r2 + dr)),
             Math.max(0, Math.min(S.sheet.columns.length - 1, SEL.c2 + dc)), true);
    }else focusCell(SEL.r1 + dr, SEL.c1 + dc, true);
  };
  if(e.key === 'ArrowDown')  return step(ctrl ? S.rows.length : 1, 0);
  if(e.key === 'ArrowUp')    return step(ctrl ? -S.rows.length : -1, 0);
  if(e.key === 'Enter')      return step(e.shiftKey ? -1 : 1, 0);
  if(e.key === 'Tab')        return step(0, e.shiftKey ? -1 : 1);   // Tab بيمشي مع ترتيب الأعمدة مش مع اتجاه الشاشة
  if(e.key === 'ArrowRight' && (ctrl || caretAtEdge(ae, rtl > 0 ? 1 : -1))) return step(0, ctrl ? S.sheet.columns.length * rtl : rtl);
  if(e.key === 'ArrowLeft'  && (ctrl || caretAtEdge(ae, rtl > 0 ? -1 : 1))) return step(0, ctrl ? -S.sheet.columns.length * rtl : -rtl);
  if(e.key === 'Home' && ctrl) return step(-S.rows.length, -S.sheet.columns.length);
  if(e.key === 'End'  && ctrl) return step(S.rows.length, S.sheet.columns.length);
  if(e.key === 'F2'){ e.preventDefault(); focusCell(SEL.r1, SEL.c1, true); }
});
document.addEventListener('cut', e => {
  const R = rng();
  if(!R || (R.r1 === R.r2 && R.c1 === R.c2)) return;
  const ae = document.activeElement;
  if(ae && /input|textarea/i.test(ae.tagName) && ae.selectionStart !== ae.selectionEnd) return;
  e.clipboardData.setData('text/plain', selValues());
  e.preventDefault();
  clearCells();
});
$('#btnLang').addEventListener('click', () => {
  UIL = en() ? 'ar' : 'en';
  try{ localStorage.setItem(UI_KEY, UIL); }catch(e){}
  applyLang(); renderGrid(); updatePager(); syncBars(); syncStatus();
  if(S.sheet) $('#sheetName').textContent = en() ? (S.sheet.name_en || S.sheet.name) : S.sheet.name;
});

applyLang();
loadSheets();

<script>
/* انتهاء الجلسة: أي رد 401/403 من السيرفر معناه إن الجلسة خلصت —
   نقول للمستخدم ونحوّله لصفحة الدخول بدل رسالة «غير مصرح» الغامضة */
(function(){
  if(window.__pmisAuthGuard) return;
  window.__pmisAuthGuard = true;
  var LOGIN = '/admin', gone = false;
  var MSG = {ar:'انتهت الجلسة — يتم تحويلك لصفحة الدخول…', en:'Your session has expired — taking you to the sign-in page…'};
  function expired(){
    if(gone) return; gone = true;
    var isEn = (document.documentElement.lang === 'en');
    var msg = isEn ? MSG.en : MSG.ar;
    try{
      if(typeof toast === 'function'){
        var real = toast;
        window.toast = function(){ real(msg, true); };
        real(msg, true);
      }else alert(msg);
    }catch(e){}
    try{ window.onbeforeunload = null; }catch(e){}
    setTimeout(function(){ location.href = LOGIN; }, 1800);
  }
  var nativeFetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    var u = String((input && input.url) || input || '');
    return nativeFetch(input, init).then(function(r){
      try{
        var sameSite = !/^https?:\/\//.test(u) || u.indexOf(location.origin) === 0;
        if((r.status === 401 || r.status === 403) && sameSite) expired();
      }catch(e){}
      return r;
    });
  };
  window.pmisSessionExpired = expired;
})();
</script>
