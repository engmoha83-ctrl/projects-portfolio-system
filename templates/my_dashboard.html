<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُنشئ الداشبورد | المعماريون السعوديون</title>
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;700&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- مكتبة Gridstack للسحب والإفلات وتغيير الحجم -->
    <link href="https://cdn.jsdelivr.net/npm/gridstack@7.2.3/dist/gridstack.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@7.2.3/dist/gridstack-all.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <style>
        :root { --main-bg: #f4f7f6; --canvas-bg: #ffffff; --title-color: #1a2b4c; --title-font: 'Tajawal', sans-serif; }
        body { background-color: var(--main-bg); overflow-x: hidden; font-family: var(--title-font); margin: 0; }
        
        /* تصميم الشريط الجانبي */
        .sidebar {
            position: fixed; top: 0; right: 0; width: 300px; height: 100vh;
            background: #1a2b4c; color: white; padding: 20px; overflow-y: auto;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1); z-index: 1000;
        }
        .main-content { margin-right: 300px; padding: 20px; min-height: 100vh; background-color: var(--canvas-bg); transition: background 0.3s; }
        
        .sidebar h5 { border-bottom: 1px solid #344a71; padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #a9b4c9; }
        .form-control, .form-select { font-size: 0.85rem; }
        
        /* عناصر السحب في الشريط الجانبي */
        .draggable-item {
            background: #2b3958; border: 1px dashed #4e658e; padding: 10px;
            border-radius: 5px; margin-bottom: 10px; cursor: grab; text-align: center;
        }
        
        /* تصميم الـ Visuals (Grid Items) */
        .grid-stack-item-content {
            background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 15px; overflow: hidden; border: 1px solid transparent; transition: border 0.3s;
        }
        .grid-stack-item-content:hover { border: 1px solid #d4a373; }
        .visual-header { display: flex; justify-content: space-between; align-items: center; cursor: move; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 10px; }
        .remove-btn { color: #dc3545; cursor: pointer; font-size: 1.2rem; background: none; border: none; }
        
        /* العنوان الديناميكي */
        #dash-title-container {
            text-align: center; padding: 15px; border-radius: 8px; margin-bottom: 20px;
            background-color: transparent; color: var(--title-color); font-family: var(--title-font);
        }
    </style>
</head>
<body>

    <!-- الشريط الجانبي للتحكم -->
    <div class="sidebar">
        <h5>🛠️ أدوات بناء الداشبورد</h5>
        
        <!-- 1. إعدادات الصفحة والعنوان -->
        <div class="control-group">
            <label>عنوان الداشبورد</label>
            <input type="text" id="dashTitleInput" class="form-control" value="لوحة تحكم المشروع" onkeyup="updateTitle()">
        </div>
        
        <div class="row">
            <div class="col-6 control-group">
                <label>نوع الخط</label>
                <select id="fontSelect" class="form-select" onchange="updateTheme()">
                    <option value="'Tajawal', sans-serif">تجوّل</option>
                    <option value="'Cairo', sans-serif">كايرو</option>
                    <option value="'Almarai', sans-serif">المراعي</option>
                </select>
            </div>
            <div class="col-6 control-group">
                <label>لون الخط</label>
                <input type="color" id="titleColorInput" class="form-control form-control-color w-100" value="#1a2b4c" onchange="updateTheme()">
            </div>
        </div>

        <div class="row">
            <div class="col-6 control-group">
                <label>خلفية العنوان</label>
                <input type="color" id="titleBgInput" class="form-control form-control-color w-100" value="#ffffff" onchange="updateTheme()">
            </div>
            <div class="col-6 control-group">
                <label>خلفية الصفحة (Canvas)</label>
                <input type="color" id="canvasBgInput" class="form-control form-control-color w-100" value="#f4f7f6" onchange="updateTheme()">
            </div>
        </div>

        <hr style="border-color:#344a71">

        <!-- 2. إضافة الـ Visuals -->
        <h5>📊 إضافة قوالب (Visuals)</h5>
        <div class="draggable-item" onclick="addVisual('kpi')">➕ إضافة أرقام (KPIs)</div>
        <div class="draggable-item" onclick="addVisual('barChart')">➕ إضافة رسم بياني (Bar)</div>
        <div class="draggable-item" onclick="addVisual('textBlock')">➕ إضافة نص حر</div>
        
        <hr style="border-color:#344a71">

        <!-- 3. أدوات إضافية -->
        <button class="btn btn-warning w-100 mb-2" onclick="alert('سيتم تفعيل الطباعة المطابقة بعد ربط إحداثيات Gridstack بـ jsPDF')">📄 استخراج PDF (قريباً)</button>
        <button class="btn btn-outline-light w-100" onclick="saveLayout()">💾 حفظ التصميم</button>
    </div>

    <!-- مساحة العمل الرئيسية -->
    <div class="main-content">
        <div id="dash-title-container">
            <h2 id="dashTitleDisplay" style="margin:0; font-weight:800;">لوحة تحكم المشروع</h2>
        </div>

        <!-- شبكة Gridstack للسحب والإفلات -->
        <div class="grid-stack"></div>
    </div>

    <script>
        // تهيئة محرك Gridstack
        let grid = GridStack.init({
            cellHeight: 100,
            margin: 10,
            resizable: { handles: 'e, se, s, sw, w' }, // تفعيل تغيير الحجم من الحواف
            float: true // السماح بترك مساحات فارغة (حرية الإفلات)
        });

        // دوال تغيير السمات (Themes) والألوان
        function updateTitle() {
            document.getElementById('dashTitleDisplay').innerText = document.getElementById('dashTitleInput').value;
        }

        function updateTheme() {
            const font = document.getElementById('fontSelect').value;
            const titleColor = document.getElementById('titleColorInput').value;
            const titleBg = document.getElementById('titleBgInput').value;
            const canvasBg = document.getElementById('canvasBgInput').value;

            document.documentElement.style.setProperty('--title-font', font);
            document.documentElement.style.setProperty('--title-color', titleColor);
            document.documentElement.style.setProperty('--canvas-bg', canvasBg);
            
            const titleContainer = document.getElementById('dash-title-container');
            titleContainer.style.backgroundColor = titleBg;
        }

        // دالة إضافة Visuals ديناميكياً
        let widgetCount = 0;
        function addVisual(type) {
            widgetCount++;
            let widgetId = 'widget_' + widgetCount;
            let contentHtml = '';
            let defaultWidth = 4, defaultHeight = 3;

            if(type === 'kpi') {
                contentHtml = `
                    <div class="visual-header"><strong>مؤشر أداء (KPI)</strong> <button class="remove-btn" onclick="removeWidget(this)">×</button></div>
                    <div style="text-align:center; margin-top:20px;">
                        <div style="font-size:0.9rem; color:#888;">الإنجاز الفعلي</div>
                        <div style="font-size:2.5rem; font-weight:bold; color:#1e8e5a;">75.4%</div>
                    </div>`;
                defaultWidth = 3; defaultHeight = 2;
            } 
            else if(type === 'barChart') {
                contentHtml = `
                    <div class="visual-header"><strong>التقدم الفعلي والمخطط</strong> <button class="remove-btn" onclick="removeWidget(this)">×</button></div>
                    <div id="chart_${widgetCount}" style="width:100%; height:80%;"></div>`;
                defaultWidth = 6; defaultHeight = 4;
            }
            else if(type === 'textBlock') {
                contentHtml = `
                    <div class="visual-header"><strong>نص ملاحظات</strong> <button class="remove-btn" onclick="removeWidget(this)">×</button></div>
                    <textarea style="width:100%; height:75%; border:1px solid #ccc; padding:10px; border-radius:4px;" placeholder="اكتب ملاحظاتك هنا..."></textarea>`;
                defaultWidth = 4; defaultHeight = 3;
            }

            // إضافة العنصر إلى الشبكة
            let el = grid.addWidget({ w: defaultWidth, h: defaultHeight, content: contentHtml });
            
            // تهيئة الرسم البياني إذا كان النوع BarChart
            if(type === 'barChart') {
                setTimeout(() => {
                    new ApexCharts(document.querySelector(`#chart_${widgetCount}`), {
                        chart: { type: 'bar', height: '100%', parentHeightOffset: 0, toolbar: { show: false } },
                        series: [{ name: 'مخطط', data: [40, 50, 60] }, { name: 'فعلي', data: [35, 55, 58] }],
                        xaxis: { categories: ['يناير', 'فبراير', 'مارس'] },
                        colors: ['#d4a373', '#1a2b4c']
                    }).render();
                }, 100); // تأخير بسيط لضمان بناء الـ DOM
            }
        }

        // إزالة Visual
        function removeWidget(btn) {
            let item = btn.closest('.grid-stack-item');
            grid.removeWidget(item);
        }

        // حفظ التصميم (هنا يتم استخراج الـ X, Y, W, H لحفظها في قاعدة البيانات لاحقاً)
        function saveLayout() {
            let layoutData = grid.save();
            console.log("إحداثيات الشاشة التي يجب حفظها في الباك إند:", layoutData);
            alert("تم التقاط أبعاد ومقاسات الأشكال! (انظر Console). الخطوة القادمة هي إرسالها لـ Flask.");
        }
    </script>
</body>
</html>
